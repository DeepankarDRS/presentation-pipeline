# Deck complexity MAXIMA — a long deck where every slide is dense and every
# component kind (title, narrative, caption, kpi_row, bullet_list, chart, table)
# appears at least once, several of them stacked on the same slide. Stresses:
# per-slide generation under load, cross-slide theme consistency over many
# slides, token summing, and deck-level compile of a large assembled tree.
#
#   python python/deck.py --deck-file tests/decks/maximal-deck.yaml --dry-run
#   python python/deck.py --deck-file tests/decks/maximal-deck.yaml
#
title: Q3 FY26 Full Operating Review (Maxima)
objective: >
  The ceiling case for the deck pipeline: eight data-heavy slides, every
  component kind represented, multiple visual objects per slide.
theme: graphite-dark

slides:
  - objective: Open the review.
    request: >
      A title slide: small uppercase kicker, bold one-line headline, thin accent
      rule, two framing sentences, and a small italic caption naming the audience.
    components: [title, narrative, caption]
    supplied_content:
      kicker: "Q3 FY26 BUSINESS REVIEW"
      caption: "Prepared for the executive team"

  - objective: Headline metrics at a glance.
    request: >
      A bold title, then a row of FIVE KPI tiles (ARR, NRR, Gross Margin, CAC
      Payback, Logo Retention) — each a card with a muted label, a large bold
      value with a small unit span, and a coloured delta line. A one-line italic
      footnote under the row.
    components: [title, kpi_row, caption]
    supplied_content:
      kpi_labels: [ARR, NRR, Gross Margin, CAC Payback, Logo Retention]

  - objective: Revenue and margin trajectory together.
    request: >
      A bold title and three columns: a bar chart of revenue over six quarters
      on the left, a line chart of gross margin over the same six quarters in the
      middle, and a narrow five-item bullet list of takeaways on the right. Each
      chart on its own card with a small uppercase label.
    components: [title, chart, bullet_list]
    supplied_content:
      periods: [Q2 FY25, Q3 FY25, Q4 FY25, Q1 FY26, Q2 FY26, Q3 FY26]
      left_chart: "revenue ($M), bar"
      middle_chart: "gross margin (%), line"

  - objective: Break the quarter down three ways.
    request: >
      A bold title, then THREE tables side by side — by segment, by region, by
      product — each with columns Name / ARR / QoQ and a bold total row. A
      one-line italic footnote under the row of tables.
    components: [title, table, caption]
    supplied_content:
      table_1: "By segment: Enterprise, Mid-Market, SMB"
      table_2: "By region: Americas, EMEA, APAC"
      table_3: "By product: Platform, Analytics, Billing"
      columns: [Name, ARR, QoQ]

  - objective: One-slide operating dashboard.
    request: >
      A compact title, then a 2x2 grid of cards filling the slide: top-left a bar
      chart of new ARR by quarter, top-right a table of the top three accounts
      (Account / ARR / QoQ), bottom-left a table of pipeline by stage (Stage /
      Value / Count), bottom-right a doughnut chart of ARR mix by segment. Every
      card has a small uppercase label.
    components: [title, chart, table]
    supplied_content:
      top_left: "New ARR by quarter, bar"
      top_right: "Top accounts table"
      bottom_left: "Pipeline by stage table"
      bottom_right: "ARR mix by segment, doughnut"

  - objective: Everything on one slide.
    request: >
      An extremely dense slide: bold title with accent rule, a row of four KPI
      tiles, then two columns — left a bar chart of revenue over four quarters,
      right a four-column table (Segment / ARR / QoQ / Notes) with three rows and
      a bold total. A pinned italic footnote. Must fit 1280x720 with no overflow.
    components: [title, kpi_row, chart, table, caption]
    supplied_content:
      kpi_labels: [ARR, NRR, Gross Margin, CAC Payback]
      quarters: [Q4 FY25, Q1 FY26, Q2 FY26, Q3 FY26]
      table_columns: [Segment, ARR, QoQ, Notes]
      segments: [Enterprise, Mid-Market, SMB]

  - objective: The written read.
    request: >
      A bold title, then two columns: left a line chart of ARR actual vs plan
      across four quarters, right four short paragraphs interpreting the trend,
      the risks, and the plan for next quarter. A small italic source line.
    components: [title, chart, narrative, caption]
    supplied_content:
      left_chart: "ARR actual vs plan, line, 4 quarters"

  - objective: Close with the scorecard.
    request: >
      A compact title, a KPI row of four tiles, then a six-row scorecard table
      (Objective / Owner / Status) with colour-coded status text, and a
      one-line closing statement beneath it.
    components: [title, kpi_row, table, narrative]
    supplied_content:
      kpi_labels: [ARR, NRR, Gross Margin, CAC Payback]
      scorecard_columns: [Objective, Owner, Status]

content_source: >
  titles, labels, periods, KPI names and table headers supplied; all figures and
  all prose invented by the model and kept internally consistent across slides.
