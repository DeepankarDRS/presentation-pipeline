# Deck complexity MINIMA — one slide, one line. The smallest thing deck.py can
# assemble: a single <Slide> under one shared <Theme>. Exercises the assembly
# path (theme strip + prepend, theme_consistent, deck compile) with nothing
# else in the way.
#
#   python python/deck.py --deck-file tests/decks/minimal-deck.yaml --dry-run
#   python python/deck.py --deck-file tests/decks/minimal-deck.yaml
#
title: One-Slide Deck
objective: The floor case for deck assembly — a single statement slide.
theme: sky-minimal

slides:
  - objective: State the one thing that matters.
    request: >
      A single centred, bold sentence (6-10 words) stating the strategic
      priority for the year. No title, no chart, no table, no caption.
    components: [narrative]

content_source: LLM invents the line
