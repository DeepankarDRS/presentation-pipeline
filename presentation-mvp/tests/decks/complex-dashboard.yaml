# Phase 9 deck spec — deliberately DENSE slides to stress the pipeline:
# multiple charts and multiple tables on a single slide, a 2x2 dashboard,
# and a KPI + trend + scorecard executive view.
#
#   python python/deck.py --deck-file tests/decks/complex-dashboard.yaml --dry-run
#   python python/deck.py --deck-file tests/decks/complex-dashboard.yaml
#
# Hand-authored, compile-verified reference XML for every slide lives in
# tests/decks/complex/slide-*.xml (assembled deck: output/complex/deck/presentation.pptx).

title: Q3 FY26 Operating Review (Dense)
objective: >
  A data-heavy quarterly review: two-chart comparisons, side-by-side detail
  tables, a four-quadrant operating dashboard, and a single-slide executive
  scorecard. Every slide packs multiple visual objects.
theme: graphite-dark

slides:
  - objective: Open the review.
    request: >
      A title slide: a small uppercase kicker, a bold one-line headline, a thin
      accent rule, two sentences framing the quarter, and a small italic caption
      naming the audience.
    components: [title, narrative, caption]
    supplied_content:
      kicker: "Q3 FY26 BUSINESS REVIEW"
      caption: "Prepared for the executive team"

  - objective: Show revenue and margin trajectory together.
    request: >
      A slide with a bold title and THREE columns: a bar chart of revenue over
      the last six quarters on the left, a line chart of gross margin over the
      same six quarters in the middle, and a narrow bullet-list column on the
      right with three or four takeaways. Put each chart on its own card with a
      small uppercase label above it.
    components: [title, chart, bullet_list]
    supplied_content:
      periods: [Q2 FY25, Q3 FY25, Q4 FY25, Q1 FY26, Q2 FY26, Q3 FY26]
      left_chart: "revenue ($M), bar"
      middle_chart: "gross margin (%), line"

  - objective: Break the quarter down three ways.
    request: >
      A bold title, then THREE tables side by side — one by segment, one by
      region, one by product — each with columns Name / ARR / QoQ and a bold
      total row. A one-line italic footnote under the row of tables.
    components: [title, table]
    supplied_content:
      table_1: "By segment: Enterprise, Mid-Market, SMB"
      table_2: "By region: Americas, EMEA, APAC"
      table_3: "By product: Platform, Analytics, Billing"
      columns: [Name, ARR, QoQ]

  - objective: One-slide operating dashboard.
    request: >
      A compact title, then a 2x2 grid of cards filling the slide: top-left a bar
      chart of new ARR by quarter, top-right a table of the top three accounts
      (Account / ARR / QoQ), bottom-left a table of pipeline by stage (Stage /
      Value / Count), bottom-right a doughnut chart of ARR mix by segment. Every
      card has a small uppercase label.
    components: [title, chart, table]
    supplied_content:
      top_left: "New ARR by quarter, bar"
      top_right: "Top accounts table"
      bottom_left: "Pipeline by stage table"
      bottom_right: "ARR mix by segment, doughnut"

  - objective: Executive scorecard.
    request: >
      A compact title, then a KPI row of four tiles (label, big value with small
      unit, delta line), then two columns: a line chart of ARR actual vs plan
      across four quarters on the left, and a four-row scorecard table
      (Objective / Status) on the right.
    components: [title, kpi_row, chart, table]
    supplied_content:
      kpi_labels: [ARR, NRR, Gross Margin, CAC Payback]
      left_chart: "ARR actual vs plan, line, 4 quarters"
      right_table: "Objective / Status scorecard, 4 rows"

content_source: >
  titles, labels, periods, and table row-names supplied; all figures and prose
  invented by the model.
