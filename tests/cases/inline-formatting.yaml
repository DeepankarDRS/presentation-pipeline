# Phase D test case. Consumed by slide_ir.from_test_case().
name: inline-formatting
phase: D
objective: Demonstrate all Phase D inline formatting tags (A, U, S, Sub, Sup) in Text, Li, and Td.
request: >
  A two-column slide demonstrating inline formatting. Title "Formatting Reference"
  at top. Left column: three text blocks showing hyperlinks (<A>), underline (<U>),
  strikethrough (<S>), subscript (<Sub>), and superscript (<Sup>) in running prose.
  Right column: a bullet list using inline tags, and a small two-column table
  with inline formatting in cells. Make it look like a reference card.
theme: corporate-slate
components:
  - title
  - narrative
  - bullet_list
  - table
supplied_content:
  title: "Inline Formatting Reference"
  text_examples:
    - "Revenue grew 18% QoQ (superscript footnote ref)"
    - "Was $99/month (strikethrough), now $79/month"
    - "Reducing CO2 (subscript) emissions by 40%"
    - "Visit our docs (hyperlink) for details"
content_source: All text supplied.
expect:
  compiles: true
  nodes_used: [Slide, Theme, VStack, HStack, Text, A, U, S, Sub, Sup, Ul, Li, Table, Tr, Td, Col, Shape]
