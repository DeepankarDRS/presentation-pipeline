# Complexity MAXIMA — every Phase A/B/C component on ONE 1280x720 slide, packed
# to the edge of overflow. This is the ceiling case: it exercises the full node
# vocabulary, the FORBIDDEN blocklist under load, KPI + chart + table + bullets
# competing for the same vertical budget, and the "everything must fit" rule.
# If layout is going to break, it breaks here first.
#
#   python python/generate.py --test-case-file tests/cases/maximal-density.yaml --dry-run
#   python python/generate.py --test-case-file tests/cases/maximal-density.yaml
#
name: maximal-density
phase: ABC
objective: Fit an entire quarterly operating review onto a single dense slide.
request: >
  An extremely dense Q3 FY26 operating-review slide. Top: a small uppercase
  kicker, a bold one-line title, and a thin accent rule. Directly under it, a
  row of FOUR KPI tiles (ARR, NRR, Gross Margin, CAC Payback) — each a card with
  a muted label, a large bold value with a small unit span, and a coloured delta
  line. Below the KPI row, three balanced columns: left a bar chart of revenue
  over six quarters, middle a line chart of gross margin over the same six
  quarters, right a five-row bullet list of takeaways. Below the columns, a
  compact four-column table (Segment / ARR / QoQ / Notes) with Enterprise,
  Mid-Market and SMB rows plus a bold total row. A one-line italic footnote
  pinned to the bottom edge. Everything must fit inside 1280x720 with no
  overflow and no clipping — tighten gaps and font sizes as needed.
theme: graphite-dark
components:
  - title
  - kpi_row
  - chart
  - bullet_list
  - table
  - caption
supplied_content:
  kicker: "Q3 FY26 OPERATING REVIEW"
  title: "The Whole Quarter, One View"
  kpi_labels: [ARR, NRR, Gross Margin, CAC Payback]
  periods: [Q2 FY25, Q3 FY25, Q4 FY25, Q1 FY26, Q2 FY26, Q3 FY26]
  left_chart: "revenue ($M), bar"
  middle_chart: "gross margin (%), line"
  table_columns: [Segment, ARR, QoQ, Notes]
  segments: [Enterprise, Mid-Market, SMB]
  caption: "Figures illustrative — prepared for the executive team"
content_source: >
  kicker, title, KPI labels, periods, table headers, segment names and caption
  supplied; every figure and every prose line invented and internally consistent
expect:
  compiles: true
  no_overflow: true
  nodes_used: [Slide, Theme, VStack, HStack, Text, Span, Shape, Ul, Li,
               Chart, ChartSeries, ChartDataPoint, Table, Col, Tr, Td]
  # Ceiling case — the contract is expected to unlock the full vocabulary.
  min_kpi_tiles: 4
  min_chart_count: 2
  min_table_rows: 4
