# LLM_TEST_PLAN Family A — base prompt, no components. Planner must decompose.
name: base-strategy-statement
objective: One bold strategic claim, planner chooses the form.
request: >
  Create a single slide that makes one bold strategic claim about our company's
  priorities for 2026. It should feel like a keynote opening — one line everyone
  remembers — with a short supporting sentence underneath.
theme: corporate-slate
content_source: LLM invents everything
expect:
  compiles: true
  planner_should_pick: [title, narrative]
  layout: hero_statement
  watch: planner not adding charts/KPIs that were not asked for
