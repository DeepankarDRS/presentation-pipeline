# Complexity MINIMA — the smallest slide the pipeline can be asked to build.
# One centred line of text, nothing else. No title rule, no body, no supplied
# content. Useful as the floor case: if this ever fails to compile or the
# contract balloons past {Slide, Theme, VStack, Text}, something regressed.
#
#   python python/generate.py --test-case-file tests/cases/minimal-statement.yaml --dry-run
#
name: minimal-statement
phase: A
objective: Put a single strategic sentence on screen and nothing else.
request: >
  A slide with exactly one line: a bold, vertically and horizontally centred
  sentence of 5-9 words stating the theme for the year. No title, no subtitle,
  no caption, no shape, no chart, no table.
theme: sky-minimal
components:
  - narrative
supplied_content: {}
content_source: LLM invents the single line
expect:
  compiles: true
  no_overflow: true
  # Hard floor — the contract for this slide must not exceed these nodes.
  nodes_used: [Slide, Theme, VStack, Text]
  max_text_nodes: 1
