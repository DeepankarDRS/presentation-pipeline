# Post-MVP test case: Matrix with rich quadrant content.
name: matrix-prioritization
phase: post-mvp
objective: Show an effort-vs-impact prioritization matrix with 8 labeled items across all four quadrants.
request: >
  A prioritization matrix slide. Title "Q4 Feature Prioritization" with subtitle
  "Effort vs Impact Analysis — Product Team Review". The matrix axes are Effort
  (x-axis, low to high) and Impact (y-axis, low to high). Quadrant labels:
  top-left "Big Bets", top-right "Quick Wins", bottom-left "Money Pit",
  bottom-right "Fill-Ins". Place 8 features as colored dots: high-impact items
  in blue tones, medium in amber, low in gray. Add a caption at the bottom
  with the review date. Use the corporate-slate theme.
theme: corporate-slate
components:
  - title
  - matrix
  - caption
supplied_content:
  title: "Q4 Feature Prioritization"
  subtitle: "Effort vs Impact Analysis — Product Team Review"
  items:
    - { label: "AI Search",        x: 0.3, y: 0.9,  note: "high impact, low effort" }
    - { label: "SSO Integration",  x: 0.8, y: 0.85, note: "high impact, high effort" }
    - { label: "Dark Mode",        x: 0.2, y: 0.6,  note: "medium impact, low effort" }
    - { label: "Mobile App",       x: 0.9, y: 0.7,  note: "medium-high impact, very high effort" }
    - { label: "CSV Export",       x: 0.15, y: 0.45, note: "medium impact, very low effort" }
    - { label: "Custom Themes",    x: 0.5, y: 0.3,  note: "low impact, medium effort" }
    - { label: "Legacy API v1",    x: 0.75, y: 0.2,  note: "low impact, high effort" }
    - { label: "Tooltip Revamp",   x: 0.35, y: 0.15, note: "low impact, low-medium effort" }
  caption: "Reviewed 2026-09-01 · Product & Engineering · Scores normalized 0–1"
content_source: All items and positions supplied; colors invented by LLM.
expect:
  compiles: true
  nodes_used: [Slide, Theme, VStack, Text, Shape, Matrix, MatrixAxes, MatrixQuadrants, MatrixItem]
