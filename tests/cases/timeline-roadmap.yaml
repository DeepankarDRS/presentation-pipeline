# Phase D test case. Consumed by slide_ir.from_test_case().
name: timeline-roadmap
phase: D
objective: Show a product roadmap as a horizontal timeline with milestones.
request: >
  A timeline slide for a product roadmap. Bold title at the top with an accent
  bar. Below that, a horizontal timeline showing five quarterly milestones from
  Q1 to Q4 2026 plus a Q1 2027 target. Each milestone has a date, a title, and
  a one-line description. Use different accent colors per milestone to signal
  phase (blue for dev, green for launch, purple for expansion).
theme: corporate-slate
components:
  - title
  - timeline
supplied_content:
  title: "Product Roadmap 2026-2027"
  milestones:
    - { date: "Q1 2026", title: "Alpha", description: "Internal testing" }
    - { date: "Q2 2026", title: "Beta", description: "Early adopter program" }
    - { date: "Q3 2026", title: "GA Release", description: "Public launch with SLA" }
    - { date: "Q4 2026", title: "Enterprise", description: "SSO and audit logs" }
    - { date: "Q1 2027", title: "Platform", description: "API and integrations" }
content_source: Milestones supplied; colors invented.
expect:
  compiles: true
  nodes_used: [Slide, Theme, VStack, Text, Shape, Timeline, TimelineItem]
