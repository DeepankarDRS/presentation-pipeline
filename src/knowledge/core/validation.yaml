# pom-knowledge/core/validation.yaml
# The blocklist + value constraints. This is the heart of the "selective context"
# hypothesis: an explicit FORBIDDEN section stops the LLM leaking HTML/CSS priors.
# Consumed by prompt_builder.py (FORBIDDEN section) and pre_validator.py (checks).

meta:
  phase: A
  pom_version: "10.3.0"

# ── Forbidden tags (LLM leaks these from HTML training) ───────────────────────
forbidden_tags:
  - br
  - "br/"
  - div
  - p
  - span_lowercase        # <span> is HTML; POM's inline tag is <Span> (capital S) — but do NOT emit raw <span>
  - hr
  - "hr/"
  - section
  - header
  - footer
  - article
  - main
  - ul_lowercase          # <ul>/<ol>/<li> lowercase are HTML; POM uses <Ul>/<Ol>/<Li> (Phase B)
  - table_lowercase
  - h1
  - h2
  - h3
  - img
  - a_lowercase           # <a> is HTML; POM's hyperlink inline tag is <A> (capital A, Phase D)
  - u_lowercase           # <u> is HTML; POM's underline inline tag is <U> (capital U, Phase D)
  - s_lowercase           # <s> is HTML; POM's strikethrough inline tag is <S> (capital S, Phase D)
  - sub_lowercase         # <sub> is HTML; POM's subscript inline tag is <Sub> (capital S, Phase D)
  - sup_lowercase         # <sup> is HTML; POM's superscript inline tag is <Sup> (capital S, Phase D)
  - svg_lowercase         # <svg> is HTML; POM's inline SVG node is <Svg> (capital S, Phase D)
  - strong
  - em
  - blockquote
notes_on_forbidden_tags:
  - "POM rejects a genuinely unknown tag with ParseXmlError 'Unknown tag: <x>'."
  - "BUT a stray HTML closing tag like </br> inside <Text> is SILENTLY DROPPED by the XML parser — POM will not error. The pre-validator MUST catch these because the compiler won't."
  - "Newlines: there is no <br>. Use separate <Text> nodes in a VStack, or rely on wrapping within one <Text> (set an explicit w so it wraps)."

# ── Forbidden attributes (HTML / CSS / React) ────────────────────────────────
forbidden_attributes:
  - style
  - class
  - className
  - onClick
  - onchange
  - src_on_non_image       # src only valid on Image/Svg (Phase B+)
  - width                  # use w
  - height                 # use h
  - "font-size"            # use fontSize
  - "text-align"           # use textAlign
  - "background-color"     # use backgroundColor
  - "border-radius"        # use borderRadius
  - "flex-direction"       # use VStack / HStack
  - flex                   # use grow
  - justify                # use justifyContent
  - align                  # use alignItems
  - display
  - float

# ── NOT-this -> use-this (put this table in the prompt) ──────────────────────
translations:
  - { wrong: 'width="600"',            right: 'w="600"' }
  - { wrong: 'height="400"',           right: 'h="400"' }
  - { wrong: 'font-size: 24px',        right: 'fontSize="24"' }
  - { wrong: 'style="color:#f00"',     right: 'color="FF0000"' }
  - { wrong: 'class="card"',           right: '(no equivalent — use explicit attributes)' }
  - { wrong: '<br/>',                  right: 'separate <Text> nodes in a <VStack>' }
  - { wrong: '<div>',                  right: '<VStack> or <HStack>' }
  - { wrong: '<p>',                    right: '<Text>' }
  - { wrong: '<span>',                 right: '<Span> (capital S), only inside <Text>' }
  - { wrong: 'color="#FF0000"',        right: 'color="FF0000"  (# is tolerated in v10.3.0 but omit it)' }
  - { wrong: 'color="red"',            right: 'color="FF0000"  (named colors throw at render)' }
  - { wrong: 'flex="1"',               right: 'grow="1"' }
  - { wrong: 'justifyContent="left"',  right: 'justifyContent="start"' }
  - { wrong: 'alignItems="right"',     right: 'alignItems="end"' }
  - { wrong: 'textAlign="start"',      right: 'textAlign="left"' }
  - { wrong: '<a href="...">',        right: '<A href="..."> (capital A, Phase D inline tag)' }
  - { wrong: '<sub>',                 right: '<Sub> (capital S, Phase D inline tag)' }
  - { wrong: '<sup>',                 right: '<Sup> (capital S, Phase D inline tag)' }
  - { wrong: '<u>',                   right: '<U> (capital U, Phase D inline tag)' }
  - { wrong: '<s>',                   right: '<S> (capital S, Phase D inline tag)' }
  - { wrong: '<svg>',                 right: '<Svg> (capital S, Phase D) — wraps an inner <svg> child element' }

# ── Value constraints (Type 3 render errors pass XML parsing then fail) ───────
value_constraints:
  dimensions:
    rule: "w, h, and numeric sizes must be finite and > 0. Always emit real positive sizes."
    never: [ 'w="0"', 'h="0"', 'w="-10"', 'fontSize="0"' ]
    render_error: 'addTextBox: width must be a finite positive EMU value  (also "height must be a finite positive EMU value")'
    verified_v10_3_0:
      - "h=\"0\" on a text-bearing container THROWS at render (addTextBox height must be finite positive)."
      - "w=\"0\" explicit on <Text> THROWS at render."
      - "w=\"0\" / w=\"-5\" on a bare <Shape> (no text) does NOT throw — it just renders nothing. Still forbid it: a zero-size node is always a mistake."
    note: "These are Type 3 errors: they pass parseXml and only throw during PPTX render."
  gap:
    rule: "gap should be >= 0. gap=\"0\" does NOT error in v10.3.0 — but prefer omitting it (style, not validity)."
  padding:
    rule: "padding should be >= 0. padding=\"0\" does NOT error — prefer omitting it."
  opacity:
    rule: "0 <= opacity <= 1"
  percentages:
    rule: 'w="<n>%" / h="<n>%": values > 100% parse fine but usually trigger NODE_OUT_OF_BOUNDS. Keep <= 100.'
  colors:
    rule: "Use exactly 6 hex digits. In v10.3.0 a leading '#' is TOLERATED (POM strips it) and lowercase is fine — but emit bare 6-digit hex for consistency."
    valid: [ "0F172A", "FF0000", "3b82f6" ]
    tolerated_but_discouraged: [ "#0F172A", "F00" ]   # 3-digit passed in testing; # is stripped
    invalid_throws_at_render:
      - "red"          # named colors: 'must be an srgb 6-digit hex color'
      - "FF"           # 2-digit
      - "FF0000AA"     # 8-digit / alpha
      - "rgb(0,0,0)"
    exception: "backgroundGradient / textGradient strings use CSS gradient syntax and DO allow '#'."
  enum_attributes:
    rule: "A wrong enum value (e.g. textAlign=\"start\") throws a clean ParseXmlError: 'Invalid value for attribute \"X\". Expected: ...'. Follow the allowed value lists in components/*.yaml exactly."

# ── Semantic rules from llm.txt "Notes" ─────────────────────────────────────
semantic_rules:
  - "alignItems / justifyContent use start / center / end (NOT left / right)."
  - "textAlign uses left / center / right (NOT start / end)."
  - "Property names are w / h, never width / height."
  - "A <Slide> must have at least one child."
  - "At most one <Theme>, at the top level, before the slides."
  - "$token references only resolve inside color attributes and gradient strings — never in text content or non-color attributes."
  - "Referencing an undefined $token is a validation error."
  - "Arrow from/to must reference valid id attributes on connectable nodes (Text, Shape with rect/roundRect/ellipse)."
  - "Layer children must specify x and y for absolute positioning."
  - "FlowConnection from/to must reference FlowNode ids within the same Flow."
  - "MatrixItem x and y must be 0-1 normalised floats."

# ── Build diagnostics (warnings, not parse errors) ──────────────────────────
diagnostics:
  NODE_OUT_OF_BOUNDS:
    meaning: "A node's rectangle extends past the 1280x720 slide."
    fix: "Shrink/move the node, reduce content, or split the slide."
    mvp_policy: "Treat as a failure for the experiment (a slide with clipped content is not a pass)."
  NODE_OVERLAP:
    meaning: "Siblings in a VStack/HStack overlap unintentionally."
    fix: "Remove stray top/left offsets or negative margins."
  AUTOFIT_OVERFLOW:
    meaning: "Content taller than the slide even after autofit shrinking."
    fix: "Less text / smaller fontSize / fewer nodes."

# ── Auto-fix candidates for pre_validator.py ────────────────────────────────
auto_fixable:
  - { issue: "leading # on a plain color attribute", action: "strip the #" }
  - { issue: "<br/> or </br> inside <Text>",         action: "delete the tag" }
  - { issue: "markdown code fence around the whole document (```xml ... ```)", action: "strip the fence" }
  - { issue: 'gap="0" / padding="0"',                 action: "remove the attribute" }
not_auto_fixable:
  - "<div>/<p>/<span> structural tags — needs regeneration (changes the tree)"
  - 'w="0" / h="0" — the model must choose a real size'
  - "invented attributes like className — needs regeneration"
