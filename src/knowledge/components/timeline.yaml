# pom-knowledge/components/timeline.yaml
# <Timeline> + <TimelineItem>. Phase D.
# Source: pom.pptx.app/nodes. Verified against @hirokisakabe/pom v10.3.0.

meta:
  phase: D
  nodes: [Timeline, TimelineItem]

description: >
  A timeline / roadmap visualization. One <Timeline> wraps one or more
  <TimelineItem> entries rendered as a connected sequence of dated milestones.
  Use horizontal for left-to-right chronology, vertical for top-to-bottom roadmaps.

structure: |
  <Timeline direction="horizontal" w="1100" h="300"
            dateColor="$textMuted" titleColor="$textMain"
            descriptionColor="$textMuted" connectorColor="$accent">
    <TimelineItem date="Q1 2026" title="Alpha Launch" description="Internal beta release" color="2563EB" />
    <TimelineItem date="Q2 2026" title="Public Beta" description="Open to early adopters" color="0EA5E9" />
    <TimelineItem date="Q3 2026" title="GA Release" description="Full production launch" color="15803D" />
    <TimelineItem date="Q4 2026" title="Enterprise Tier" description="SSO, audit logs, SLA" color="7C3AED" />
  </Timeline>

Timeline_attributes:
  direction:         { type: enum, values: [horizontal, vertical], default: horizontal }
  dateColor:         { type: hex, default: "64748B", note: "Color for date labels" }
  titleColor:        { type: hex, default: "1E293B", note: "Color for title labels" }
  descriptionColor:  { type: hex, default: "64748B", note: "Color for description text" }
  connectorColor:    { type: hex, default: "E2E8F0", note: "Color for the connecting line/dots" }
  connectorGradient: { type: string, note: "linear-gradient syntax for gradient connector" }
  useColorForDate:   { type: bool, note: "When true, date uses the item's color instead of dateColor" }
  fontFamily:        { type: string, default: "Noto Sans JP" }
  w:                 { type: number, note: "Explicit width — required" }
  h:                 { type: number, note: "Explicit height — required" }

TimelineItem_attributes:
  date:        { type: string, required: true, note: "Date label (e.g. 'Q1 2026', 'Jan 2026', '2026-03-01')" }
  title:       { type: string, required: true, note: "Milestone title" }
  description: { type: string, note: "Optional description text below the title" }
  color:       { type: hex, note: "Accent color for this milestone's dot/marker" }
  dateColor:   { type: hex, note: "Override timeline-level dateColor for this item" }

notes:
  - "Timeline needs explicit w and h — it does not auto-size."
  - "3-6 items work well. More than 8 gets cramped horizontally at 1280 wide."
  - "Use horizontal for a left-to-right chronology, vertical for a top-to-bottom roadmap."
  - "Each item's color sets the dot/marker accent. Use the palette's accent, positive, negative tokens for semantic milestones."

pitfalls:
  - "Missing w/h on Timeline — will not render correctly."
  - "date and title are both required on every TimelineItem."
  - "Too many items (>8) in horizontal mode will cause cramping or overflow."
