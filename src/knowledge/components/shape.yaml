# pom-knowledge/components/shape.yaml
# The <Shape> node. Phase A already allows Shape; this file is the fuller
# reference pulled in when a slide leans on shapes (accent bars, KPI dots,
# plates, simple badges).
# Source: llm.txt "Shape" section. Verified against @hirokisakabe/pom v10.3.0.

meta:
  phase: A
  node: Shape

description: >
  A native PowerPoint shape with optional centred text. In the MVP it is used
  for three things: a thin accent rule under a title, a small category dot in a
  KPI tile, and a rounded plate behind content. Not for diagrams (Phase D).

attributes:
  shapeType:   { type: enum, required: true, note: "See phase_ab_subset below. 178 exist; stay in the subset." }
  text:        { type: string, note: "Centred text inside the shape." }
  fill:        { type: object, note: 'fill.color="1D4ED8"  fill.transparency="0.5"' }
  line:        { type: object, note: 'line.color="hex"  line.width="2"  line.dashType="dash". line.width="0" removes the outline.' }
  outline:     { type: object, note: 'Text-style alias for line: outline.size / outline.color.' }
  glow:        { type: object, note: 'glow.size="10" glow.opacity="0.7" glow.color="3B82F6" (defaults 8 / 0.75 / FFFFFF). Use for a dot that pops on dark surfaces.' }
  rotate:      { type: number, note: "degrees clockwise, render-only" }
  # inner-text styling: fontSize, color, textAlign, bold, italic, underline,
  # strike, subscript, superscript, highlight, fontFamily, lineHeight
  # plus all common box attributes (w, h, grow, padding, margin, backgroundColor,
  # border*, borderRadius, opacity, alignSelf, shadow) from core/attributes.yaml

phase_ab_subset: [rect, roundRect, ellipse, triangle, diamond, pentagon, hexagon, octagon, plus, chevron, rightArrow, leftArrow, upArrow, downArrow, star5, heart, cloud]

notes:
  - "backgroundColor fills a rect the same way fill.color does; either works for an accent bar."
  - "A bare <Shape w=\"0\"> does NOT throw (renders nothing) — still never emit zero dimensions."
  - "For a KPI dot use shapeType=\"ellipse\" w=\"8-12\" h=\"8-12\". Add line.width=\"0\" to drop the default outline."

examples:
  accent_rule: |
    <Shape shapeType="rect" w="120" h="6" backgroundColor="$accent" />
  kpi_dot: |
    <Shape shapeType="ellipse" w="10" h="10" fill.color="$positive" line.width="0" />
  glowing_dot_on_dark: |
    <Shape shapeType="ellipse" w="10" h="10" fill.color="$accent" glow.size="10" glow.opacity="0.7" glow.color="$accent" />

pitfalls:
  - "shapeType is required. Omitting it is a ParseXmlError."
  - "Do not use Shape to fake a table or chart when Table/Chart exist (Phase B/C)."
