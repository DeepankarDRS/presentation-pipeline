    --border:   #243447;

    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 2px solid var(--steel);
  }

    font-size: 20px;
    font-weight: 700;
    letter-spacing: -.3px;
  }
  .page-header p {
    margin: 0;
    font-size: 12px;
    opacity: .75;

  }
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .stat-val {
    font-size: 22px;
    font-weight: 700;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--amber);
  }
  .stat-lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .06em;
    opacity: .65;
  }

  /* ── Table shell ─────────────────────────── */
  .table-wrap {
    padding: 24px 32px 48px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }
  thead th {
    background: var(--surface2);
    color: var(--textMid);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    font-weight: 600;
    padding: 10px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  thead th:first-child { border-radius: var(--radius) 0 0 0; }
  thead th:last-child  { border-radius: 0 var(--radius) 0 0; }

  /* ── Row ─────────────────────────────────── */
  tr.day-row {
    cursor: pointer;
    transition: background .15s;
  }
  tr.day-row td {
    padding: 13px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    background: var(--surface);
  }
  tr.day-row:hover td { background: var(--surface2); }
  tr.day-row.open td { background: var(--surface2); }

  .expand-row td {
    padding: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .expand-inner {
    padding: 0 14px 16px 56px;
    display: none;
  }
  .expand-inner.open { display: block; }

  .col-date {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--textMid);
    white-space: nowrap;
  }
  .col-day {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;

  .day-WED { color: #9B6DD6; }
  .day-THU { color: #D65B8F; }
  .day-FRI { color: var(--amber); }
  .day-SUN { color: #6DAE8F; }

    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    background: var(--amberBg);
    color: #B57800;
    padding: 3px 7px;
    border-radius: 4px;
    display: inline-block;
    white-space: nowrap;

  .col-goal {
    font-weight: 600;
    font-size: 13.5px;
    color: var(--text);
  }
  .col-desc {
    font-size: 12.5px;
    color: var(--textMid);
    max-width: 340px;
    line-height: 1.55;
  }
  .col-toggle {
    text-align: right;
    color: var(--steel);
    font-size: 12px;
    white-space: nowrap;
    user-select: none;
  }
  .chevron {
    display: inline-block;
    transition: transform .2s;
    font-size: 10px;
    margin-left: 4px;
  }
  tr.day-row.open .chevron { transform: rotate(180deg); }

  .sub-heading {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--textDim);
    margin: 12px 0 8px;

    padding: 0;
    margin: 0;
    display: flex;

    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12.5px;
    color: var(--textMid);

    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--steel);
    flex-shrink: 0;

    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    padding: 2px 7px;
    border-radius: 20px;
    display: inline-block;

    .page-header { padding: 20px 16px 18px; }
    .table-wrap  { padding: 16px 0 40px; }

const tbody = document.getElementById('tbody');

tickets.forEach((t, i) => {
  // Main row
  const tr = document.createElement('tr');
  tr.className = 'day-row';
  tr.dataset.idx = i;
  tr.innerHTML = `
    <td class="col-date">${t.date}</td>
    <td class="col-day day-${t.day}">${t.day}</td>
    <td><span class="col-id">${t.id}</span></td>
    <td class="col-goal">${t.goal}</td>
    <td class="col-desc">${t.desc}</td>
    <td><span class="badge ${t.today ? 'badge-today' : 'badge-done'}">${t.today ? 'Today' : 'Done'}</span></td>
    <td class="col-toggle">Subgoals <span class="chevron">▼</span></td>
  `;
  tbody.appendChild(tr);

  // Expand row
  const er = document.createElement('tr');
  er.className = 'expand-row';
  const subsHtml = t.subs.map(s => `<li><span class="sub-dot"></span>${s}</li>`).join('');
  er.innerHTML = `<td colspan="7">
    <div class="expand-inner" id="exp-${i}">
      <div class="sub-heading">Subgoals · ${t.subs.length} tasks</div>
      <ul class="subgoal-list">${subsHtml}</ul>
    </div>
  </td>`;
  tbody.appendChild(er);

  tr.addEventListener('click', () => {
    const inner = document.getElementById(`exp-${i}`);
    const isOpen = inner.classList.contains('open');
    inner.classList.toggle('open', !isOpen);
    tr.classList.toggle('open', !isOpen);
  });
});
