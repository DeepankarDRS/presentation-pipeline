# Phase 5 test case #4. Consumed by slide_ir.from_test_case().
# NOTE: Chart is a Phase B node. The knowledge base gains components/chart.yaml
# and the Chart/ChartSeries/ChartDataPoint allowlist in Phase 6 - until then the
# selective contract cannot fully support this case.
name: single-chart
phase: B
objective: Present one quarterly trend as a single full-width chart.
request: >
  A slide with a bold title and one full-width bar chart showing quarterly
  revenue for the last six quarters, trending upward. A one-line caption under
  the chart noting the growth rate. Accent-coloured bars.
theme: emerald-clean
components:
  - title
  - chart
  - caption
supplied_content:
  chart_type: bar
  series_label: "Revenue ($M)"
  periods: [Q2 FY25, Q3 FY25, Q4 FY25, Q1 FY26, Q2 FY26, Q3 FY26]
content_source: Chart type and periods supplied; values invented (upward trend)
expect:
  compiles: true
  nodes_used: [Slide, Theme, VStack, Text, Chart, ChartSeries, ChartDataPoint]
