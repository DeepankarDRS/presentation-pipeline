# Every component kind in 6 slides (2026-10-01): 2-4 components per slide, 17 in all. Denser
# than gate-deck-all-nodes-compact.yaml (9 slides) — tests how the planner and fit-grow handle
# busy slides. Each component is still inside its capacity.yaml limits; positions are stated so
# no two full-width diagrams sit side by side. Full pipeline (same graph as the UI):
#   python -m scripts.eval_run gate-deck-all-nodes-dense --label all-nodes-dense --repeat 1
name: gate-deck-all-nodes-dense
objective: 6-slide growth-strategy deck that uses every component kind with 2-4 components per slide (title, caption, narrative, hero stat, kpi_row, chart, table, pyramid, matrix, process_arrow, tree, layer, timeline, flow, bullet_list, card_grid grid and steps).
request: |
  You are a senior growth strategist. Create a polished, client-ready strategy deck for BREWLY,
  a direct-to-consumer specialty coffee brand selling on its own website and two quick-commerce
  apps (QUIKMART and DASHCART).

  STYLE:
  - Clean, modern, boardroom-ready. White background, dark text, warm coffee-brown accent with a teal secondary accent.
  - Use Indian currency format: ₹, L for lakhs, Cr for crores. Show ROAS as "2.4x", growth as "+38%".
  - Every slide headline states the conclusion, not the topic.
  - Keep every label short. Do not add any number that is not in this brief.

  CREATE THE DECK USING THIS 6-SLIDE STRUCTURE:

  SLIDE 1: Title Slide
  Headline:
  BREWLY Growth Strategy FY27
  Subtitle:
  Where we stand, what is working, and the 90-day plan to scale profitably
  Include (small line at the bottom):
  Prepared by the Growth Team | October 2026

  SLIDE 2: Performance Dashboard
  Headline:
  Repeat customers now drive most of BREWLY's revenue.
  Top row, metric tiles:
  - Annual revenue: ₹14.2Cr
  - Revenue growth: +38%
  - Blended ROAS: 2.4x
  - Customer acquisition cost: ₹410
  Bottom left, hero number (the one number the headline rests on):
  62% of revenue comes from repeat customers, up from 41% a year ago.
  Bottom right, bar chart of quarterly revenue (₹ Cr):
  Q1 FY26: 2.6 | Q2 FY26: 2.9 | Q3 FY26: 3.3 | Q4 FY26: 3.6 | Q1 FY27: 3.9 | Q2 FY27: 4.4
  Insight (one sentence, under the chart):
  Growth came from retention and pricing, not from buying more traffic.

  SLIDE 3: Channels and Priorities
  Headline:
  The website earns the best margin; bundles and referrals are the quick wins.
  Top, full width, table:
  Channel | Revenue | ROAS | Gross Margin
  Website | ₹7.1Cr | 3.1x | 64%
  QUIKMART | ₹4.3Cr | 2.2x | 55%
  DASHCART | ₹2.8Cr | 1.4x | 47%
  Bottom left, pyramid of brand priorities, top to bottom:
  - Category leadership
  - Loyal subscribers
  - Consistent experience
  - Fresh roast quality
  Bottom right, 2x2 matrix, x-axis Effort (low to high), y-axis Impact (low to high). Positions:
  - Bundle offers: low effort, high impact
  - Referral program: low effort, high impact
  - Own delivery fleet: high effort, high impact
  - Loyalty app: high effort, low impact

  SLIDE 4: How BREWLY Runs
  Headline:
  One team and one platform run a four-stage fulfilment chain.
  Top, full width, process (the order is the message):
  Roast → Pack → Dispatch → Deliver
  Bottom left, org chart:
  Head of Growth
  - Performance Lead
  - Retention Lead
  - Marketplace Lead
  Bottom right, architecture diagram, layers from top to bottom:
  - Channels: Website, QUIKMART, DASHCART
  - Customer data: profiles, purchase history
  - Operations: roastery, inventory, delivery

  SLIDE 5: Journey and Offers
  Headline:
  Five milestones built the brand; one decision flow now converts each visitor.
  Top, full width, timeline:
  - 2021: Café opens
  - 2022: Website launch
  - 2023: Subscriptions live
  - 2024: QUIKMART listing
  - 2025: DASHCART listing
  Bottom left (wide), flow:
  Visitor lands → Bought before? → Yes: Subscription offer / No: Trial pack → Checkout
  Bottom right (narrow), rules as plain takeaways:
  - Returning buyers never see the trial pack
  - First-time visitors get one offer
  - Every offer ends at one checkout

  SLIDE 6: Pillars and 90-Day Plan
  Headline:
  Four pillars and a 90-day plan take BREWLY from audit to scale.
  Top, pillars (no order between them), one row:
  - Subscriptions: deepen repeat buying
  - Bundles: lift order value
  - Gifting: open corporate demand
  - Content: build the community
  Bottom, 90-day plan (ordered phases, each with detail):
  - Month 1 Audit: channel economics review, offer audit
  - Month 2 Activate: launch bundles, start referral pilot
  - Month 3 Scale: shift budget to winning channels, expand subscriptions
content_source: fully specified per slide; every number is in the brief
slide_count: 6
expect:
  compiles: true
  slide_count: 6
  watch: >
    intended kinds — 1 title + caption; 2 kpi_row + kpi_row count 1 (hero stat) + chart (bar) + narrative;
    3 table + pyramid + matrix; 4 process_arrow + tree + layer; 5 timeline + flow + bullet_list;
    6 card_grid (grid, 4 in one row) + card_grid (steps). No numbers beyond the brief.
