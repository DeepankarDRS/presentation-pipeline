# GATE deck (user prompt, 2026-09-23, verbatim). Run: python -m scripts.eval_run gate-deck-agency-takeover --label x
name: gate-deck-agency-takeover
objective: 6-slide audit/takeover deck from raw per-slide data (tables, gap matrix, roadmap).
request: |
  USER REQUEST: You are an expert performance marketing strategist and presentation copywriter working for a top-tier digital agency. Your tone is confident, data-driven, objective, and solution-oriented.  Task: I have raw audit data from a recent performance marketing evaluation for a client. Your task is to transform this data into a polished, persuasive 6-slide presentation deck.  Slide Mapping (Condense the data into exactly 6 slides):  Slide 1: [Platform A] Campaign Diagnosis (Focus on campaign classes and ROAS).  Slide 2: [Platform A] Keyword & City Inefficiencies (Combine the keyword/match-type data and the city-level opportunity data to show granular leakage).  Slide 3: Cross-Platform Gap Summary (Compare the operational gaps between [Platform B] and [Platform A]).  Slide 4: Our Agency's Growth System (The 6 pillars of what we will do differently).  Slide 5: 30/60/90-Day Takeover Roadmap (Stabilize, Rebuild, Scale).  Slide 6: Closing Recommendation & Data Needed (The pitch to take over, plus the data requirements).  Output Format Requirements for EACH Slide:  Slide Number & Title: (Keep it punchy)  Headline: (The main takeaway message for the slide)  Key Points: (Bulleted text to appear on the slide; keep it concise and impactful)  Visual Suggestion: (Briefly describe the best chart, table, or graphic to display the data)  Speaker Notes: (A brief script or talking points the presenter should say to explain the slide)  Here is the raw data to use:  --- START OF RAW DATA ---  SLIDE 1: [Platform A] Campaign Class Diagnosis  Headline: Campaign-purpose governance is the biggest [Platform A] unlock.  Generic search consumed the largest budget pool and returned around 0.29x ROAS.  CPD/BOTD placements consumed around ₹10.0L and generated only around ₹9.7K revenue.  Category / PLA campaigns were stronger at around 0.80x ROAS.  Brand campaigns were strong at around 0.99x ROAS but under-allocated.  Competitor campaigns were weak at around 0.15x ROAS.  Recommendation: Separate performance media from visibility/awareness placements. CPD/BOTD should not be funded like performance campaigns unless the objective is clearly awareness or incrementality.  SLIDE 2 DATA A: [Platform A] Keyword & Match-Type Diagnosis  Headline: Exact match outperforms phrase and broad, but keyword governance needs sharper control.  Phrase Match: Spend ₹45.5L, Rev ₹14.6L, 0.32x ROAS, CPC ₹62.0, CVR 8.6%.  Exact Match: Spend ₹21.3L, Rev ₹8.8L, 0.41x ROAS, CPC ₹59.5, CVR 10.9%.  Broad Match: Spend ₹1.9L, Rev ₹0.4L, 0.23x ROAS, CPC ₹64.7, CVR 6.2%.  Winners: [Brand] phrase, [Brand] exact, paneer makhani, curry, shahi paneer gravy.  Weak terms: butter chicken phrase, instant food phrase, ready to cook paneer phrase, mix phrase, instant gravy broad, ready masala, instant dal makhani, meat masala, kilrr chicken masala.  Recommendation: Scale exact winners, reduce phrase/broad leakage, and create strict budgets for competitor and generic discovery terms.  SLIDE 2 DATA B: [Platform A] City-Level Opportunity  Headline: City allocation should follow conversion economics, not uniform budget pressure.  No major high-spend city crossed 0.5x ROAS.  Bengaluru was the best large city at around 0.45x ROAS, but still below desired efficiency.  Cities needing immediate review include Hyderabad, Chennai, Jaipur, Sas Nagar, Surat, Nashik, Mumbai, and Delhi.  Recommendation: Reallocate budget based on City-level ROAS, SKU availability, delivery strength, inventory depth, price competitiveness, conversion rate, CPC, and organic demand.  SLIDE 3: Cross-Platform Gap Summary  Headline: [Platform B] and [Platform A] show the same operating gap: spend is not governed tightly enough by economics.  Gap 1 - CPC above allowable level: [Platform B] CPC ₹31.1 vs allowable ₹10.7. [Platform A] CPC ₹46.2 vs allowable ₹14.8. (Fix: Break-even CPC bidding model).  Gap 2 - Discovery leakage: [Platform B] Auto, phrase, category, broad weak. [Platform A] Phrase, broad, generic weak. (Fix: Weekly harvesting and negative loop).  Gap 3 - Budget not following winners: [Platform B] SBT and exact under-scaled. [Platform A] Brand and category/PLA under-allocated. (Fix: Budget tiering by ROAS, CVR, and intent).  Gap 4 - Visibility spend not separated: [Platform B] SD/AMC weak. [Platform A] CPD/BOTD weak. (Fix: Separate awareness and performance budgets).  Gap 5 - Reporting and governance gaps: [Platform B] Broken pivot ratios. [Platform A] Sheet reconciliation differences. (Fix: Raw-data dashboard and source-of-truth reporting).  SLIDE 4: What Our Agency Would Do Differently  Headline: We would run this as a profit-led marketplace growth system.  6 Pillars:  Raw-data reporting and weekly diagnostics.  Intent-layer campaign structure.  Break-even CPC and target ACOS bidding.  Weekly search-term harvesting and negative keyword loop.  SKU, city, and inventory-aware budget allocation.  AOV and CVR improvement through bundles, multipacks, PDP, offers, and creative.  SLIDE 5: 30/60/90-Day Takeover Roadmap  Headline: First stop leakage, then rebuild, then scale only where economics prove out.  Days 0–7 (Stabilize):  [Platform B]: Pause or negative 10+ click zero-sales terms. Reduce bids on ROAS <0.25x. Protect brand and exact winners. Cap SD, AMC, and weak category/competitor campaigns.  [Platform A]: Cap CPD/BOTD unless awareness is objective. Reduce weak phrase/broad bids. Protect brand and exact winners. Identify low-ROAS city/SKU combinations.  Days 8–30 (Rebuild): Restructure by intent, SKU, city, and objective. Move converting terms into exact. Add negatives. Create budget tiers and build CPC ceilings.  Days 31–90 (Scale): Increase budgets on high-CVR/ROAS clusters. Test bundles for AOV. Run SBT/SBV/video tests on proven demand. Forecast budget by efficiency tier.  SLIDE 6: Closing Recommendation & Data Needed  Headline: The current account needs a sharper operator, not just more spend.  Closing statement: “The data shows that [Brand] has demand pockets that work, but the current operating model is allowing too much budget to flow into weak-intent, high-CPC traffic. Our agency would bring a structured, data-led marketplace growth system that connects media spend to SKU economics, city performance, search intent, and profitability.”  Recommended next step: 30-day transition audit and account takeover sprint.  Data needed: [Platform B] (Search term, placement, advertised product reports, SQP data) & [Platform A] (SKU-level campaign data, city-wise availability, organic sales, keyword-level order/revenue).  Business data needed: Target ACOS by SKU, Margin by SKU, Launch vs profitability priorities.  Speaker Notes: End with confidence. The audit already shows immediate improvement areas, and deeper access will allow the agency to move from diagnosis to execution.
content_source: fully supplied raw data per slide
expect:
  compiles: true
  slide_count: 6
  watch: >
    slide 1 campaign classes vs ROAS as a chart/table; slide 2 match-type table (3 x 5 metrics);
    slide 3 five-gap comparison table; slide 5 three-phase timeline; numbers verbatim.
