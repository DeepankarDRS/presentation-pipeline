# Post-MVP test case: Tree with deep recursive nesting (4 levels).
name: tree-org-chart
phase: post-mvp
objective: Show a company org chart as a vertical tree with 4 levels and 14 nodes.
request: >
  An org chart slide. Title "Engineering Organization" with a thin accent bar.
  Vertical tree layout showing the CTO at the top, three VP reports (Platform,
  Product, Infrastructure), each VP has 2-3 direct reports (team leads), and two
  of those leads have individual contributors listed beneath them. Use navy for
  C-suite, blue for VPs, lighter blue for leads, and lightest blue for ICs.
  White text on all nodes. Round-rect node shape. Generous spacing so it doesn't
  feel cramped — the tree should fill the slide width.
theme: corporate-slate
components:
  - title
  - tree
