# GATE deck (user prompt, 2026-09-23, verbatim). Run: python -m scripts.eval_run gate-deck-xtsy-qcomm --label x
name: gate-deck-xtsy-qcomm
objective: 8-slide consulting-style pitch with a per-slide spec, frameworks and no hard numbers.
request: |
  Create a premium consulting-style PowerPoint presentation (8 slides) for XTSY Energy Drink.  Context: XTSY is already live on Quick Commerce platforms including Zepto, Swiggy Instamart and Blinkit. The objective of this meeting is to demonstrate category growth opportunities, identify scale levers, showcase performance marketing and automation capabilities, and establish a roadmap to gain market share and accelerate offtakes.  Presentation Style:  * Premium investor-grade design * Similar to BCG / McKinsey strategy decks * Minimal text, high visual impact * Data-first storytelling * Modern FMCG and Quick Commerce visuals * Use charts, funnels, growth frameworks, market maps and KPI dashboards * Focus on business outcomes rather than media metrics  ---  SLIDE 1  TITLE: Unlocking the Next Phase of Growth for XTSY on Quick Commerce  SUBTITLE: Building Category Share, Visibility and Consumer Penetration Through Data-Led Commerce Execution  Visual: Quick Commerce ecosystem showing Zepto, Blinkit and Instamart connected to XTSY growth engine.  Key Message: Quick Commerce is becoming a primary consumption channel for impulse and instant-need beverage categories, creating a significant opportunity for XTSY to scale.  ---  SLIDE 2  TITLE: Why the Energy Drink Category is Built for Quick Commerce  Visual: Consumer purchase occasions mapped across the day.  Include:  * Pre-workout consumption * Gaming sessions * Late-night work/study * Travel & commuting * Party & social occasions * Instant energy requirements  Key Insight: Energy drinks have one of the strongest instant-need consumption behaviors, making them highly compatible with Quick Commerce.  Show: Category growth drivers Consumer demand moments Impulse purchase behaviour  ---  SLIDE 3  TITLE: Growth Opportunities for XTSY Across Quick Commerce Platforms  Visual: Opportunity Matrix  Rows: Visibility Conversion Repeat Purchase Market Expansion  Columns: Zepto Blinkit Instamart  Opportunity Areas:  * Search visibility expansion * Sponsored placements * Category page dominance * New city penetration * Portfolio expansion * Basket attachment opportunities * Subscription/repeat purchase growth  Key Takeaway: Growth is not limited to ad spends; it is unlocked through visibility, availability, discoverability and repeat purchase strategies.  ---  SLIDE 4  TITLE: Our 4-Phase Framework to Build Category Share  Visual: 4-stage growth roadmap  Phase 1: Foundation & Hygiene  * Availability tracking * OOS reduction * Search audit * Visibility benchmark * Portfolio prioritization  Phase 2: Market Share Capture  * Search dominance * Sponsored placements * Keyword expansion * Competitor conquesting * Category page visibility  Phase 3: Consumer Expansion  * New-to-brand acquisition * New-to-category targeting * Cross-platform expansion * Geo expansion  Phase 4: Scale & Profitability  * Automation-led optimization * Incrementality focus * Repeat purchase acceleration * Portfolio scaling  Show progression from Visibility → Offtakes → Market Share → Profitability  ---  SLIDE 5  TITLE: How Our Commerce Intelligence Platform Drives Faster Growth  Visual: Control Tower Dashboard  Show capabilities:  TRACKING  * Share of Search * Share of Shelf * Availability Monitoring * Pricing Intelligence * Competitor Monitoring  INSIGHTS  * SKU-level performance * City-level opportunity mapping * Platform-wise growth pockets * Category trends  Key Message: What gets measured gets scaled.  ---  SLIDE 6  TITLE: Ads Automation Engine Designed for Quick Commerce  Visual: Automation workflow  Input: Platform Data  →  Decision Engine  →  Bid Optimization Budget Reallocation Keyword Expansion Placement Optimization  →  Business Outcome  Show Benefits:  * Faster optimization cycles * Reduced manual intervention * Improved ROAS * Improved share of visibility * Higher conversion efficiency  Highlight: Automation allows brands to react in hours instead of weeks.  ---  SLIDE 7  TITLE: Expected Business Impact for XTSY  Visual: Growth Impact Framework  Show expected impact areas:  Category Visibility ↑  Search Share ↑  Sponsored Placement Share ↑  New Consumer Acquisition ↑  Repeat Purchase Rate ↑  Market Share ↑  Sales Velocity ↑  Use arrow visuals rather than hard numbers.  Message: Combining category intelligence, automation and performance execution creates a scalable growth engine.  ---  SLIDE 8  TITLE: Roadmap for the Next 90 Days  Visual: 90-Day Action Plan  Month 1: Audit & Benchmarking  * Category assessment * Search visibility audit * Availability review * Platform diagnostics  Month 2: Growth Activation  * Search scaling * Placement expansion * Competitor conquesting * Portfolio prioritization  Month 3: Optimization & Scale  * Automation deployment * Budget optimization * Expansion planning * Growth measurement  Closing Statement:  "Winning Quick Commerce is no longer about spending more. It is about capturing visibility faster, converting demand better and scaling through intelligence and automation."
content_source: per-slide spec supplied; qualitative (no hard numbers)
