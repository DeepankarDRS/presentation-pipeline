# slide 1), chat timestamp removed, agency name anonymised. Run: python -m scripts.eval_run gate-deck-cheffin-audit --label x
name: gate-deck-cheffin-audit
objective: 6-slide ads audit deck from a long brief with platform summary data and no per-slide spec after slide 1.
request: |
  You are a senior performance marketing strategist, FLIPCART Ads expert, quick-commerce media buyer, and data scientist.  Create a polished, client-ready audit presentation for CHEFFIN, a ready-to-cook / ready-to-eat food brand. The deck should audit the brand’s current FLIPCART Ads and ZAROMA Ads performance, identify key gaps in the current operating model, and make a strong case for why our agency should take over performance media operations.  IMPORTANT: Keep the deck concise and executive-friendly.. Cover all important insights, but avoid unnecessary detail. Use sharp headlines, clear tables, charts, and concise recommendations.  DECK OBJECTIVE: The deck should help us present to the client that: 1. The brand is spending heavily across FLIPCART and ZAROMA but not buying profitable demand. 2. The current performance problem is structural, not just a small campaign optimization issue. 3. CPC is much higher than what the current AOV and conversion rate can support. 4. There are clear gaps in search-term governance, bid discipline, campaign structure, audience strategy, city allocation, and budget allocation. 5. Our agency can improve performance using a stronger data-led operating model.  STYLE: - Clean, modern, boardroom-ready. - Use Indian currency format: ₹, L for lakhs. - Use ROAS as “0.34x”, CPC as “₹31.1”, ACOS as “290%”. - Use white background, dark text, and subtle FLIPCART orange + ZAROMA purple accents. - Use charts and tables where useful. - Avoid overcrowding slides. - Every slide headline should state the conclusion, not just the topic. - Do not attack the current agency directly. Use professional language such as “current operating gaps”, “opportunity to improve governance”, and “needs tighter control”.  DATA CONTEXT: refer attached sheet which has all the data. The audit is based on: 1. FLIPCART Targeting last 90 days data. 2. FLIPCART Search Term report. 3. ZAROMA April, May, and June data. 4. ZAROMA campaign, city, and keyword-level views. DATA QUALITY NOTE: Mention that some FLIPCART pivot-style sheets had unreliable or zeroed ratio fields, so metrics were recalculated from raw data. Also mention that ZAROMA campaign, city, and keyword sheets may not reconcile perfectly because they appear to have slightly different coverage. Use ZAROMA campaign-level data as the primary platform total source, while city and keyword sheets should be used for diagnostic insights.  KEY FORMULAS: ROAS = Revenue or Sales / Spend ACOS = Spend / Sales CTR = Clicks / Impressions CPC = Spend / Clicks CVR = Orders or Purchases / Clicks CPA = Spend / Orders or Purchases AOV = Sales / Orders or Purchases Allowable CPC for 1.0x ROAS = AOV × CVR  CORE EXECUTIVE DIAGNOSIS: Across FLIPCART and ZAROMA, CHEFFIN is spending at scale but the traffic economics are structurally weak. The issue is not just campaign optimization. The brand needs a paid-growth operating system built around intent, SKU economics, search-term governance, city-level allocation, break-even CPC rules, AOV improvement, and CVR improvement.  PLATFORM SUMMARY: FLIPCART: - Spend: ₹29.4L - Ad sales: ₹10.1L - ROAS: 0.34x - CPC: ₹31.1 - CVR: 5.5% - AOV: ₹195 - Allowable CPC for 1.0x ROAS: ₹10.7  ZAROMA: - Spend: ₹85.5L - Ad revenue: ₹27.3L - ROAS: 0.32x - CPC: ₹46.2 - CVR: 6.4% - AOV: ₹230 - Allowable CPC for 1.0x ROAS: ₹14.8  Combined: - Spend: ₹114.9L - Revenue: ₹37.4L - ROAS: 0.33x - CPC: ₹41.1 - CVR: 6.1% - AOV: ₹219  KEY INTERPRETATION: The current CPCs are almost 3x higher than what current AOV and CVR can support. Therefore, performance cannot be fixed only by bid tweaks. The account needs: 1. Lower CPC on weak traffic. 2. Higher CVR through better keyword, SKU, and city matching. 3. Higher AOV through bundles, multipacks, offers, and higher-value SKUs. 4. Spend reallocation from low-intent traffic to proven high-intent pockets. 5. Break-even CPC rules by platform, keyword, SKU, city, and campaign objective.  CREATE THE DECK USING THIS 6-SLIDE STRUCTURE:  SLIDE 1: Title Slide Headline: CHEFFIN FLIPCART & ZAROMA Ads Audit  Subtitle: Last 90 Days Performance Review | Key Gaps, Opportunities & Takeover Roadmap  Include: Prepared by our agency  Visual: Marketplace growth theme with FLIPCART and ZAROMA visual cues.
content_source: platform summary numbers supplied; slides 2-6 left to the planner
expect:
  compiles: true
  slide_count: 6
  watch: >
    supplied numbers used verbatim (₹29.4L, 0.34x, ₹31.1 vs allowable ₹10.7);
    CPC-vs-allowable comparison as a chart or table; headlines state conclusions.
