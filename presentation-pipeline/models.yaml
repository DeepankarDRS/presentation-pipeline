# Reasoning models (gpt-5*, o1/o3/o4*): get_llm drops temperature and sends
# reasoning_effort (minimal | low | medium | high; default medium). Reasoning
# tokens count against max_tokens — raise it (~16000) or the answer can come
# back empty. Example: the three planner steps below.
steps:
  # ── Hierarchical planning pipeline ──────────────────────────────────────
  elicitor:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 1000
    response_format: json_schema
  # Planners on gpt-5-mini (2026-10-01, reasoning-model test). To go back to
  # gpt-4.1: model: gpt-4.1 and the max_tokens noted on each step.
  outline_planner:
    provider: openai
    model: gpt-5-mini
    reasoning_effort: medium
    temperature: 0.1  # ignored by reasoning models; used again on gpt-4.1 (§9.1 planner 9)
    max_tokens: 32000  # reasoning tokens count here; gpt-4.1 used 12000 (a 14-slide outline hit 4000, 2026-09-24)
    response_format: json_schema
  slide_component_planner:
    provider: openai
    model: gpt-5-mini
    reasoning_effort: medium
    temperature: 0.1  # ignored by reasoning models; used again on gpt-4.1 (§9.1 planner 9)
    max_tokens: 24000  # 16000 ran out on reasoning (wide-paid log, 3 first tries); gpt-4.1 used 4000
    response_format: json_schema
  plan_reviewer:
    provider: openai
    model: gpt-5-mini
    reasoning_effort: medium
    temperature: 0.1  # ignored by reasoning models
    max_tokens: 16000  # gpt-4.1 used 2000
    response_format: json_schema
  # ── Planning v2 (src/planning, Test 1) ──────────────────────────────────
  storyline:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 10000  # block ids instead of retyped data keep this far below the old outline
    response_format: json_schema
  slide_designer:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 4000
    response_format: json_schema
  # ── Legacy planner kept for non-graph direct calls only ─────────────────
  planner:
    provider: openai
    model: gpt-4.1
    temperature: 0.3
    max_tokens: 8000
    response_format: json_schema
  # Generator + repairer on gpt-6.1-sol (2026-10-21): blind marks 0.75 vs gpt-4.1 0.36 / gpt-5-mini 0.39 on CHEFFIN + XTSY
  # (docs/eval/model-compare-2026-10-21/); planners stay on gpt-5-mini to test the generator alone
  # (scripts/tools/gen_from_plans.py). Back to gpt-4.1: model: gpt-4.1, temperature 0.2, max_tokens 12000, no reasoning_effort.
  generator:
    provider: openai
    model: gpt-6.1-sol
    reasoning_effort: medium
    temperature: 0.2  # ignored by reasoning models; used again on gpt-4.1
    max_tokens: 24000  # reasoning tokens count here (the 2026-10-21 runs used 100-500 per slide); gpt-4.1 used 12000
  critic:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 1000
    enabled: true
  repairer:
    provider: openai
    model: gpt-6.1-sol
    reasoning_effort: medium
    temperature: 0.1  # ignored by reasoning models; used again on gpt-4.1
    max_tokens: 24000  # must be able to re-emit a full slide, not truncate mid-repair; gpt-4.1 used 12000
  visual_critic:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 800
  slide_editor:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 4000

defaults:
  provider: openai
  azure_endpoint: ""
  azure_api_version: "2024-12-01-preview"

# cached_input: the rate for prompt tokens OpenAI served from its prompt cache (prompt_tokens_details.cached_tokens,
# part of tokens_in); a model without one bills them at `input`.
pricing:
  gpt-4.1:      { input: 2.00, cached_input: 0.50, output: 8.00 }
  gpt-4.1-mini: { input: 0.40, cached_input: 0.10, output: 1.60 }
  gpt-4.1-nano: { input: 0.10, cached_input: 0.025, output: 0.40 }
  # Reasoning models — USD per 1M tokens as last known; check OpenAI's pricing page.
  # Output includes reasoning tokens. Longest prefix wins, so gpt-5-mini never matches gpt-5.
  gpt-5:        { input: 1.25, cached_input: 0.125, output: 10.00 }
  gpt-5-mini:   { input: 0.25, cached_input: 0.025, output: 2.00 }
  gpt-5-nano:   { input: 0.05, cached_input: 0.005, output: 0.40 }
  # gpt-6.1-sol: rates read back from the test PC's 2026-10-21 run manifests (cost per call / tokens); check them.
  gpt-6.1-sol:  { input: 2.00, cached_input: 0.50, output: 8.00 }
  o3:           { input: 2.00, cached_input: 0.50, output: 8.00 }
  o4-mini:      { input: 1.10, cached_input: 0.275, output: 4.40 }
