steps:
  planner:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.3
    max_tokens: 2000
    response_format: json_schema
  generator:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.2
    max_tokens: 4000
  critic:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.1
    max_tokens: 1000
    enabled: true
  repairer:
    provider: openai
    model: gpt-4.1-mini
    temperature: 0.1
    max_tokens: 4000

defaults:
  provider: openai
  azure_endpoint: ""
  azure_api_version: "2024-12-01-preview"

pricing:
  gpt-4.1:      { input: 2.00, output: 8.00 }
  gpt-4.1-mini: { input: 0.40, output: 1.60 }
  gpt-4.1-nano: { input: 0.10, output: 0.40 }
