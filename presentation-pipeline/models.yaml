# Reasoning models (gpt-5*, o1/o3/o4*): get_llm drops temperature and sends
# reasoning_effort (minimal | low | medium | high; default medium). Reasoning
# tokens count against max_tokens — raise it (~16000) or the answer can come
# back empty. Example: the three planner steps below.
steps:
  # ── Hierarchical planning pipeline ──────────────────────────────────────
  elicitor:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 1000
    response_format: json_schema
  # Planners on gpt-5-mini (2026-10-01, reasoning-model test). To go back to
  # gpt-4.1: model: gpt-4.1 and the max_tokens noted on each step.
  outline_planner:
    provider: openai
    model: gpt-5-mini
    reasoning_effort: medium
    temperature: 0.1  # ignored by reasoning models; used again on gpt-4.1 (§9.1 planner 9)
    max_tokens: 32000  # reasoning tokens count here; gpt-4.1 used 12000 (a 14-slide outline hit 4000, 2026-09-24)
    response_format: json_schema
  slide_component_planner:
    provider: openai
    model: gpt-5-mini
    reasoning_effort: medium
    temperature: 0.1  # ignored by reasoning models; used again on gpt-4.1 (§9.1 planner 9)
    max_tokens: 16000  # gpt-4.1 used 4000
    response_format: json_schema
  plan_reviewer:
    provider: openai
    model: gpt-5-mini
    reasoning_effort: medium
    temperature: 0.1  # ignored by reasoning models
    max_tokens: 16000  # gpt-4.1 used 2000
    response_format: json_schema
  # ── Planning v2 (src/planning, Test 1) ──────────────────────────────────
  storyline:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 10000  # block ids instead of retyped data keep this far below the old outline
    response_format: json_schema
  slide_designer:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 4000
    response_format: json_schema
  # ── Legacy planner kept for non-graph direct calls only ─────────────────
  planner:
    provider: openai
    model: gpt-4.1
    temperature: 0.3
    max_tokens: 8000
    response_format: json_schema
  generator:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 12000  # a maximal single slide is 6-12k tokens of XML
  critic:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 1000
    enabled: true
  repairer:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 12000  # must be able to re-emit a full slide, not truncate mid-repair
  visual_critic:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 800
  slide_editor:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 4000

defaults:
  provider: openai
  azure_endpoint: ""
  azure_api_version: "2024-12-01-preview"

pricing:
  gpt-4.1:      { input: 2.00, output: 8.00 }
  gpt-4.1-mini: { input: 0.40, output: 1.60 }
  gpt-4.1-nano: { input: 0.10, output: 0.40 }
  # Reasoning models — USD per 1M tokens as last known; check OpenAI's pricing page.
  # Output includes reasoning tokens. Longest prefix wins, so gpt-5-mini never matches gpt-5.
  gpt-5:        { input: 1.25, output: 10.00 }
  gpt-5-mini:   { input: 0.25, output: 2.00 }
  gpt-5-nano:   { input: 0.05, output: 0.40 }
  o3:           { input: 2.00, output: 8.00 }
  o4-mini:      { input: 1.10, output: 4.40 }
