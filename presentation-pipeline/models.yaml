steps:
  # ── Hierarchical planning pipeline ──────────────────────────────────────
  elicitor:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 1000
    response_format: json_schema
  outline_planner:
    provider: openai
    model: gpt-4.1
    temperature: 0.3
    max_tokens: 4000
    response_format: json_schema
  slide_component_planner:
    provider: openai
    model: gpt-4.1
    temperature: 0.3
    max_tokens: 4000
    response_format: json_schema
  plan_reviewer:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 2000
    response_format: json_schema
  # ── Legacy planner kept for non-graph direct calls only ─────────────────
  planner:
    provider: openai
    model: gpt-4.1
    temperature: 0.3
    max_tokens: 8000
    response_format: json_schema
  generator:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 12000  # a maximal single slide is 6-12k tokens of XML
  critic:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 1000
    enabled: true
  repairer:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 12000  # must be able to re-emit a full slide, not truncate mid-repair
  visual_critic:
    provider: openai
    model: gpt-4.1
    temperature: 0.1
    max_tokens: 1000
  slide_editor:
    provider: openai
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 4000

defaults:
  provider: openai
  azure_endpoint: ""
  azure_api_version: "2024-12-01-preview"

pricing:
  gpt-4.1:      { input: 2.00, output: 8.00 }
  gpt-4.1-mini: { input: 0.40, output: 1.60 }
  gpt-4.1-nano: { input: 0.10, output: 0.40 }
