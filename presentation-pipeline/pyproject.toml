[project]
name = "presentation-pipeline"
version = "0.1.0"
description = "LangGraph-based enterprise presentation generation pipeline"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4,<1",
    "langgraph-checkpoint>=2,<3",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.3,<1",
    "openai>=1.30,<2",
    "pydantic>=2.5,<3",
    "pyyaml>=6,<7",
    "jinja2>=3.1,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
