# Phase 0b style packs (docs/derived-nodes-design.md §10b). Experiment only.
# Colours become <Theme> tokens ($bg, $ink, ...). Fonts: Segoe UI + Consolas render
# as named on Windows / LibreOffice here; the Genspark decks used Inter-like sans + mono.

editorial:            # from Genspark's CHEFFIN deck: white, ink, entity accents
  colors:
    bg: "FFFFFF"
    ink: "111111"
    muted: "6B6B6B"
    line: "E7E4DE"
    panel: "F7F6F3"
    dark: "0E1117"
    white: "FFFFFF"
    accent: "C2410C"      # labels, best value (darkened: small labels need 4.5:1)
    accent2: "F5A524"     # label colour on dark strips
    negative: "C92A2A"
    onAccent: "111111"
  fonts: {sans: "Segoe UI", mono: "Consolas"}
  type: {headline: 32, cover: 96, big: 54, mid: 34, title: 17, body: 13, label: 10}
  badge: dot            # label row starts with a small square
  rule_under_headline: true
  top_bar: false

tech:                 # from Genspark's XTSY deck: navy + teal + lime
  colors:
    bg: "FFFFFF"
    ink: "0B1B2B"
    muted: "5B6B7B"
    line: "DDE3EA"
    panel: "F3F6F9"
    dark: "0B1F33"
    white: "FFFFFF"
    accent: "00795A"
    accent2: "C6F24E"
    negative: "C92A2A"
    onAccent: "0B1B2B"
  fonts: {sans: "Segoe UI", mono: "Consolas"}
  type: {headline: 30, cover: 46, big: 54, mid: 34, title: 16, body: 13, label: 10}
  badge: number         # label row starts with a lime square holding the slide number
  rule_under_headline: false
  top_bar: true

studio:               # from Genspark AI Slides' XTSY deck and the Phase 0 hand-built slides
  colors:
    bg: "F1ECE2"          # cream
    ink: "111311"
    muted: "6E6B63"
    line: "D8D2C4"
    panel: "FFFFFF"       # cards are white on cream, with a hairline border
    dark: "0D0F0C"
    white: "FFFFFF"
    accent: "A8441F"      # rust: labels, markers (darkened for 4.5:1 on cream)
    accent2: "C9F03D"     # lime: highlight fills, accents on dark
    negative: "B23A2E"
    onAccent: "111311"
  colors_dark:          # slides drawn dark (phase frameworks)
    bg: "0D0F0C"
    ink: "F7F5EF"
    muted: "A3A59C"
    line: "33372F"
    panel: "171A16"
    dark: "F7F5EF"
    white: "FFFFFF"
    accent: "C9F03D"
    accent2: "C9F03D"
    negative: "E0715F"
    onAccent: "111311"
  fonts: {sans: "Segoe UI", mono: "Consolas"}   # Space Grotesk + JetBrains Mono when installed
  type: {headline: 40, cover: 54, big: 54, mid: 34, title: 19, body: 13, label: 10}
  badge: dot
  rule_under_headline: false
  top_bar: false
  headline: two_tone     # regular weight, the plan's emphasised phrase in bold
  headline_max_w: 860
  card_titles: italic_last
  fills: rhythm          # white / dark / lime by role and position
  card_border: true
  ghost_numerals: true   # big faint 01 / 02 on phase cards
  dark_slides: [steps]   # a slide whose hero is 4+ ordered steps is drawn dark
  strip: statement       # closing line as a ruled italic statement, not a dark bar
  kicker_number: true    # "CATEGORY DYNAMICS · 02"
  running: false
  arrows: true           # "Search Share ↑" -> an arrow icon on the card

studio_inter:         # studio in Inter + JetBrains Mono (src/node/fonts/, font experiment §10g)
  colors:
    bg: "F1ECE2"          # cream
    ink: "111311"
    muted: "6E6B63"
    line: "D8D2C4"
    panel: "FFFFFF"       # cards are white on cream, with a hairline border
    dark: "0D0F0C"
    white: "FFFFFF"
    accent: "A8441F"      # rust: labels, markers (darkened for 4.5:1 on cream)
    accent2: "C9F03D"     # lime: highlight fills, accents on dark
    negative: "B23A2E"
    onAccent: "111311"
  colors_dark:          # slides drawn dark (phase frameworks)
    bg: "0D0F0C"
    ink: "F7F5EF"
    muted: "A3A59C"
    line: "33372F"
    panel: "171A16"
    dark: "F7F5EF"
    white: "FFFFFF"
    accent: "C9F03D"
    accent2: "C9F03D"
    negative: "E0715F"
    onAccent: "111311"
  fonts: {sans: "Inter", mono: "JetBrains Mono"}   # measured by POM with these files; install them to render
  type: {headline: 40, cover: 54, big: 54, mid: 34, title: 19, body: 13, label: 10}
  badge: dot
  rule_under_headline: false
  top_bar: false
  headline: two_tone     # regular weight, the plan's emphasised phrase in bold
  headline_max_w: 860
  card_titles: italic_last
  fills: rhythm          # white / dark / lime by role and position
  card_border: true
