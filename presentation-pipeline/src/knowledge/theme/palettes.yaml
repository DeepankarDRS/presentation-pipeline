# pom-knowledge/theme/palettes.yaml
# ---------------------------------------------------------------------------
# The theme LIBRARY for the MVP. Each entry is a complete <Theme> token set.
# Resolved by python/theme.py; selected per deck/slide via a project-root
# theme.yaml, a test-case `theme:` field, or the --theme CLI flag.
#
# This file replaces the old theme/default.yaml. All the usage guidance that
# used to live there is folded in below (see `usage:` and `token_roles:`).
#
# All colors are bare 6-digit hex (NO leading '#'). Token names follow POM's
# rule: start with a letter; letters / digits / _ / - only. Reference a token
# in any color attribute as $tokenName (e.g. color="$textMain").
# ---------------------------------------------------------------------------

meta:
  phase: A
  # The palette used when nothing else selects one.
  default: corporate-slate
  # Contrast is checked at load time (python/theme.py verify()). Failures are
  # warnings, not errors; a badly-broken custom palette falls back to `default`.
  contrast_targets:
    textMain_on_surface:    { min: 4.5, want: 7.0 }
    textMain_on_surfaceAlt: { min: 4.5, want: 7.0 }
    textMuted_on_surface:   { min: 3.0, want: 4.5 }
    accent_on_surface:      { min: 3.0, want: 3.0 }

# --- token roles (was theme/default.yaml `usage:`) --------------------------
token_roles:
  surface:     "slide background — backgroundColor=\"$surface\" on the root VStack"
  surfaceAlt:  "cards / plates / KPI tiles / table header cells"
  accent:      "primary accent — accent bar, KPI top-border, links, first chart series"
  accentAlt:   "secondary accent — second chart series, sparklines"
  positive:    "good deltas / up arrows (color=\"$positive\")"
  negative:    "bad deltas / down arrows"
  warning:     "caution figures"
  textMain:    "primary text / big numbers (bold headings)"
  textMuted:   "labels, captions, secondary rows"
  border:      "hairline borders, table cellBorder.color, KPI tile outline"
  chartSurface: "DARK palettes only — light card placed BEHIND a chart so POM's
                 hard-coded black axis text stays readable (see below)"
  chartInk:    "DARK palettes only — a dark ink for text drawn on $chartSurface"
  # Derived by code (src/compiler/palette_tokens.py, 2026-10-07) and added to every <Theme>.
  # A palette may author `neutral`; the others are always computed.
  accentSoft:   "pale accent fill — the ONE highlighted row / card / callout background"
  positiveSoft: "pale fill behind a good delta chip / badge / row"
  negativeSoft: "pale fill behind a bad delta chip / badge / row"
  warningSoft:  "pale fill behind a watch chip / badge / row"
  accentText:   "accent as small text (eyebrow, kicker, key figure in a tint) — always >= 4.5:1"
  positiveText: "good delta / figure as text"
  negativeText: "bad delta / figure as text"
  warningText:  "watch figure as text"
  onAccent:     "text on an $accent fill (chip, step number)"
  neutral:      "grey for everything that is NOT the focus: other bars / series / dots"

usage:
  slide_background: 'backgroundColor="$surface" on the root VStack'
  card: 'backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1"'
  title_text: 'color="$textMain" bold="true"'
  label_text: 'color="$textMuted"'
  accent_bar: '<Shape shapeType="rect" w="120" h="6" backgroundColor="$accent" />'
  kpi_dot_good: '<Shape shapeType="ellipse" w="12" h="12" backgroundColor="$positive" />'
  delta_up: 'color="$positive"'
  delta_down: 'color="$negative"'
  table_cell: 'EVERY <Td> needs an explicit backgroundColor AND color. Unstyled
               cells fall back to PowerPoint''s default table style (white fill,
               black text, row banding) — a white island on any themed deck.
               Header row: backgroundColor="$surfaceAlt" color="$textMain" bold="true".
               Body rows: backgroundColor="$surface" color="$textMuted" (labels)
               or color="$textMain" (values). cellBorder.color="$border".'
  chart_colors: 'chartColors is a JSON string of LITERAL hex — $tokens do NOT
                 resolve inside it. Copy the palette''s `chartColors` values in.'
  chart_on_dark: 'POM v10.3.0 hard-codes chart axis/label text to 000000 and
                  gridlines to 888888 (renderPptx/nodes/chart.js) — unfixable in
                  XML. On a DARK palette, wrap the chart in
                  <VStack backgroundColor="$chartSurface" padding="16" borderRadius="12">
                  so the black axis text is legible. On a LIGHT palette the chart
                  sits directly on $surface and needs no wrapper.'

