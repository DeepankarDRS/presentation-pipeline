# pom-knowledge/components/tree.yaml
# <Tree> + <TreeItem>. Post-MVP.
# Source: pom.pptx.app/nodes. Verified against @hirokisakabe/pom v10.3.0.

meta:
  phase: post_mvp
  nodes: [Tree, TreeItem]

description: >
  A hierarchical tree / org chart. One <Tree> wraps a single root <TreeItem>,
  which nests child <TreeItem> nodes recursively. Use for org charts, decision
  trees, category hierarchies, or any parent-child structure.

structure: |
  <Tree layout="vertical" w="1000" h="500"
        nodeShape="roundRect" textColor="$textMain"
        nodeWidth="140" nodeHeight="50"
        levelGap="60" siblingGap="24"
        connectorStyle.color="$neutral" connectorStyle.width="2">
    <TreeItem label="CEO" color="$accent" textColor="$onAccent">
      <TreeItem label="CTO" color="$accentSoft">
        <TreeItem label="Engineering" color="$accentSoft" />
        <TreeItem label="Product" color="$accentSoft" />
        <TreeItem label="Design" color="$accentSoft" />
      </TreeItem>
      <TreeItem label="CFO" color="$accentSoft">
        <TreeItem label="Finance" color="$accentSoft" />
        <TreeItem label="Legal" color="$accentSoft" />
      </TreeItem>
      <TreeItem label="COO" color="$accentSoft">
        <TreeItem label="Operations" color="$accentSoft" />
        <TreeItem label="HR" color="$accentSoft" />
      </TreeItem>
    </TreeItem>
  </Tree>

Tree_attributes:
  layout:         { type: enum, values: [vertical, horizontal], default: vertical }
  nodeShape:      { type: enum, values: [rect, roundRect, ellipse], default: roundRect }
  textColor:      { type: hex, default: "FFFFFF", note: "Default text color for all nodes" }
  nodeWidth:      { type: number, default: 120 }
  nodeHeight:     { type: number, default: 40 }
  levelGap:       { type: number, default: 60, note: "Vertical gap between tree levels" }
  siblingGap:     { type: number, default: 20, note: "Horizontal gap between sibling nodes" }
  connectorStyle: { type: object, note: "connectorStyle.color, connectorStyle.width" }
  w:              { type: number, note: "Explicit width — required" }
  h:              { type: number, note: "Explicit height — required" }

TreeItem_attributes:
  label:     { type: string, required: true, note: "Node display label" }
  color:     { type: hex, note: "Node fill color (overrides parent level)" }
  textColor: { type: hex, note: "Override tree-level textColor for this node" }

notes:
  - "TreeItem is the one self-referencing node type — TreeItem nests inside TreeItem."
  - "Tree must have exactly one root TreeItem."
  - "Tree needs explicit w and h."
  - "Use different color values per level for visual hierarchy (darker = higher level)."
  - "3-4 levels deep works well. Deeper trees need larger w/h to avoid cramping."

pitfalls:
  - "Tree must have exactly one root TreeItem — multiple roots will fail."
  - "label is required on every TreeItem."
  - "Missing w/h on Tree — will not render correctly."
  - "Deep trees (5+ levels) with many siblings can overflow the given w/h."
