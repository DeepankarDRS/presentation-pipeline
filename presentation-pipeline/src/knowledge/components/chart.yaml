# pom-knowledge/components/chart.yaml
# <Chart> + <ChartSeries> + <ChartDataPoint>. Phase B.
# Source: llm.txt "Chart" section. Verified against @hirokisakabe/pom v10.3.0
# (see pom-knowledge/examples/chart-slide.xml and mixed-slide.xml).

meta:
  phase: B
  nodes: [Chart, ChartSeries, ChartDataPoint]

description: >
  A native PowerPoint chart. One <Chart> wraps one or more <ChartSeries>, each
  wrapping <ChartDataPoint> entries. For the MVP use a single series unless the
  request clearly needs more.

structure: |
  <Chart chartType="bar" w="1136" h="452" showLegend="false" chartColors='["2563EB", "0EA5E9", "14B8A6"]'>
    <ChartSeries name="Revenue ($M)">
      <ChartDataPoint label="Q1" value="100" />
      <ChartDataPoint label="Q2" value="150" />
    </ChartSeries>
  </Chart>

Chart_attributes:
  chartType:   { type: enum, required: true, values: [bar, line, pie, area, doughnut, radar] }
  w:           { type: number, required: true, note: "Chart needs an explicit positive w and h. It does NOT auto-size." }
  h:           { type: number, required: true }
  showLegend:  { type: bool, values: [true, false] }
  showTitle:   { type: bool, values: [true, false] }
  title:       { type: string }
  chartColors: { type: string, note: "JSON array string of bare hex, e.g. '[\"2563EB\",\"0EA5E9\"]'. NOT $tokens — literal hex only. Copy the active palette's chartColors." }
  radarStyle:  { type: enum, values: [standard, marker, filled], note: "radar only" }
  sparkline:   { type: bool, note: "hides legend/axes/gridlines for a compact inline chart (bar/line/area, e.g. h=40)" }

ChartSeries_attributes:
  name: { type: string, note: "series label shown in the legend" }

ChartDataPoint_attributes:
  label: { type: string, required: true }
  value: { type: number, required: true, note: "may be a decimal string, e.g. value=\"42.8\"" }

notes:
  - "chartColors is a JSON string with literal hex — theme $tokens do NOT resolve inside it. Copy the ACTIVE palette's chartColors values (the contract lists them); take as many leading entries as you have series / bars."
  - "Give the Chart an explicit w/h sized to its container. A Chart with no w/h will fail at render."
  - "For a two-column chart+table slide, size the chart to the column width (see layouts/chart-table.yaml)."
  - "One series is enough for most MVP slides; add series only when the request compares groups."
  - "AXIS TEXT IS ALWAYS BLACK: POM v10.3.0 hard-codes chart category/value axis text to 000000 and gridlines to 888888 (renderPptx/nodes/chart.js). There is no XML attribute to change it. On a DARK theme the axis labels vanish — wrap the chart: <VStack backgroundColor=\"$chartSurface\" borderRadius=\"12\" padding=\"16\"><Chart .../></VStack> and shrink the Chart w/h by ~2*padding. On a LIGHT theme the black axis text sits fine on $surface; no wrapper needed."
  - "To hide axes entirely (compact inline trend), use sparkline=\"true\" — then no wrapper is needed on any theme, but you lose axis labels, so put the numbers in a caption or table."

examples:
  full_width_bar: |
    <Chart chartType="bar" w="1136" h="452" showLegend="false" chartColors='["2563EB"]'>
      <ChartSeries name="Revenue ($M)">
        <ChartDataPoint label="Q2 FY25" value="28.4" />
        <ChartDataPoint label="Q3 FY25" value="31.2" />
        <ChartDataPoint label="Q4 FY25" value="34.9" />
      </ChartSeries>
    </Chart>
  two_series_line: |
    <Chart chartType="line" w="720" h="360" showLegend="true" chartColors='["2563EB","0EA5E9"]'>
      <ChartSeries name="Plan">
        <ChartDataPoint label="Jan" value="100" />
        <ChartDataPoint label="Feb" value="120" />
      </ChartSeries>
      <ChartSeries name="Actual">
        <ChartDataPoint label="Jan" value="98" />
        <ChartDataPoint label="Feb" value="126" />
      </ChartSeries>
    </Chart>

pitfalls:
  - "chartType is required and must be one of bar/line/pie/area/doughnut/radar. A wrong value is a ParseXmlError."
  - "Missing w/h on <Chart> -> render error."
  - "Do not put '#' or $token inside chartColors."
  - "<ChartDataPoint> is self-closing; it has no text body."
  - "Chart on a dark slide with no $chartSurface wrapper -> axis labels are black-on-dark and invisible. This compiles clean; it is a visual failure the compiler will not flag."
  - "A single-color chartColors (e.g. '[\"2563EB\"]') makes every bar identical. For >3 bars or multiple series, pass the full palette sequence so bars are distinguishable."
