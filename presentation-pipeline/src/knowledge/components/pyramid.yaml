# pom-knowledge/components/pyramid.yaml
# <Pyramid> + <PyramidLevel>. Post-MVP.
# Source: pom.pptx.app/nodes. Verified against @hirokisakabe/pom v10.3.0.

meta:
  phase: post_mvp
  nodes: [Pyramid, PyramidLevel]

description: >
  A pyramid visualization for hierarchical data. Levels stack from narrow (top)
  to wide (bottom) when direction is "up", or wide-to-narrow when "down".
  Use for Maslow's hierarchy, strategic priority tiers, or any layered model.

structure: |
  <Pyramid direction="up" h="280" fontSize="14" bold="true">
    <PyramidLevel label="Self-Actualization" color="$accent" textColor="$onAccent" />
    <PyramidLevel label="Esteem" color="$accentSoft" textColor="$textMain" />
    <PyramidLevel label="Belonging" color="$accentSoft" textColor="$textMain" />
    <PyramidLevel label="Safety" color="$accentSoft" textColor="$textMain" />
    <PyramidLevel label="Physiological" color="$accentSoft" textColor="$textMain" />
  </Pyramid>

Pyramid_attributes:
  direction:  { type: enum, values: [up, down], default: up, note: "'up' = first level is top/narrow; 'down' = first level is top/wide" }
  fontSize:   { type: number, default: 14 }
  bold:       { type: bool }
  fontFamily: { type: string, default: "Noto Sans JP" }
  w:          { type: number, note: "Omit — the pyramid takes its card's width (never scales up)." }
  h:          { type: number, note: "Pixel height — required: 52 x levels + 20." }

PyramidLevel_attributes:
  label:     { type: string, required: true, note: "Level display label" }
  color:     { type: hex, default: "4472C4", note: "Level fill color" }
  textColor: { type: hex, default: "FFFFFF", note: "Label text color — MUST contrast with color" }

sizing_rules: |
  The POM renderer divides the total Pyramid height equally among levels. The
  top level (narrowest in direction="up") gets the least horizontal space. As
  levels increase, per-level height shrinks and the top narrows further.

  fontSize MUST scale down with level count to prevent text overflow:
    3 levels:  fontSize="16"   (comfortable)
    4 levels:  fontSize="15"
    5 levels:  fontSize="14"
    6 levels:  fontSize="14"
    7 levels:  fontSize="14"   (NEVER below 14)

  The pyramid never scales up (sizing plan F6): size the box to the diagram,
  h = 52 x levels + 20, no w, and no grow on its card.

text_color_rules: |
  textColor on each PyramidLevel MUST contrast with that level's fill color.
  POM's default textColor is white, which is INVISIBLE on a pale fill.

  Rule (2026-10-07, palette tokens only):
    - fill $accent: textColor="$onAccent"
    - fill $accentSoft (or any *Soft): textColor="$textMain"

  Common failure: a pale level that keeps the default white text — the text
  disappears. Always set textColor on every level.

  On LIGHT themes (corporate-slate, sky-minimal, etc.), avoid very pale fill
  colors for levels — use medium-to-dark fills so white text is legible, or
  use dark textColor on lighter fills.

notes:
  - "Pyramid needs a pixel h (52 x levels + 20); omit w."
  - "3-7 levels work best. Scale fontSize DOWN as levels increase (see sizing_rules)."
  - "Direction 'up': first PyramidLevel = top/narrowest. Direction 'down': first PyramidLevel = top/widest."
  - "Use a gradient of related hues across levels for visual hierarchy."
  - "ALWAYS check textColor contrast per level — white text on light fills is invisible."

pitfalls:
  - "label is required on every PyramidLevel."
  - "Missing h on Pyramid — it needs a pixel h (52 x levels + 20); the width stretches."
  - "Direction 'up' vs 'down' controls which end is narrow — verify by reading the level order."
  - "fontSize='24' (Text node default) causes overflow — Pyramid default is 14, scale DOWN with levels."
  - "the default white textColor on a pale fill — text is invisible. Set textColor on every level ($onAccent on $accent, $textMain on a *Soft fill)."
  - "w='max' on a Pyramid in a VStack grows its HEIGHT, not its width — omit w."
