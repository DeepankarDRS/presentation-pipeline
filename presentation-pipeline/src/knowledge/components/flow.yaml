# pom-knowledge/components/flow.yaml
# <Flow> + <FlowNode> + <FlowConnection>. Phase D.
# Source: pom.pptx.app/nodes. Verified against @hirokisakabe/pom v10.3.0.

meta:
  phase: D
  nodes: [Flow, FlowNode, FlowConnection]

description: >
  A flowchart of shaped nodes. One <Flow> wraps <FlowNode> entries (the boxes)
  and <FlowConnection> entries (the edges). VERIFIED v10.3.0 (renderPptx/nodes/flow.js):
  the engine places every node in ONE straight line in document order (horizontal
  or vertical); connections never move a node, so branches are not laid out side
  by side. A connection between two nodes that are not neighbours, or back to an
  earlier node, is drawn as a line across the nodes between. Write a branch's
  parallel steps as one node. For a linear process without a decision, prefer
  <ProcessArrow>.

structure: |
  <Flow direction="horizontal" w="1100" h="500" nodeWidth="140" nodeHeight="60" nodeGap="80">
    <FlowNode id="start" shape="flowChartTerminator" text="Start" color="$accentSoft" textColor="$textMain" />
    <FlowNode id="input" shape="flowChartInputOutput" text="Receive Data" color="$accentSoft" textColor="$textMain" />
    <FlowNode id="process" shape="flowChartProcess" text="Process Data" color="$accentSoft" textColor="$textMain" />
    <FlowNode id="decision" shape="flowChartDecision" text="Valid?" color="$warningSoft" textColor="$textMain" />
    <FlowNode id="output" shape="flowChartProcess" text="Save Results" color="$accentSoft" textColor="$textMain" />
    <FlowNode id="end" shape="flowChartTerminator" text="End" color="$accent" textColor="$onAccent" />
    <FlowConnection from="start" to="input" />
    <FlowConnection from="input" to="process" />
    <FlowConnection from="process" to="decision" />
    <FlowConnection from="decision" to="output" label="Yes" />
    <FlowConnection from="output" to="end" />
  </Flow>

Flow_attributes:
  direction:      { type: enum, values: [horizontal, vertical], default: horizontal }
  nodeWidth:      { type: number, default: 120, note: "Default width for all FlowNodes" }
  nodeHeight:     { type: number, default: 60, note: "Default height for all FlowNodes" }
  nodeGap:        { type: number, default: 80, note: "Gap between nodes" }
  connectorStyle: { type: object, note: "connectorStyle.color, connectorStyle.width, connectorStyle.arrowType, connectorStyle.labelColor" }
  w:              { type: number, note: "Explicit width — required" }
  h:              { type: number, note: "Explicit height — required" }

FlowNode_attributes:
  id:        { type: string, required: true, note: "Unique identifier, referenced by FlowConnection from/to" }
  shape:     { type: enum, required: true, values: [flowChartTerminator, flowChartProcess, flowChartDecision, flowChartInputOutput, flowChartDocument, flowChartPredefinedProcess, flowChartConnector, flowChartPreparation, flowChartManualInput, flowChartManualOperation, flowChartDelay, flowChartMagneticDisk] }
  text:      { type: string, required: true, note: "Label text inside the node" }
  color:     { type: hex, note: "Node fill color" }
  textColor: { type: hex, note: "Text color inside the node" }
  width:     { type: number, note: "Override flow-level nodeWidth for this node" }
  height:    { type: number, note: "Override flow-level nodeHeight for this node" }

FlowConnection_attributes:
  from:       { type: string, required: true, note: "id of the source FlowNode" }
  to:         { type: string, required: true, note: "id of the target FlowNode" }
  label:      { type: string, note: "Edge label text (e.g. 'Yes', 'No', 'Error')" }
  color:      { type: hex, note: "Line color for this connection" }
  labelColor: { type: hex, default: "64748B", note: "Label text color, overrides connectorStyle.labelColor" }

notes:
  - "Flow places the nodes in one line in document order — do not try to set x/y."
  - "Connect neighbours only: a connection that skips nodes or goes back is drawn through the nodes between."
  - "The whole flow (nodes, text) is drawn at nodeWidth / nodeHeight / nodeGap and shrunk to fit its box, never enlarged; below 50% it overflows the box. 7 nodes x 170px + gaps need ~1480px: in a half-width card set direction=vertical."
  - "Flow needs explicit w and h."
  - "Every FlowNode must have a unique id within the Flow."
  - "FlowConnection from/to must reference existing FlowNode ids."
  - "Common shapes: flowChartTerminator (start/end ovals), flowChartProcess (rectangles), flowChartDecision (diamonds), flowChartInputOutput (parallelograms)."
  - "For a simple linear process without a decision, use ProcessArrow instead."

pitfalls:
  - "FlowNode id, shape, and text are all required — omitting any will fail."
  - "FlowConnection from/to referencing a nonexistent id will fail."
  - "Missing w/h on Flow — will not render correctly."
  - "Decision nodes (shape='decision') auto-size their diamond — keep text short (1-3 words)."
  - "Duplicate FlowNode ids within the same Flow will cause connection ambiguity."
