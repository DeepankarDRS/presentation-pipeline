# pom-knowledge/components/flow.yaml
# <Flow> + <FlowNode> + <FlowConnection>. Phase D.
# Source: pom.pptx.app/nodes. Verified against @hirokisakabe/pom v10.3.0.
# What POM draws is stated ONLY in `facts` (each with a probe compiled by
# tests/unit/test_node_facts.py); attribute lists are checked against POM's own rules.

meta:
  phase: D
  nodes: [Flow, FlowNode, FlowConnection]

description: >
  A flowchart of shaped nodes. One <Flow> wraps <FlowNode> entries (the boxes)
  and <FlowConnection> entries (the edges). How it is drawn: see facts. Write a
  branch's parallel steps as one node. For a linear process without a decision,
  prefer <ProcessArrow>.

structure: |
  <!-- direction: horizontal | vertical (by the box it gets: see facts flow.direction) -->
  <Flow direction="vertical" h="max" minH="200" nodeWidth="140" nodeHeight="60" nodeGap="40">
    <FlowNode id="start" shape="flowChartTerminator" text="Start" color="$accentSoft" textColor="$textMain" />
    <FlowNode id="input" shape="flowChartInputOutput" text="Receive Data" color="$accentSoft" textColor="$textMain" />
    <FlowNode id="decision" shape="flowChartDecision" text="Valid?" color="$warningSoft" textColor="$textMain" />
    <FlowNode id="output" shape="flowChartProcess" text="Save Results" color="$accentSoft" textColor="$textMain" />
    <FlowNode id="end" shape="flowChartTerminator" text="End" color="$accent" textColor="$onAccent" />
    <FlowConnection from="start" to="input" />
    <FlowConnection from="input" to="decision" />
    <FlowConnection from="decision" to="output" label="Yes" />
    <FlowConnection from="output" to="end" />
  </Flow>

Flow_attributes:
  direction:      { type: enum, values: [horizontal, vertical], default: horizontal, note: "A layout choice per slide (facts flow.direction)" }
  nodeWidth:      { type: number, default: 120, note: "Default width for all FlowNodes" }
  nodeHeight:     { type: number, default: 60, note: "Default height for all FlowNodes" }
  nodeGap:        { type: number, default: 80, note: "Gap between nodes" }
  connectorStyle: { type: object, note: "connectorStyle.color, connectorStyle.width, connectorStyle.arrowType, connectorStyle.labelColor" }
  w:              { type: number, note: "Optional: without it the box is the flow's natural width (facts flow.natural_size)" }
  h:              { type: number, note: "Optional: without it the box is the flow's natural height" }

FlowNode_attributes:
  id:        { type: string, required: true, note: "Unique identifier, referenced by FlowConnection from/to" }
  shape:     { type: enum, required: true, values: [flowChartTerminator, flowChartProcess, flowChartDecision, flowChartInputOutput, flowChartDocument, flowChartPredefinedProcess, flowChartConnector, flowChartPreparation, flowChartManualInput, flowChartManualOperation, flowChartDelay, flowChartMagneticDisk] }
  text:      { type: string, required: true, note: "Label text inside the node" }
  color:     { type: hex, note: "Node fill color" }
  textColor: { type: hex, note: "Text color inside the node" }
  width:     { type: number, note: "This node's shape only; its slot stays nodeWidth (facts flow.node_override)" }
  height:    { type: number, note: "This node's shape only" }

FlowConnection_attributes:
  from:       { type: string, required: true, note: "id of the source FlowNode" }
  to:         { type: string, required: true, note: "id of the target FlowNode" }
  label:      { type: string, note: "Edge label text (e.g. 'Yes', 'No', 'Error')" }
  color:      { type: hex, note: "Line color for this connection" }
  labelColor: { type: hex, default: "64748B", note: "Label text color, overrides connectorStyle.labelColor" }

notes:
  - "Every FlowNode must have a unique id within the Flow."
  - "Common shapes: flowChartTerminator (start/end ovals), flowChartProcess (rectangles), flowChartDecision (diamonds), flowChartInputOutput (parallelograms)."
  - "For a simple linear process without a decision, use ProcessArrow instead."

pitfalls:
  - "FlowNode id, shape, and text are all required — omitting any will fail."
  - "A Flow with no FlowConnection fails to build; a FlowConnection to an id that does not exist is not drawn (no error)."
  - "A decision diamond is the same nodeWidth x nodeHeight box as the other nodes, so it has less room for text — keep its text short (1-3 words)."
  - "Duplicate FlowNode ids within the same Flow will cause connection ambiguity."

# The plan chooses these per slide; examples show every value (lint: test_node_facts.py).
open_choices:
  direction: { values: [horizontal, vertical], rule: flow.direction }

# Claims found wrong (2026-10-16); no prompt or knowledge file may state them again.
refuted:
  - { pattern: 'auto-?layout', fact: flow.one_line, note: "nodes are placed in one line; nothing is laid out around connections" }
  - { pattern: 'Flow needs explicit w and h|Missing w/h on Flow', fact: flow.natural_size }
  - { pattern: 'auto-size their diamond', fact: flow.natural_size }
  - { pattern: "shape='decision'", fact: flow.natural_size, note: "the shape is flowChartDecision" }
  - { pattern: 'referencing a nonexistent id will fail', fact: flow.connections }
  - { pattern: 'FlowNode text MUST be|FlowNode / Timeline fontSize', fact: flow.natural_size, note: "FlowNode has no fontSize: its text is 14 px x scale" }

facts:
  - id: flow.one_line
    kind: layout
    for: [planner, generator]
    text: >-
      Flow draws every node in ONE straight line in document order (a row, or a column when
      vertical); connections never move a node, so branches are not drawn side by side.
    source: renderPptx/nodes/flow.js calculateHorizontalLayout / calculateVerticalLayout
    probes:
      - xml: >-
          <Flow><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartDecision" text="B"/>
          <FlowNode id="c" shape="flowChartProcess" text="C"/><FlowNode id="d" shape="flowChartProcess" text="D"/>
          <FlowConnection from="a" to="b"/><FlowConnection from="b" to="c" label="Yes"/><FlowConnection from="b" to="d" label="No"/></Flow>
        expect:
          - ok
          - same([t(x).cy for x in "ABCD"])
          - t("A").x < t("B").x < t("C").x < t("D").x
      - xml: >-
          <Flow direction="vertical"><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartDecision" text="B"/>
          <FlowNode id="c" shape="flowChartProcess" text="C"/><FlowConnection from="a" to="b"/><FlowConnection from="a" to="c"/></Flow>
        expect:
          - ok
          - same([t(x).cx for x in "ABC"])
          - t("A").y < t("B").y < t("C").y

  - id: flow.back_link
    kind: layout
    for: [generator]
    text: >-
      Only a connection from a node to the next one is drawn between them: one that skips a
      node, or goes back (even to the node just before), is drawn as a straight line through
      the nodes on its way — connect each node to the next one only.
    source: renderPptx/nodes/flow.js drawConnection
    probes:
      - xml: >-
          <Flow><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/>
          <FlowNode id="c" shape="flowChartProcess" text="C"/><FlowConnection from="a" to="b"/><FlowConnection from="b" to="c"/>
          <FlowConnection from="c" to="a" label="No"/></Flow>
        expect:
          - ok
          - any(l.h == 0 and l.x <= t("B").x and l.r >= t("B").r and t("B").y <= l.y <= t("B").b for l in lines)
      - xml: >-
          <Flow><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/>
          <FlowNode id="c" shape="flowChartProcess" text="C"/><FlowConnection from="a" to="b"/><FlowConnection from="c" to="b" label="No"/></Flow>
        expect:
          - ok
          - any(l.h == 0 and l.x <= t("B").x and l.r >= t("C").r for l in lines)

  - id: flow.natural_size
    kind: layout
    for: [planner, generator]
    text: >-
      Each node is nodeWidth x nodeHeight (120 x 60 by default, a decision diamond too) with
      nodeGap (80) between, so a horizontal flow needs nodes x 120 + gaps x 80 px at full size
      (5 nodes: 920 px); node text is 14 px, white unless textColor is set.
    source: calcYogaLayout/measureCompositeNodes.js measureFlow; renderPptx/nodes/flow.js
    probes:
      - xml: >-
          <Flow><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartDecision" text="B"/>
          <FlowNode id="c" shape="flowChartTerminator" text="C"/><FlowConnection from="a" to="b"/></Flow>
        expect:
          - ok
          - near(box.w, 3 * 120 + 2 * 80) and near(box.h, 60)
          - all(near(t(x).w, 120) and near(t(x).h, 60) for x in "ABC")
          - t("B").font == 14

  - id: flow.wh_optional
    kind: layout
    for: [generator]
    text: >-
      w and h are optional: without them the box is the flow's natural size (in a VStack it
      stretches to the parent's width) and the nodes are drawn centred in it.
    source: registry/definitions/compositeNodes.js applyCompositeMeasure
    probes:
      - xml: '<Flow><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/><FlowConnection from="a" to="b"/></Flow>'
        align: stretch
        expect:
          - ok
          - near(box.w, 1200) and near(box.h, 60)
          - near(extent([t("A"), t("B")]).cx, box.cx)

  - id: flow.scale
    kind: layout
    for: [generator]
    text: >-
      POM draws the flow at that natural size and shrinks it, text included, to fit its box
      (never enlarges it); below 50% it stops shrinking, draws past its box and warns
      SCALE_BELOW_THRESHOLD.
    source: renderPptx/utils/scaleToFit.js calcScaleFactor
    probes:
      - xml: '<Flow w="1000" h="300"><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/><FlowConnection from="a" to="b"/></Flow>'
        expect: [ok, 'near(t("A").w, 120)', 't("A").font == 14']
      - xml: '<Flow w="400" h="200"><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/><FlowNode id="c" shape="flowChartProcess" text="C"/><FlowConnection from="a" to="b"/></Flow>'
        expect: [ok, 'near(t("A").w, 120 * 400 / 520)', 'near(t("A").font, 14 * 400 / 520, 0.1)', '"SCALE_BELOW_THRESHOLD" not in warnings']
      - xml: '<Flow w="300" h="200"><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/><FlowNode id="c" shape="flowChartProcess" text="C"/><FlowNode id="d" shape="flowChartProcess" text="D"/><FlowConnection from="a" to="b"/></Flow>'
        expect: [ok, '"SCALE_BELOW_THRESHOLD" in warnings', 'near(t("A").w, 60)', 'extent([t(x) for x in "ABCD"]).w > box.w']

  - id: flow.node_override
    kind: layout
    for: [generator]
    text: >-
      A FlowNode's own width / height resize only its shape: its slot stays nodeWidth wide, so a
      node wider than nodeWidth overlaps the gap or its neighbour — set nodeWidth instead.
    source: renderPptx/nodes/flow.js calculateHorizontalLayout
    probes:
      - xml: >-
          <Flow nodeWidth="100" nodeGap="20"><FlowNode id="a" shape="flowChartProcess" text="A"/>
          <FlowNode id="b" shape="flowChartProcess" text="B" width="200"/><FlowNode id="c" shape="flowChartProcess" text="C"/>
          <FlowConnection from="a" to="b"/></Flow>
        expect: [ok, 'near(t("B").w, 200)', 't("B").x < t("A").r', 't("B").r > t("C").x']

  - id: flow.connections
    kind: syntax
    for: [generator]
    text: >-
      A Flow needs at least one FlowConnection (POM 10.3.0 fails to build a Flow without one);
      a FlowConnection whose from / to is not a FlowNode id is silently not drawn.
    source: renderPptx/nodes/flow.js (for ... of node.connections; missing layout -> continue)
    probes:
      - xml: '<Flow><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/></Flow>'
        expect: [not ok, '"connections" in errors']
      - xml: '<Flow><FlowNode id="a" shape="flowChartProcess" text="A"/><FlowNode id="b" shape="flowChartProcess" text="B"/><FlowConnection from="a" to="zz"/></Flow>'
        expect: [ok, 'len(lines) == 0']

  - id: flow.direction
    kind: advice
    for: [planner, generator]
    text: >-
      direction is a layout choice per slide: horizontal when the flow spans the slide width,
      vertical when it shares the width with another component or has more nodes than fit
      side by side.
    source: "follows from flow.natural_size and flow.scale; XTSY 6, 7 horizontal nodes in a 250-655 px box drawn at 18-44% (docs/eval/deck-output-fixes-2026-10-15.md)"
