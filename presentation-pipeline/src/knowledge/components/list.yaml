# pom-knowledge/components/list.yaml
# <Ul> / <Ol> / <Li>. Phase B.
# Source: llm.txt "Ul (Bullet List)" + "Ol (Numbered List)".

meta:
  phase: B
  nodes: [Ul, Ol, Li]

description: >
  A bullet (<Ul>) or numbered (<Ol>) list. Style is set on the list; individual
  <Li> can override. This is the POM replacement for HTML <ul>/<ol>/<li>.

structure: |
  <Ul fontSize="18" color="$textMuted" lineHeight="1.5">
    <Li>First point</Li>
    <Li>Second point</Li>
    <Li bold="true" color="$textMain">Emphasised point</Li>
  </Ul>

Ul_attributes:
  fontSize:   { type: number, default: 24 }
  color:      { type: hex }
  textAlign:  { type: enum, values: [left, center, right] }
  bold:       { type: bool }
  italic:     { type: bool }
  strike:     { type: bool }
  fontFamily: { type: string }
  lineHeight: { type: number, default: 1.3 }

Ol_extra_attributes:
  numberType:    { type: enum, values: [alphaLcPeriod, alphaUcPeriod, arabicParenR, arabicPeriod], note: "and more" }
  numberStartAt: { type: number, default: 1 }

Li_attributes: [bold, italic, strike, subscript, superscript, underline, highlight, color, fontSize, fontFamily]

notes:
  - "Lowercase <ul>/<ol>/<li> are HTML. Use <Ul>/<Ol>/<Li>."
  - "<Li> may contain inline tags (B, I, Span, Mark)."
  - "Give the list an explicit w on its parent (or the list) so long items wrap."
  - "For a title + bullets slide, put the <Ul> where the body <Text> would go in layouts/title-content.yaml."

pitfalls:
  - "No nested <Ul> inside <Li> in the MVP — keep lists flat."
  - "Don't mix a <Ul> and manual bullet characters in <Text>; pick one."
