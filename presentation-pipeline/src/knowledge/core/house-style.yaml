# pom-knowledge/core/house-style.yaml
# ---------------------------------------------------------------------------
# The house layout GRAMMAR. Not a set of templates - a compositional spec the
# generator uses to lay out ANY slide. Distilled from compile+render-verified
# reference slides (see tests/fixtures/golden/) and POM v10.3.0 behaviour.
#
# Rendered into the generator prompt by context_builder. Keep it tight.
# The generator composes freely FROM this vocabulary; it never copies a shape.
# ---------------------------------------------------------------------------

meta:
  slide: { w: 1280, h: 720 }        # fixed frame, always
  min_font: 14                       # layout_audit rejects anything smaller
  max_stack_nesting: 6

# --- the frame -------------------------------------------------------------
frame: >
  Root is EITHER <VStack w="1280" h="720" padding="P" gap="G"
  alignItems="stretch" backgroundColor="$surface"> (horizontal bands, top-to-
  bottom) OR <HStack w="1280" h="720" padding="P" gap="G"
  alignItems="stretch" backgroundColor="$surface"> (vertical splits, left-to-
  right — use for full-bleed 50/50 or 60/40 layouts). P = 32-40, G = 14-22.
  Nothing on the slide is positioned in absolute pixels from the slide origin —
  everything is a child of this root stack and flows. The root's fixed size is
  what makes every relative size below resolve to real pixels. DEFAULT to VStack
  unless the layout intent calls for full-height vertical columns.

# --- sizing vocabulary ---------------------------------------------------
# How to size any box. Pick by INTENT, not habit.
vocabulary:
  'w="1280" h="720"': 'the root VStack or HStack only. Never on a child.'
  'w="max"': >
    flexGrow:1 - take an equal share of the parent's remaining main-axis space.
    The DEFAULT for anything that should stretch: content bands, equal-weight
    sibling cards, a Chart/Table/Matrix filling its column. N siblings split evenly.
  'w="62%" (any %)': >
    an explicit share of the parent, for an ASYMMETRIC split - bigger % = the
    side with more content / the primary element. Typical 60/40, 65/35. Sum to 100.
  'grow="2" / grow="1"': 'ratio split (2:1) instead of computing percentages.'
  'w="320" (fixed px)': >
    only for things that must not flex: icon, accent bar, divider, sidebar rail,
    badge. Never fixed-px a column holding flowing text or a chart.
  'h="188" (fixed px)': >
    REQUIRED on rigid nodes (Chart/Table/Matrix/ProcessArrow/Flow/Pyramid/
    Tree/Timeline) and bands containing one. NEVER on text-only bands —
    they auto-size. Forcing h on text causes overflow.
  'minW / maxW / minH / maxH': 'clamp a flexible box so it cannot collapse or run away.'

alignment:
  'alignItems': >
    start | center | end | stretch(default). Content HStack: alignItems="stretch"
    so side-by-side cards end up the same height. Header HStack: start/center/end.
  'justifyContent': >
    start | center | end | spaceBetween | spaceAround | spaceEvenly. spaceBetween
    pushes two groups to the edges (eyebrow left / badge right; label / value).
  'alignSelf': 'one child opting out of the parent''s alignItems.'
  'flexWrap="wrap"': >
    on a row of tiles/cards that might not fit - they wrap to a new line
    instead of overflowing or overlapping. Use for KPI rows of 4+.

# --- composition --------------------------------------------------------
composition: >
  VStack/HStack nesting IS composition. Every visual grouping — card, panel,
  grid, tile, titled section — is a nested stack with styling attributes
  (backgroundColor, padding, borderRadius, border). No special constructs.

  Start with 2-4 top-level BANDS in the root VStack, but each band can
  contain nested sub-layouts to any depth (max 6 levels). A band is not
  atomic — it is itself a composition boundary.

  NESTING DEPTH: Level 1 = structural partitioning (bands dividing the slide).
  Level 2 = content regions (columns, card rows). Level 3+ = visual grouping
  (individual cards, stat clusters, titled sections). Deeper = more local.

  DIVISION within any stack (applies at EVERY nesting level):
    - N children each w="max"         = equal split
    - grow="2" / grow="1"             = ratio split (2:1, 3:1, etc.)
    - w="62%" / w="38%"               = explicit asymmetric split
    - w="260" fixed + w="max" flex    = rail + body
    - flexWrap="wrap" + fixed/% widths = grid that reflows

  SIZING THROUGH NESTING: parent constrains children. At each level use the
  same sizing vocabulary (max, %, grow, fixed px). Nested stacks inherit
  width from their parent; children size within remaining space after padding.
  Height rules still apply: rigid nodes need explicit h, text-only omit h.

  ALIGNMENT: each nested stack sets its own alignItems/justifyContent
  independently. Use alignSelf on one child to override the parent's rule.

  HStack ROOT (full-bleed vertical splits): for full-height columns. Each
  child is a full-height VStack. Divide with w="62%"/w="38%", grow, or max.

  RHYTHM: vary nesting depth across bands — flat band next to a deeply
  nested card grid creates visual contrast.

header_band: >
  <HStack w="max" justifyContent="spaceBetween" alignItems="start">: left a
  <VStack gap="4-5"> of eyebrow + title + optional subtitle (see type ramp);
  right optional - a badge or one headline KPI.

# --- height budget -----------------------------------------------------
# THE #1 FAILURE: VStack/HStack children default to flexShrink=1. If your
# band heights sum to MORE than the root's 720, nothing errors - POM silently
# shrinks every band to fit, text overflows its squashed card, and bands
# overlap (the chart slides up over the KPI deltas, the title sits on the
# cards). It compiles clean. So the budget must come in UNDER 720, not over.
height_budget: |
  1. Classify: RIGID (Chart/Table/Matrix/ProcessArrow/Flow/Pyramid/Tree/
     Timeline) → explicit pixel h. TEXT (no rigid child) → NO h, auto-sizes.
  2. available_h = 720 - 2*padding - ~90 header - (N-1)*gap.
     Text bands must stay ≤ ~150px each — cut text if longer. Subtract
     text estimates; remainder = rigid budget.
  3. Sanity: all heights + gaps + 2*padding ≈ 640-700. Over 720 → overlap.
  4. Rigid in card: h = band_h - 2*padding - ~28 title.
  TEXT LIMITS: bullets 1 line each (~55 chars max), callout 1 sentence (≤ 80 chars).
  HARD RULE: if bullet text exceeds ~55 chars, REWRITE shorter — never shrink font.
  If a callout exceeds 80 chars, REWRITE — never shrink font. Max 4 bullets per list.
  Rigid heights: chart 260-360 | table 240-360 | timeline 200-300 |
  matrix 260-340 | process arrow 150-200 | flow 200-300 |
  pyramid 300-440 (sole/hero: 400-480) | tree 240-340.
  Pyramid fontSize: 16 (3 levels), 15 (4), 14 (5), 14 (6-7). Always w="max".
  ProcessArrow fontSize: min 14. FlowNode fontSize: min 14. Timeline: min 14.
worked_example: |
  P=36, G=16: header(auto ~90) + KPI(text,auto ~120) + chart(rigid) + callout(text,auto ~88).
  Rigid budget: 720-72-90-120-88-48(gaps)=302. Chart card h="300", inside h=236.
  KPI + callout: NO h — auto-size.

weight_allocation: |
  Components may carry a height-weight tag (hero/peer/supporting/minor).
  Use it to divide available_h (after header, padding, gaps are subtracted):
    hero:       50-60% of available_h. Max one per slide. THE thing to see.
    peer:       equal share of what remains after hero/supporting/minor.
    supporting: 25-35%. Secondary context beside a hero.
    minor:      10-15%. Accent, caption, footnote.
  When no hero exists, peers split evenly: available_h / N.
  height-weight is NOT a POM attribute — never put it in XML tags.
  visual-intent per component guides look-and-feel WITHIN the band (emphasis,
  gradient, highlight) — not the band's height. It is also NOT a POM attribute.

# --- rigid nodes (verified v10.3.0 render behaviour) -------------------
rigid_nodes: >
  All rigid DATA nodes (see height_budget list) do NOT size themselves.
    - width : w="max" WORKS on most. Horizontal Timeline: use explicit pixel w.
    - height: MUST be an explicit pixel h. No h -> renders wrong or tiny.
    - Table : one <Col> per column. Omit width on most columns (auto-fill);
      set width only on columns that need more or less room. Every <Td>
      needs backgroundColor + color.
  A rigid node lives inside a <VStack w="max"|"NN%">; the node is
  w="max" h="<computed>" within it.

# --- recipes (parameterised, not slides) ------------------------------
recipes:
  surface_card: >
    <VStack w="max" padding="14-22" gap="6-14" backgroundColor="$surfaceAlt"
      borderRadius="12-16" border.color="$border" border.width="1">
    The default container for a chart, a stat cluster, a table.
  accent_card: >
    a card with ONE accent edge: borderTop.color="$accent" borderTop.width="4"
    (top stripe) or borderLeft.color="$accent" borderLeft.width="5" (list item).
    VERIFIED: a one-edge accent stripe renders cleanly ONLY on a SQUARE card -
    do NOT combine borderTop/borderLeft accent with borderRadius (the stripe
    wraps the rounded corner and looks like a bracket). Rounded cards
    (borderRadius 12-16) use just the border.color="$border" hairline; put the
    accent in the value text color or a small <Shape> bar instead.
  hero_panel: >
    <VStack w="max"|"NN%" padding="18-24" gap="10-16" borderRadius="14-18"
      justifyContent="center">
    A high-contrast panel for THE message / key choice. On a LIGHT theme:
    backgroundColor="$textMain" with heading color="$surfaceAlt". On a DARK
    theme $textMain is the light ink - use backgroundColor="$surfaceAlt" with a
    borderLeft.color="$accent" borderLeft.width="5" and normal $textMain text
    instead. Heading is ONE line (<= ~24 chars - long headings wrap to 3 lines
    and overrun the panel); body one short sentence; optional a 2-3 row stat
    list. Do NOT stack heading + long body + stats in a short panel. One per slide.
  micro_pair: >
    a label-over-value stat with no card: <VStack gap="2"><Text 10-12
    "$textMuted">Label</Text><Text 24-34 bold "$textMain">Value</Text></VStack>.
    2-3 side by side in an HStack; justifyContent="spaceBetween" spreads them
    across the row. spaceBetween is for that horizontal row ONLY - never as the
    justifyContent of a vertical card.
  accent_bar: '<Shape shapeType="rect" w="120" h="6" backgroundColor="$accent" /> under a title.'
  badge: >
    <Shape shapeType="roundRect" w="100-160" h="26-30" fill.color="a pale tint"
    color="$textMain" fontSize="14" bold="true" borderRadius="999">SHORT LABEL</Shape>

# --- type ramp (fontSize) --------------------------------------------
type_ramp:
  eyebrow: "14 bold, letterSpacing 2, $accent. NEVER below 14."
  slide_title: "27-32 bold, $textMain"
  subtitle: "14-16 $textMuted. NEVER below 14."
  card_title: "14-16 bold, $textMain"
  label: "14 $textMuted. NEVER below 14."
  body: "14-16, $textMain or $textMuted, lineHeight 1.4-1.55. NEVER below 14."
  stat_value: "26-36 bold"
  hero_number: "36-64 bold ($accent or $surface on a hero_panel)"
  caption: "14 $textMuted. NEVER below 14."

font_floor: >
  ABSOLUTE RULE: no fontSize on ANY element may be below 14. This applies to
  Text, Ul, Li, Span, Shape labels, ProcessArrowStep, TimelineItem, PyramidLevel,
  FlowNode, TreeItem, MatrixItem, and every other node that renders text. If the
  content does not fit at fontSize 14, CUT THE CONTENT — never shrink the font.
  The layout_audit flags FONT_TOO_SMALL as a hard failure, not a suggestion.

spacing_scale: "use 2, 4, 6, 8, 10, 12, 14, 16, 18, 22 - nothing in between."

color_discipline: >
  Every color is a $token or a 6-digit hex (NO #). Body text $textMain /
  $textMuted only. $accent for the eyebrow, one figure, one edge - not whole
  blocks. $positive / $negative only on deltas. Card bg is $surfaceAlt;
  slide bg $surface; inverted panel $textMain. chartColors is literal hex,
  copied from the resolved palette - $tokens do NOT resolve inside it.
  Do NOT emit a <Theme> - the pipeline injects exactly one.
  COVER/HERO slides follow the SAME token rules — never hardcode raw hex
  for large backgrounds (use $surface, $surfaceAlt, $textMain, $accent).
  Raw hex is acceptable ONLY for chartColors and small decorative accents.

# --- render gotchas (verified v10.3.0 + LibreOffice) -----------------
render_gotchas:
  - "FONT SHRINK (the #1 quality killer): the generator tends to shrink fonts
     to fit more content. This produces 8-12pt text that is illegible when
     projected. NEVER emit fontSize below 14 on any element. If content does
     not fit, CUT the content (fewer bullets, shorter text, fewer KPI tiles).
     All recipes now use 14pt minimum. Copy those sizes exactly."
  - "FLEX SHRINK (the big one): VStack/HStack children default to flexShrink=1.
     If the band heights sum to more than 720 the compiler does NOT error - it
     shrinks every band, text overflows its squashed card, and bands overlap
     (chart over the KPI deltas, title over the cards). Budget must land <=700.
     Text-only bands should OMIT h (auto-size); forcing h causes overflow."
  - "A KPI tile with justifyContent=\"spaceBetween\" and h=300+ is the classic
     bad KPI card: label glued to the top, number floating low, delta clipped
     at the bottom. Use justifyContent=\"center\" and h=110-150."
  - "Text wrapping: POM measures text with its own font; the renderer may wrap
     one line more than POM expected, pushing siblings down. Keep headings on
     hero panels and cards SHORT and give panels/cards a little height slack.
     Never rely on a heading staying on N lines."
  - "MatrixItem: the label renders BESIDE the dot on the CARD background, not on
     the dot. Do NOT set textColor=\"FFFFFF\" on a light card - the label
     vanishes. Leave textColor unset (inherits itemLabelColor)."
  - "ProcessArrowStep label: 1-2 short words only at h<=70; longer text clips."
  - "Horizontal Timeline: max 5 items, 1-3 word labels. Sentences collide. Explicit pixel w."
  - "A rigid node (Chart/Matrix/Table) placed in a column narrower than ~45% of
     the slide gets cramped - axis labels and legends collide. Give it room."
  - "roundRect <Shape> with text: keep the label short; it does not wrap
     gracefully inside the pill."
  - "justifyContent=\"spaceBetween\" with two wide <Text> children can trip a 1px
     NODE_OVERLAP warning where they meet - keep the value side short, or give
     the label grow=\"1\" and let the value size naturally."
  - "$textMain is the theme INK, light on DARK themes. A dark-filled panel uses
     $textMain bg on a LIGHT theme only; on a DARK theme use $surfaceAlt bg."

layout_archetypes: |
  Every slide MUST use one of these five archetypes. NEVER repeat the same
  archetype on consecutive slides — check PREVIOUS SLIDE ARCHETYPE in the
  user prompt and pick a DIFFERENT one.

  A  SPLIT-HERO — HStack root. 56-60% content left + 40-44% accent/dark
     panel right (or reversed). For cover, closing, or any slide with a
     strong statement + supporting detail. The dark panel carries a closing
     note, KPIs, or a hero number.

  B  DASHBOARD — VStack root. Header → KPI tile row → HStack(60% chart
     card + 40% stacked insight cards). The stacked cards can be dark
     readouts, accent-stripe callouts, or metric summaries. Classic
     data-rich slide.

  C  FULL-WIDTH-DATA — VStack root. Header → optional KPI row → one
     full-width table or chart card → callout strip. For executive
     summaries or when one data component dominates. Clean, focused.

  D  EQUAL-COLUMNS — VStack root. Header → HStack of 3-5 equal tall
     cards, each with accent-stripe top (different color per card),
     numbered header, and internal structure (bullets, stats). For
     pillars, what-worked/didn't, options, or any parallel items.

  E  DENSE-QUAD — VStack root. Header → HStack(50% stacked tables +
     50% chart + dark readout panel). For deep-dives with multiple
     data views. Most information-dense layout.

  Archetype fitness:
    cover/closing  → A (split-hero)
    data (chart+table) → B (dashboard) or E (dense-quad)
    data (single table or chart) → C (full-width-data)
    content (pillars, options, phases) → D (equal-columns)
    content (narrative + data) → B (dashboard)

design_variety: >
  NEVER repeat the same layout archetype on consecutive slides. Check the
  PREVIOUS SLIDE ARCHETYPE signal and pick a different one. A deck with
  five identical VStack-bands slides looks templated, not designed. Also
  vary card treatments — not every slide needs the same borderRadius/
  border.color style. Use at most ONE dark panel ($textMain bg) per 3 slides.

# --- pre-emit checklist ---------------------------------------------
checklist:
  - "FONT FLOOR: EVERY fontSize on EVERY element is >= 14. Scan every Text,
     Ul, Shape, ProcessArrowStep, FlowNode, PyramidLevel, TreeItem, TimelineItem.
     If ANY is below 14, FIX IT before anything else. This is the #1 rule."
  - "Root VStack or HStack is w=1280 h=720 with padding 32-40, gap 14-22, alignItems=\"stretch\"."
  - "2-4 top-level bands, each w=\"max\"; nesting within bands matches content grouping."
  - "Every RIGID band (Chart/Table/Matrix/etc. inside) has explicit h=. Text-only bands and header: NO h (auto-size)."
  - "I ADDED UP header_h + every band h + every gap + 2*padding and the total
     is between ~640 and ~700. If over 720 the slide WILL overlap."
  - "KPI row: no h (auto-sizes). Tiles: justifyContent=\"center\". Labels 14pt, values 26-36pt."
  - "Every Chart/Matrix/ProcessArrow has w=\"max\" AND an explicit computed h."
  - "Side-by-side cards share a band with alignItems=\"stretch\"."
  - "Every <HStack> whose children use grow or w=\"max\" itself has w=\"max\"."
  - "No fixed-px width on a text or chart column."
  - "Bullet lists: max 3-4 items, each ≤ 50 chars, fontSize 14-16."
  - "At most one hero_panel. Accent used as a highlight, not a fill."
  - "If the total is well under ~640, ADD a band (stat row / callout / second
     visual) - don't inflate one band's h to fill the gap."
