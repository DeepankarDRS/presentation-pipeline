# pom-knowledge/core/house-style.yaml
# ---------------------------------------------------------------------------
# The house layout GRAMMAR. Not a set of templates - a compositional spec the
# generator uses to lay out ANY slide. Distilled from compile+render-verified
# reference slides (see tests/fixtures/golden/) and POM v10.3.0 behaviour.
#
# Rendered into the generator prompt by context_builder. Keep it tight.
# The generator composes freely FROM this vocabulary; it never copies a shape.
# ---------------------------------------------------------------------------

meta:
  slide: { w: 1280, h: 720 }        # fixed frame, always
  min_font: 14                       # layout_audit rejects anything smaller
  max_stack_nesting: 6

# --- the frame -------------------------------------------------------------
frame: >
  Root is EITHER <VStack w="1280" h="720" padding="P" gap="G"
  alignItems="stretch" backgroundColor="$surface"> (horizontal bands, top-to-
  bottom) OR <HStack w="1280" h="720" padding="P" gap="G"
  alignItems="stretch" backgroundColor="$surface"> (vertical splits, left-to-
  right — use for full-bleed 50/50 or 60/40 layouts). P = 48-56, G = 24-36
  (2026-10-08: more air between header and body; docs/eval/hand-qbr).
  Nothing on the slide is positioned in absolute pixels from the slide origin —
  everything is a child of this root stack and flows. The root's fixed size is
  what makes every relative size below resolve to real pixels. DEFAULT to VStack
  unless the layout intent calls for full-height vertical columns.

# --- sizing vocabulary ---------------------------------------------------
# How to size any box. POM's flexbox allocates; nothing is pixel arithmetic.
# Verified on v10.3.0: docs/layout-sizing-plan.md facts F1-F6.
vocabulary:
  'w="1280" h="720"': 'the root VStack or HStack only. Never on a child.'
  'width in a VStack': >
    stretch (the default) - omit w. NEVER w="max" on a VStack child: it grows
    the HEIGHT and overrides h (a KPI row with h="150" renders 495px).
  'width in an HStack': 'w="max" = equal share, w="62%" = explicit share (sum 100), grow="2" = ratio.'
  'grow="N" in a VStack': 'share of the spare height (SIZING BY WEIGHT); no grow = content height.'
  'h="max" minH': 'a chart/diagram fills its card; minH = readability floor (COMPONENT SIZING gives each kind''s).'
  'fixed px': >
    only icon, accent bar, divider, sidebar rail, and a size COMPONENT SIZING
    gives. Never a pixel h on a band or card.
  'minW / maxW / minH / maxH': 'clamp a flexible box so it cannot collapse or run away.'

alignment:
  'alignItems': >
    start | center | end | stretch(default). Content HStack: alignItems="stretch"
    so side-by-side cards end up the same height. Header HStack: start/center/end.
  'justifyContent': >
    start | center | end | spaceBetween | spaceAround | spaceEvenly. spaceBetween
    pushes two groups to the edges (label / value).
  'alignSelf': 'one child opting out of the parent''s alignItems.'
  'flexWrap="wrap"': >
    on a row of tiles/cards that might not fit - they wrap to a new line
    instead of overflowing or overlapping. Use for KPI rows of 4+.

# --- composition --------------------------------------------------------
composition: >
  VStack/HStack nesting IS composition. Every visual grouping — card, panel,
  grid, tile, titled section — is a nested stack with styling attributes
  (backgroundColor, padding, borderRadius, border). No special constructs.

  Start with 2-4 top-level BANDS in the root VStack, but each band can
  contain nested sub-layouts to any depth (max 6 levels). A band is not
  atomic — it is itself a composition boundary.

  NESTING DEPTH: Level 1 = structural partitioning (bands dividing the slide).
  Level 2 = content regions (columns, card rows). Level 3+ = visual grouping
  (individual cards, stat clusters, titled sections). Deeper = more local.

  DIVISION within an HStack (widths, at EVERY nesting level):
    - N children each w="max"         = equal split
    - grow="2" / grow="1"             = ratio split (2:1, 3:1, etc.)
    - w="62%" / w="38%"               = explicit asymmetric split
    - w="260" fixed + w="max" flex    = rail + body
    - flexWrap="wrap" + fixed/% widths = grid that reflows
  DIVISION within a VStack (heights): children stretch to full width (no w);
  grow="N" shares the spare height; no grow = content height.

  SIZING THROUGH NESTING: parent constrains children. Nested stacks inherit
  width from their parent; children size within remaining space after padding.
  Heights: see SIZING BY WEIGHT and COMPONENT SIZING.

  ALIGNMENT: each nested stack sets its own alignItems/justifyContent
  independently. Use alignSelf on one child to override the parent's rule.

  HStack ROOT (full-bleed vertical splits): for full-height columns. Each
  child is a full-height VStack. Divide with w="62%"/w="38%", grow, or max.

  RHYTHM: vary nesting depth across bands — flat band next to a deeply
  nested card grid creates visual contrast.

header_band: >
  <HStack justifyContent="spaceBetween" alignItems="start"> (no h, no grow): left a
  <VStack gap="8-10"> of the planned kicker + headline + subtitle (see type ramp);
  right optional - one headline KPI from the plan. No badge or pill in the header:
  the kicker is plain uppercase text, never a shape.

# --- sizing by weight (verified v10.3.0, docs/layout-sizing-plan.md) -----
# POM's flexbox shares the height. Never add up pixel heights: the generator's
# arithmetic was the main source of half-empty and overflowing cards.
sizing: |
  - Header, source/caption line: NO h, NO grow (content height).
  - The band holding the slide's MAIN content takes grow from its height-weight:
    hero 3 | peer 2 | supporting 1 | minor none. Any component may be that band:
    a chart or diagram card, a KPI row, a callout / narrative panel, a bullet card.
    Tiles, cards and panels in a growing band stretch to equal heights. Inside a
    tall tile or card never centre a small block of text in empty space: put the
    content at the top and pin the closing item (a delta chip, a target, a source)
    to the bottom - justifyContent="spaceBetween" for label / value / delta, or a
    <VStack grow="1" /> spacer before the pinned item (2026-10-08, hand-qbr).
  - NO FILLER: no box that restates the headline, the subtitle or another
    component. Spare height goes to the main element, never to a new box.
  - A slide WITH a chart or diagram: that card grows; KPI rows and callouts beside
    it keep their content height.
  - EVERY slide has at least one growing band, unless its only content is a table.
  - In a side-by-side HStack the weight is the width share (% or grow); heights
    stretch to the tallest.
  - Content bands + minHs + gaps + 2*padding must fit 720 (past it, bands shrink
    and overlap silently). Too much: move items to a second row or column, never
    fonts below 14. Too little: let the main band grow - never add content the
    plan does not have.
  height-weight and visual-intent are NOT POM attributes - never put them in XML.
  TEXT: keep the plan's wording. A long point wraps to 2-3 lines; split long lists
  into two columns instead of cutting them. Never shrink the font below 14.

# --- one component kind (2026-11-19) ------------------------------------
# Rendered under THIS SLIDE as COMPONENT SIZING, only for the kinds on the slide: `code` when code draws the
# component (a ref tag), `hand` when the LLM draws it from POM nodes, `any` both. A kind in `diagrams` also gets
# the `diagram` lines, once per slide. Lines with numbers from capacity.yaml: capacity.kind_layout_rules.
diagram: >
  Diagram nodes are enlarged to fill after generation. A Flow or ProcessArrow
  is one line. Direction and box go together (the plan's layout_hint names both):
  horizontal = a full-width band of its own, other content above or below it;
  vertical = a column beside the other content, nodes / chevrons about the column's
  width. Never a horizontal diagram squeezed beside another card: POM shrinks it
  to fit, text and all.
diagrams: [flow, process_arrow, tree]
kinds:
  chart:
    any:
      - 'Chart: h="max" minH="180", no w; the card takes the weight''s grow. Never in a column narrower than ~45% of the slide: axis labels and legends collide.'
    hand:
      - "Chart text 16-18 (values and axis labels). chartColors uses $chart1.. tokens."
      - 'Focus colour, no legend box: the bar / series / slice the headline names = $accent, the rest $neutral; none named and periods = the LATEST period. One series = one colour for every bar. $chart1.. only for 2-3 equal series. showLegend="false": name 2-3 series in the chart title row (12 px square of the colour + name), put the key number in the title row or a caption.'
  table:
    any:
      - "Table: no h, no w (sizes to its rows); its card: no h, no grow. On a slide with a table no band grows: the table's rows and text are enlarged into the spare height after generation. Never in a column narrower than ~45% of the slide."
    hand:
      - 'Set defaultRowHeight = 16 + 24 x wrapped lines of the longest cell (40 / 64 / 88) and header <Tr height="40"> - POM never grows rows; short rows spill text.'
      - "Declare one <Col> per column. Omit width on MOST columns (they auto-fill the remaining space equally); set width only on a column whose content is noticeably wider or narrower than average. Widths must not exceed the table's container (account for ALL ancestor padding / gap)."
      - "Every <Td> sets backgroundColor + color. Cell text 20-22; header row 16 bold $textMuted."
  timeline:
    hand:
      - 'Timeline (horizontal): h="150", no w, no grow; max 8 items, 1-3 word labels - sentences collide. TimelineItem text sizes are fixed by POM.'
  kpi_row:
    code:
      - "A kpi_row with one value is a <KpiRow ref> too (code enlarges its number). Grow its band when it is the slide's main content; never build a tile by hand."
    hand:
      - 'A KPI tile: NO h on the row or the tile. In a growing row use justifyContent="spaceBetween" (label top, value, delta chip bottom); with a fixed h it clips the delta. Centred content in a tall tile leaves it empty. Labels 14-16, values 44-56 bold (72 for a lone value), the same size on every tile of the row.'
  bullet_list:
    hand:
      - "Bullet lists: <Ul> with <Li> children (POM's native list), never separate <Text> elements with bullet characters. Every point of the plan, fontSize 14-16; 6+ points split into two columns."
  matrix:
    any:
      - 'Matrix: h="max" minH="260", no w; the card takes the weight''s grow. Never in a column narrower than ~45% of the slide.'
      - "MatrixItem: the label is drawn ABOVE the dot on the CARD background, not on the dot. Do NOT set a white textColor on a light card - the label vanishes. Leave textColor unset (inherits itemLabelColor)."
  flow:
    any:
      - 'Flow: h="max" minH="200", no w; the card takes the weight''s grow. FlowNode text sizes are fixed by POM.'
  tree:
    any:
      - 'Tree: h="max" minH="200", no w; the card takes the weight''s grow.'
  process_arrow:
    any:
      - 'ProcessArrow: h="max" minH="90", no w; the card takes the weight''s grow. fontSize >= 14; step labels 1-2 short words at h<=70 (longer text clips).'
  pyramid:
    any:
      - "Pyramid: h = 52 x levels + 20, no w, no grow; fontSize 16 (3 levels), 15 (4), 14 (5+)."
  layer:
    any:
      - "Layer: pixel w and h."

# --- recipes (parameterised, not slides) ------------------------------
recipes:
  surface_card: >
    <VStack padding="24-32" gap="12-16" backgroundColor="$surfaceAlt"
      borderRadius="12" border.color="$border" border.width="1"> - flat: no
    shadow, no icon unless the plan asks for one, never a card inside a card.
    The default container for a chart, a stat cluster, a table. Add grow only
    per SIZING BY WEIGHT; w="max"/% only when its parent is an HStack.
  accent_card: >
    a card with ONE accent edge: borderTop.color="$accent" borderTop.width="4"
    (top stripe) or borderLeft.color="$accent" borderLeft.width="5" (list item).
    VERIFIED (render 2026-09-23): borderLeft + borderRadius is a clean straight
    bar with neutral rounded corners - fine on rounded cards. borderTop +
    borderRadius paints both upper corners and looks like a bracket - use
    borderTop only on a SQUARE card.
  hero_panel: >
    <VStack padding="18-24" gap="10-16" borderRadius="14-18"
      justifyContent="center"> (+ w="NN%" when it sits in an HStack)
    A high-contrast panel for THE message / key choice. On a LIGHT theme:
    backgroundColor="$textMain" with heading color="$surfaceAlt". On a DARK
    theme $textMain is the light ink - use backgroundColor="$surfaceAlt" with a
    borderLeft.color="$accent" borderLeft.width="5" and normal $textMain text
    instead. Heading is short (long headings wrap to 3 lines and overrun the
    panel); body the plan's sentence(s); optional a 2-3 row stat list. A panel
    with heading + body + stats needs the height - give it grow. One per slide.
  micro_pair: >
    a label-over-value stat with no card: <VStack gap="4"><Text 16
    "$textMuted">Label</Text><Text 32-48 bold "$textMain">Value</Text></VStack>.
    2-3 side by side in an HStack; justifyContent="spaceBetween" spreads them
    across the row. spaceBetween is for that horizontal row ONLY - never as the
    justifyContent of a vertical card.
  accent_bar: '<Shape shapeType="rect" w="120" h="6" backgroundColor="$accent" /> under a title.'
  badge: >
    <Shape shapeType="roundRect" w="100-160" h="26-30" fill.color="a pale tint"
    color="$textMain" fontSize="14" bold="true" borderRadius="999">SHORT LABEL</Shape>

# --- type ramp (fontSize) --------------------------------------------
# 2026-10-08: raised to the hand-written QBR deck (docs/eval/hand-qbr): the old ramp
# (title 27-32, body 14-16, stats 26-36) read as small on a projected slide.
type_ramp:
  eyebrow: "14 bold, letterSpacing 2, $accentText, uppercase plain text."
  slide_title: "36 bold, $textMain, lineHeight 1.15 (32 when it runs to two lines)"
  subtitle: "18 $textMuted"
  card_title: "22-26 bold, $textMain"
  label: "16-20 bold $textMuted (tile label, column header 16)"
  body: "18, $textMain or $textMuted, lineHeight 1.4. 16 only on a dense slide. NEVER below 14."
  stat_value: "44-56 bold for a number outside a KPI row, sized so it fits on ONE line (about 0.6 x fontSize per character)"
  caption: "14-16 $textMuted. NEVER below 14."

font_floor: >
  ABSOLUTE RULE: no fontSize on ANY element may be below 14. This applies to
  Text, Ul, Li, Span, Shape labels, ProcessArrowStep, TimelineItem, PyramidLevel,
  FlowNode, TreeItem, MatrixItem, and every other node that renders text. If the
  content does not fit at fontSize 14, RE-LAY IT OUT (a second row or column, a
  wider card, fewer decorations) and trim filler words - never shrink the font,
  never drop an item, a figure or a line of the plan.
  The layout_audit flags FONT_TOO_SMALL as a hard failure, not a suggestion.

spacing_scale: "use 2, 4, 6, 8, 10, 12, 14, 16, 18, 22 - nothing in between."

color_discipline: >
  Every color is a $token. Body text $textMain / $textMuted only. $accentText
  for the eyebrow / kicker, $accent for one large figure or one edge - not
  whole blocks. Pale fills are $accentSoft / $positiveSoft / $negativeSoft /
  $warningSoft, never a typed hex. Card bg is $surfaceAlt;
  slide bg $surface; inverted panel $textMain.
  Do NOT emit a <Theme> - the pipeline injects exactly one.
  COVER/HERO slides follow the SAME token rules — never hardcode raw hex
  for large backgrounds (use $surface, $surfaceAlt, $textMain, $accent).
  Raw hex is acceptable ONLY in a shadow colour (000).

color_roles: >
  Colour carries meaning, the SAME on every slide of the deck, so the reader
  learns it once (2026-10-07, from the palette's own tokens - never a hex):
  GOOD (wins, fixes, recommended actions, what to protect or scale) = $positiveText
  as text, $positiveSoft as a chip / row fill, $positive as a dot or bar;
  BAD (losses, leaks, underperformers, risks) = $negativeText / $negativeSoft /
  $negative; WATCH (breakeven, at risk) = $warningText / $warningSoft / $warning;
  the ONE highlighted item (the one the headline names) = $accentSoft fill with
  its key figure in $accentText bold; EVERYTHING ELSE = $surfaceAlt cards,
  $textMain values, $textMuted labels, $neutral marks (dots, bars, other chart
  series), so the one item stands out. Text on an $accent fill is $onAccent.
  Apply a role to a figure, a phrase, a row, a chip, a card's fill or edge -
  never to a whole slide. Every good / bad mark also carries a sign or arrow.
  Never use a role for decoration, never give one meaning two colours, never
  more than one item in focus per component.

# --- render gotchas (verified v10.3.0 + LibreOffice) -----------------
render_gotchas:
  - "FONT SHRINK (the #1 quality killer): the generator tends to shrink fonts
     to fit more content. This produces 8-12pt text that is illegible when
     projected. NEVER emit fontSize below 14 on any element. If content does
     not fit, re-lay it out (second row or column, wider card) and trim filler
     words - never drop an item, a figure or a line of the plan.
     All recipes now use 14pt minimum. Copy those sizes exactly."
  - "Text wrapping: POM measures text with its own font; the renderer may wrap
     one line more than POM expected, pushing siblings down. Keep headings on
     hero panels and cards SHORT and give panels/cards a little height slack.
     Never rely on a heading staying on N lines."
  - "roundRect <Shape> with text: keep the label short; it does not wrap
     gracefully inside the pill."
  - "justifyContent=\"spaceBetween\" with two wide <Text> children can trip a 1px
     NODE_OVERLAP warning where they meet - keep the value side short, or give
     the label grow=\"1\" and let the value size naturally."
  - "$textMain is the theme INK, light on DARK themes. A dark-filled panel uses
     $textMain bg on a LIGHT theme only; on a DARK theme use $surfaceAlt bg."

design_variety: >
  Lay out each slide for its own content; keep one type ramp, one card shape and
  one colour per meaning across the deck. Colour items by meaning (status, one
  focus, category or phase edges); never one fill on every item. At most one
  dark read-out panel per slide.

# --- pre-emit checklist ---------------------------------------------
checklist:
  - "FONT FLOOR: EVERY fontSize you write is >= 14 - scan every Text, Shape and node
     that takes a fontSize. If ANY is below 14, FIX IT before anything else. This is the #1 rule."
  - "Root VStack or HStack is w=1280 h=720 with padding 32-40, gap 14-22, alignItems=\"stretch\"."
  - "2-4 top-level bands, none with w=\"max\" (width stretches); nesting within bands matches content grouping."
  - "No pixel h on a band or card; grow by weight on the band that holds the slide's
     main content (at least one, unless the only content is a table). Each component
     sized per COMPONENT SIZING."
  - "Side-by-side cards share a band with alignItems=\"stretch\"."
  - "An HStack inside a VStack gets its width by stretch (no w); inside an HStack, w=\"max\" or %."
  - "No fixed-px width on a text or chart column."
  - "At most one hero_panel per slide. Accent as a highlight or an edge, never one fill on every item."
  - "If the slide looks half empty, give its main band grow - never add content the
     plan does not have, and don't stretch a table card."
