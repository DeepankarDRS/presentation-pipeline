# pom-knowledge/core/recipes.yaml
# Compiled copy-the-shape snippets for the components a generator gets wrong
# from prose (KPI tiles, number+unit, chart/table in a card). context_builder
# injects only the snippets whose component kind is on the slide. Every snippet
# compiles on POM v10.3.0 and is audit-clean (tests/unit/test_layout_sizing.py).
# Sizing grammar (house-style SIZING BY WEIGHT): no pixel heights on cards; a
# region root carries no w - its parent decides (w="max"/% in an HStack, grow
# per weight in a VStack). Copy the STRUCTURE and the SIZING; swap the content,
# the $token colours and the item count.
#
# ── GLOBAL RULE ──────────────────────────────────────────────────────────
# EVERY fontSize in EVERY recipe is >= 14. No exceptions. If content doesn't
# fit at 11pt, CUT the content (shorter words, fewer items) — NEVER shrink
# the font. This is the #1 quality rule. The generator MUST preserve these
# font sizes when adapting a recipe — copying the structure but lowering
# fonts defeats the purpose.

kpi_row: |
  # KPI row: NO h, NO grow on the band — auto-sizes to tile content. Tiles w="max"
  # (equal width shares). Inside each tile justifyContent="center" (NOT spaceBetween).
  # Unit in a <Span> inside the value <Text>.
  # EVERY font in the tile must be >= 14. Labels=14, values=28-34, deltas=14.
  # Max 3-4 tiles per row. More than 4? Use two rows, NOT smaller fonts.
  <HStack gap="14" alignItems="stretch">
    <VStack w="max" padding="16" gap="6" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="14" color="$textMuted">Annual recurring revenue</Text>
      <Text fontSize="30" bold="true" color="$textMain">$42.8<Span fontSize="16" color="$textMuted">M</Span></Text>
      <Text fontSize="14" bold="true" color="$positive">+18% QoQ</Text>
    </VStack>
    <VStack w="max" padding="16" gap="6" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="14" color="$textMuted">Net revenue retention</Text>
      <Text fontSize="30" bold="true" color="$textMain">114<Span fontSize="16" color="$textMuted">%</Span></Text>
      <Text fontSize="14" bold="true" color="$positive">+2 pts</Text>
    </VStack>
    <VStack w="max" padding="16" gap="6" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="14" color="$textMuted">Gross margin</Text>
      <Text fontSize="30" bold="true" color="$textMain">72.1<Span fontSize="16" color="$textMuted">%</Span></Text>
      <Text fontSize="14" bold="true" color="$negative">-1.4 pts</Text>
    </VStack>
  </HStack>

chart_card: |
  # Chart card: grow = the chart's weight (hero 3, peer 2, supporting 1); the Chart
  # fills what the title leaves: h="max" minH="180", no w, no pixel h.
  <VStack grow="2" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="14" bold="true" color="$textMain">Revenue by quarter ($M)</Text>
    <Chart h="max" minH="180" chartType="bar" showLegend="false" chartColors='["2563EB","0EA5E9","10B981","F59E0B"]'>
      <ChartSeries name="Revenue">
        <ChartDataPoint label="Q1" value="36.1" />
        <ChartDataPoint label="Q2" value="39.1" />
        <ChartDataPoint label="Q3" value="42.3" />
        <ChartDataPoint label="Q4" value="48.2" />
      </ChartSeries>
    </Chart>
  </VStack>

table_card: |
  # Table card: NO h, NO grow — the Table (no h/w) sizes to its rows. Row height =
  # 16 + 24 x lines of the longest cell (one line 40, two 64); header <Tr height="40">.
  # Every <Td> sets backgroundColor AND color. Set width only on columns needing
  # more room; omit for auto-fill.
  <VStack padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="14" bold="true" color="$textMain">ARR by segment</Text>
    <Table defaultRowHeight="40" cellBorder.color="$border" cellBorder.width="1">
      <Col width="240" /><Col /><Col />
      <Tr>
        <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain">Segment</Td>
        <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain" textAlign="right">ARR</Td>
        <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain" textAlign="right">QoQ</Td>
      </Tr>
      <Tr>
        <Td backgroundColor="$surface" color="$textMuted">Enterprise</Td>
        <Td backgroundColor="$surface" color="$textMain" textAlign="right">$28.1M</Td>
        <Td backgroundColor="$surface" color="$positive" textAlign="right">+22%</Td>
      </Tr>
      <Tr>
        <Td backgroundColor="$surface" color="$textMuted">Mid-Market</Td>
        <Td backgroundColor="$surface" color="$textMain" textAlign="right">$14.4M</Td>
        <Td backgroundColor="$surface" color="$positive" textAlign="right">+14%</Td>
      </Tr>
    </Table>
  </VStack>

bullet_list: |
  # Bullets: <Ul>/<Li>. NO h — auto-sizes. Each bullet = ONE line (~55 chars max).
  # Multi-line paragraphs overflow the slide and cause overlap.
  # fontSize 14-16, NEVER below 14. Max 3-4 bullets. If more, split across cards.
  # REWRITE long bullets shorter — never shrink the font to fit more text.
  <VStack padding="20" gap="10" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
    <Ul fontSize="14" color="$textMain" lineHeight="1.4">
      <Li>Close 3 enterprise logos worth $4M+ combined ARR</Li>
      <Li>Launch self-serve onboarding, cut CAC payback to 10 mo</Li>
      <Li>Ship analytics v2 dashboard before board meeting</Li>
    </Ul>
  </VStack>

icon_bullet_list: |
  # Icon + text rows: do NOT put <Icon> inside <Li> — it gets stripped.
  # Use a VStack of HStack rows instead.
  <VStack padding="20" gap="10" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
    <HStack gap="10" alignItems="center">
      <Icon name="zap" size="18" color="$accent" />
      <Text fontSize="14" color="$textMain">Instant delivery under 10 minutes</Text>
    </HStack>
    <HStack gap="10" alignItems="center">
      <Icon name="clock" size="18" color="$accent" />
      <Text fontSize="14" color="$textMain">24/7 availability across all zones</Text>
    </HStack>
    <HStack gap="10" alignItems="center">
      <Icon name="target" size="18" color="$accent" />
      <Text fontSize="14" color="$textMain">Targeted visibility during peak moments</Text>
    </HStack>
  </VStack>

badge: |
  # Badge: status pill / category tag. Inline accent, NOT a band.
  # Variants: success=pale green, warning=pale amber, danger=pale red,
  # info=pale blue, neutral=pale gray, accent=$accent tint.
  # fontSize 14 minimum. Keep label SHORT (1-2 words).
  <Shape shapeType="roundRect" w="120" h="28" fill.color="DCFCE7" color="15803D" fontSize="14" bold="true" borderRadius="999">ON TRACK</Shape>

callout: |
  # Callout / narrative strip: NO h — auto-sizes to text content.
  # STRICT: body text = 1 sentence, ≤ 80 chars. Longer text pushes total > 720.
  # ALL fonts >= 14. Header=14 bold, body=14-16.
  <VStack padding="16" gap="4" backgroundColor="EEF2FD" borderLeft.color="$accent" borderLeft.width="5" justifyContent="center">
    <Text fontSize="14" bold="true" color="$accent" letterSpacing="1">WHY IT MATTERS</Text>
    <Text fontSize="14" color="$textMain" lineHeight="1.45">A large, measurable problem that targeted enforcement could meaningfully reduce.</Text>
  </VStack>

timeline: |
  # Timeline in a card: NO h, NO grow on the card — size the box to the diagram.
  # Horizontal <Timeline h="150">, no w (it never scales up). Max 5 items.
  # STRICT: date = 1-2 words, title = 1-2 words ONLY.
  # Full sentences WILL collide — each column is only w/N px wide.
  <VStack padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="14" bold="true" color="$textMain">Rollout timeline</Text>
    <Timeline direction="horizontal" h="150" dateColor="$textMuted" titleColor="$textMain" connectorColor="$accent">
      <TimelineItem date="Q1 2026" title="Alpha" color="2563EB" />
      <TimelineItem date="Q2 2026" title="Beta" color="0EA5E9" />
      <TimelineItem date="Q3 2026" title="GA" color="15803D" />
      <TimelineItem date="Q4 2026" title="Enterprise" color="7C3AED" />
    </Timeline>
  </VStack>

matrix: |
  # Matrix in a card: put it in a column >= 50% of the slide; the card takes its
  # weight's grow, the Matrix fills it (h="max" minH="260"). 4 items max, ONE-word labels, spread the x/y (no two within
  # 0.18 on both axes). Never textColor="FFFFFF" on a light card.
  <VStack grow="2" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <HStack justifyContent="spaceBetween"><Text fontSize="14" bold="true" color="$textMain">Prioritisation</Text><Text fontSize="14" color="$textMuted">Impact x Effort</Text></HStack>
    <Matrix h="max" minH="260" axisLabelColor="$textMuted" quadrantLabelColor="$textMuted" itemLabelColor="$textMain">
      <MatrixAxes x="Effort" y="Impact" />
      <MatrixQuadrants topLeft="Plan" topRight="Do first" bottomLeft="Skip" bottomRight="Quick wins" />
      <MatrixItem label="Search" x="0.28" y="0.82" color="$accent" />
      <MatrixItem label="Billing" x="0.72" y="0.7" color="8B5CF6" />
      <MatrixItem label="Docs" x="0.34" y="0.36" color="0EA5E9" />
      <MatrixItem label="Mobile" x="0.8" y="0.24" color="9AA6B8" />
    </Matrix>
  </VStack>

process_arrow: |
  # ProcessArrow in a card: card grow per weight, ProcessArrow h="max" minH="90"
  # (steps are enlarged to fill the box after generation). It is ONE row: give it
  # full width. Step labels are 1-2 SHORT words only (longer text clips inside the
  # chevron). 3-5 steps. fontSize MUST be >= 14. NEVER go below 14.
  <VStack grow="1" padding="18" gap="10" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="14" bold="true" color="$textMain">Delivery process</Text>
    <ProcessArrow h="max" minH="90" direction="horizontal" fontSize="14" bold="true">
      <ProcessArrowStep label="Discover" color="BFD3F7" textColor="16202E" />
      <ProcessArrowStep label="Design" color="60A5FA" textColor="FFFFFF" />
      <ProcessArrowStep label="Build" color="2563EB" textColor="FFFFFF" />
      <ProcessArrowStep label="Ship" color="1E3A8A" textColor="FFFFFF" />
    </ProcessArrow>
  </VStack>

flow: |
  # Flow in a card: card grow per weight, Flow h="max" minH="200" (nodes are
  # enlarged to fill the box after generation). Keep to 4-5 nodes; short
  # node text (6+ overflows at default nodeWidth). Use ProcessArrow for a simple line.
  # FlowNode text MUST be >= 14pt. 1-2 word labels only.
  <VStack grow="2" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="14" bold="true" color="$textMain">Approval flow</Text>
    <Flow direction="horizontal" h="max" minH="200" nodeWidth="150" nodeHeight="56" nodeGap="64">
      <FlowNode id="a" shape="flowChartTerminator" text="Request" color="2563EB" textColor="FFFFFF" />
      <FlowNode id="b" shape="flowChartProcess" text="Review" color="0EA5E9" textColor="FFFFFF" />
      <FlowNode id="c" shape="flowChartDecision" text="Approved?" color="F59E0B" textColor="FFFFFF" />
      <FlowNode id="d" shape="flowChartTerminator" text="Done" color="15803D" textColor="FFFFFF" />
      <FlowConnection from="a" to="b" />
      <FlowConnection from="b" to="c" />
      <FlowConnection from="c" to="d" label="Yes" />
      <FlowConnection from="c" to="b" label="No" color="DC2626" />
    </Flow>
  </VStack>

pyramid: |
  # Pyramid in a card: NO h, NO grow on the card; Pyramid h = 52 x levels + 20, no w
  # (it never scales up). Scale fontSize with level count.
  # textColor MUST contrast with each level's fill — dark fills get FFFFFF, light fills get 1E293B.
  # fontSize: 16 (3 levels), 15 (4), 14 (5+). NEVER below 14.
  <VStack padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="14" bold="true" color="$textMain">Operating model</Text>
    <Pyramid direction="up" h="228" fontSize="14" bold="true">
      <PyramidLevel label="Strategy" color="1E3A8A" textColor="FFFFFF" />
      <PyramidLevel label="Capabilities" color="2563EB" textColor="FFFFFF" />
      <PyramidLevel label="Operations" color="3B82F6" textColor="FFFFFF" />
      <PyramidLevel label="Foundation" color="1D4ED8" textColor="FFFFFF" />
    </Pyramid>
  </VStack>

pyramid_with_annotations: |
  # 5+ level pyramid with side annotations. Two-column: pyramid left, descriptions right.
  # Use when each level needs an explanation beyond the label.
  # Pyramid gets 55% width, annotations get 45%. fontSize="14" for 5 levels.
  # Level colors use medium-to-dark hues so text stays legible on both light and dark themes.
  # Each annotation card has a borderLeft matching its pyramid level color.
  <HStack gap="24" alignItems="center">
    <Pyramid direction="up" w="55%" h="280" fontSize="14" bold="true">
      <PyramidLevel label="Vision &amp; Strategy" color="BE185D" textColor="FFFFFF" />
      <PyramidLevel label="Business Goals" color="C2410C" textColor="FFFFFF" />
      <PyramidLevel label="Tactical Initiatives" color="A16207" textColor="FFFFFF" />
      <PyramidLevel label="Operational Workflows" color="15803D" textColor="FFFFFF" />
      <PyramidLevel label="Infrastructure &amp; Tech" color="0E7490" textColor="FFFFFF" />
    </Pyramid>
    <VStack w="45%" gap="8">
      <VStack padding="10" backgroundColor="$surfaceAlt" borderRadius="8" borderLeft.color="BE185D" borderLeft.width="4">
        <Text fontSize="14" bold="true" color="$textMain">Vision &amp; Strategy</Text>
        <Text fontSize="14" color="$textMuted">Long-term mission and market positioning.</Text>
      </VStack>
      <VStack padding="10" backgroundColor="$surfaceAlt" borderRadius="8" borderLeft.color="C2410C" borderLeft.width="4">
        <Text fontSize="14" bold="true" color="$textMain">Business Goals</Text>
        <Text fontSize="14" color="$textMuted">Annual OKRs, financial targets, growth roadmaps.</Text>
      </VStack>
      <VStack padding="10" backgroundColor="$surfaceAlt" borderRadius="8" borderLeft.color="A16207" borderLeft.width="4">
        <Text fontSize="14" bold="true" color="$textMain">Tactical Initiatives</Text>
        <Text fontSize="14" color="$textMuted">Cross-functional programs and milestone tracking.</Text>
      </VStack>
      <VStack padding="10" backgroundColor="$surfaceAlt" borderRadius="8" borderLeft.color="15803D" borderLeft.width="4">
        <Text fontSize="14" bold="true" color="$textMain">Operational Workflows</Text>
        <Text fontSize="14" color="$textMuted">Sprint deliverables and process management.</Text>
      </VStack>
      <VStack padding="10" backgroundColor="$surfaceAlt" borderRadius="8" borderLeft.color="0E7490" borderLeft.width="4">
        <Text fontSize="14" bold="true" color="$textMain">Infrastructure &amp; Tech</Text>
        <Text fontSize="14" color="$textMuted">Data architecture, security, platform tooling.</Text>
      </VStack>
    </VStack>
  </HStack>

layer_diagram: |
  # Layer diagram: NOT a flex container — children use x/y absolute coords
  # (relative to Layer top-left). NEVER use margin for positioning inside Layer.
  # Layer MUST have explicit pixel w and h. All children x/y must be >= 0 and
  # x+child_w <= Layer_w, y+child_h <= Layer_h (stay inside bounds).
  # Arrow connects shapes by id; targets must be Shape(rect/roundRect/ellipse) or Text.
  <Layer w="560" h="296" backgroundColor="$surfaceAlt" borderRadius="14">
    <Shape id="hub" shapeType="ellipse" x="206" y="74" w="148" h="148" backgroundColor="$accent" color="$surfaceAlt" fontSize="14" bold="true" textAlign="center" text="Core Platform" />
    <Shape id="svc-a" shapeType="roundRect" x="0" y="0" w="120" h="52" fill.color="$surfaceAlt" color="$textMain" fontSize="14" bold="true" textAlign="center" text="Service A" border.color="$border" border.width="1" borderRadius="10" />
    <Shape id="svc-b" shapeType="roundRect" x="440" y="0" w="120" h="52" fill.color="$surfaceAlt" color="$textMain" fontSize="14" bold="true" textAlign="center" text="Service B" border.color="$border" border.width="1" borderRadius="10" />
    <Shape id="svc-c" shapeType="roundRect" x="220" y="244" w="120" h="52" fill.color="$surfaceAlt" color="$textMain" fontSize="14" bold="true" textAlign="center" text="Service C" border.color="$border" border.width="1" borderRadius="10" />
    <Arrow from="hub" to="svc-a" color="$accent" lineWidth="2" endArrow="true" />
    <Arrow from="hub" to="svc-b" color="$accent" lineWidth="2" endArrow="true" />
    <Arrow from="hub" to="svc-c" color="$accent" lineWidth="2" endArrow="true" />
  </Layer>

tree: |
  # Tree in a card: card grow per weight, Tree h="max" minH="200" (nodes are
  # enlarged to fill the box after generation). One root. Keep depth <= 3 and total nodes
  # <= ~10; short labels.
  <VStack grow="2" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="14" bold="true" color="$textMain">Org structure</Text>
    <Tree layout="vertical" h="max" minH="200" nodeShape="roundRect" textColor="FFFFFF" nodeWidth="130" nodeHeight="46" levelGap="52" siblingGap="22" connectorStyle.color="94A3B8" connectorStyle.width="2">
      <TreeItem label="CEO" color="1E3A8A">
        <TreeItem label="CTO" color="2563EB">
          <TreeItem label="Eng" color="60A5FA" />
          <TreeItem label="Product" color="60A5FA" />
        </TreeItem>
        <TreeItem label="CFO" color="2563EB">
          <TreeItem label="Finance" color="60A5FA" />
        </TreeItem>
      </TreeItem>
    </Tree>
  </VStack>

compact_kpi_strip: |
  # Compact KPI strip for dense data slides: 3-4 tiles above a content area.
  # ALL fonts >= 14. Labels=14, values=24-28, deltas=14. No fixed h — auto-sizes.
  # Max 4 tiles. If 5+ metrics, use TWO rows — never shrink fonts below 14.
  <HStack gap="10" alignItems="stretch">
    <VStack w="max" padding="12" gap="4" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="14" color="$textMuted" bold="true" letterSpacing="1">METRIC A</Text>
      <Text fontSize="24" color="$textMain" bold="true">₹X.XX<Span fontSize="14" color="$textMuted"> Cr</Span></Text>
      <Text fontSize="14" color="$negative" bold="true">▼ X.X% vs prior</Text>
    </VStack>
    <VStack w="max" padding="12" gap="4" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="14" color="$textMuted" bold="true" letterSpacing="1">METRIC B</Text>
      <Text fontSize="24" color="$textMain" bold="true">₹X.XX<Span fontSize="14" color="$textMuted"> L</Span></Text>
      <Text fontSize="14" color="$textMuted">Sub-note X.Xx</Text>
    </VStack>
    <VStack w="max" padding="12" gap="4" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="14" color="$textMuted" bold="true" letterSpacing="1">KEY RATIO</Text>
      <Text fontSize="24" color="$positive" bold="true">X.Xxx</Text>
      <Text fontSize="14" color="$positive">Best of cohort</Text>
    </VStack>
  </HStack>

dark_callout_panel: |
  # Dark callout panel: inverted card for analyst read-outs or key takeaways.
  # backgroundColor="$textMain", header in $accentAlt (letterSpacing="1"),
  # list items in a light muted color (D0DDD8 on dark backgrounds).
  # Use at bottom-right of a 2-col layout or as a full-width closing band.
  # ALL fonts >= 14. Max 3-4 bullet items, each ≤ 50 chars.
  <VStack padding="14" gap="6" backgroundColor="$textMain" borderRadius="12">
    <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="1">KEY READ-OUTS</Text>
    <Ul fontSize="14" color="D0DDD8" lineHeight="1.45">
      <Li>Insight 1 — lead with the number, name the mechanism</Li>
      <Li>Insight 2 — contrast two segments with specific delta</Li>
      <Li>Insight 3 — flag the outlier or risk with the metric</Li>
      <Li>Insight 4 — one actionable recommendation</Li>
    </Ul>
  </VStack>

platform_header: |
  # Platform/section header band: kicker + title + subtitle left, badge right.
  # Badge is a pill Shape (borderRadius="999") — NOT a Text node on its own.
  # letterSpacing="2" on the kicker is the detail that makes it look professional.
  <HStack justifyContent="spaceBetween" alignItems="start">
    <VStack gap="4">
      <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">SECTION LABEL · NN</Text>
      <Text fontSize="26" color="$textMain" bold="true">Headline — one clause naming the tension</Text>
      <Text fontSize="14" color="$textMuted">[Period] · [Subject] — [scope]</Text>
    </VStack>
    <Shape shapeType="roundRect" w="90" h="26" fill.color="$surfaceAlt" color="$accent" fontSize="14" bold="true" borderRadius="999">ENTITY</Shape>
  </HStack>
