# pom-knowledge/core/recipes.yaml
# Compiled copy-the-shape snippets for the components a generator gets wrong
# from prose (KPI tiles, number+unit, chart/table in a card). context_builder
# injects only the snippets whose component kind is on the slide. Every snippet
# compiles on POM v10.3.0 and fits inside a multi-component slide - note the
# modest band heights. Copy the STRUCTURE and the SIZING; swap the content,
# the $token colours and the item count.

kpi_row: |
  # KPI row: band h=110-150. Inside each tile justifyContent="center" (NOT
  # spaceBetween). Unit in a <Span> inside the value <Text>.
  <HStack w="max" h="120" gap="14" alignItems="stretch">
    <VStack w="max" padding="16" gap="6" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="11" color="$textMuted">Annual recurring revenue</Text>
      <Text fontSize="30" bold="true" color="$textMain">$42.8<Span fontSize="16" color="$textMuted">M</Span></Text>
      <Text fontSize="11" bold="true" color="$positive">+18% QoQ</Text>
    </VStack>
    <VStack w="max" padding="16" gap="6" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="11" color="$textMuted">Net revenue retention</Text>
      <Text fontSize="30" bold="true" color="$textMain">114<Span fontSize="16" color="$textMuted">%</Span></Text>
      <Text fontSize="11" bold="true" color="$positive">+2 pts</Text>
    </VStack>
    <VStack w="max" padding="16" gap="6" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
      <Text fontSize="11" color="$textMuted">Gross margin</Text>
      <Text fontSize="30" bold="true" color="$textMain">72.1<Span fontSize="16" color="$textMuted">%</Span></Text>
      <Text fontSize="11" bold="true" color="$negative">-1.4 pts</Text>
    </VStack>
  </HStack>

chart_card: |
  # Chart card: band h 260-360. Chart is w="max" + an EXPLICIT h = band h minus
  # 2*padding minus the ~28 title. Never omit chart h.
  <VStack w="max" h="300" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="13" bold="true" color="$textMain">Revenue by quarter ($M)</Text>
    <Chart w="max" h="236" chartType="bar" showLegend="false" chartColors='["2563EB","0EA5E9","10B981","F59E0B"]'>
      <ChartSeries name="Revenue">
        <ChartDataPoint label="Q1" value="36.1" />
        <ChartDataPoint label="Q2" value="39.1" />
        <ChartDataPoint label="Q3" value="42.3" />
        <ChartDataPoint label="Q4" value="48.2" />
      </ChartSeries>
    </Chart>
  </VStack>

table_card: |
  # Table card: band h 240-360. Every <Td> sets backgroundColor AND color.
  # <Col width> per column, summing to roughly the card inner width.
  <VStack w="max" h="280" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="13" bold="true" color="$textMain">ARR by segment</Text>
    <Table defaultRowHeight="44" cellBorder.color="$border" cellBorder.width="1">
      <Col width="240" /><Col width="150" /><Col width="150" />
      <Tr>
        <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain">Segment</Td>
        <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain" textAlign="right">ARR</Td>
        <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain" textAlign="right">QoQ</Td>
      </Tr>
      <Tr>
        <Td backgroundColor="$surface" color="$textMuted">Enterprise</Td>
        <Td backgroundColor="$surface" color="$textMain" textAlign="right">$28.1M</Td>
        <Td backgroundColor="$surface" color="$positive" textAlign="right">+22%</Td>
      </Tr>
      <Tr>
        <Td backgroundColor="$surface" color="$textMuted">Mid-Market</Td>
        <Td backgroundColor="$surface" color="$textMain" textAlign="right">$14.4M</Td>
        <Td backgroundColor="$surface" color="$positive" textAlign="right">+14%</Td>
      </Tr>
    </Table>
  </VStack>

bullet_list: |
  # Bullets: use <Ul>/<Li> -- POM's native list nodes. Band h ~ 40 per item
  # + padding. Never use separate <Text> elements with manual dashes.
  <VStack w="max" h="200" padding="20" gap="10" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" justifyContent="center">
    <Ul fontSize="13" color="$textMain" lineHeight="1.4">
      <Li>Close 3 enterprise logos worth $4M+ combined ARR</Li>
      <Li>Launch self-serve onboarding to cut CAC payback to 10 months</Li>
      <Li>Ship the analytics v2 dashboard before the board meeting</Li>
    </Ul>
  </VStack>

callout: |
  # Callout / narrative strip: band h 80-120.
  <VStack w="max" h="96" padding="16" gap="4" backgroundColor="EEF2FD" borderLeft.color="$accent" borderLeft.width="5" justifyContent="center">
    <Text fontSize="10" bold="true" color="$accent" letterSpacing="1">WHY IT MATTERS</Text>
    <Text fontSize="13" color="$textMain" lineHeight="1.45">A large, measurable problem that targeted enforcement could meaningfully reduce.</Text>
  </VStack>

timeline: |
  # Timeline in a card: band h 200-300. Node w="max", explicit h. Keep to 3-5
  # items; short title + short description.
  <VStack w="max" h="240" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="13" bold="true" color="$textMain">Rollout timeline</Text>
    <Timeline direction="horizontal" w="max" h="180" dateColor="$textMuted" titleColor="$textMain" descriptionColor="$textMuted" connectorColor="$accent">
      <TimelineItem date="Q1 2026" title="Alpha" description="Internal beta" color="2563EB" />
      <TimelineItem date="Q2 2026" title="Public beta" description="Early adopters" color="0EA5E9" />
      <TimelineItem date="Q3 2026" title="GA" description="Full launch" color="15803D" />
      <TimelineItem date="Q4 2026" title="Enterprise" description="SSO, SLA, audit" color="7C3AED" />
    </Timeline>
  </VStack>

matrix: |
  # Matrix in a card: put it in a column >= 50% of the slide, band h 260-340,
  # node h >= 200. 4 items max, ONE-word labels, spread the x/y (no two within
  # 0.18 on both axes). Never textColor="FFFFFF" on a light card.
  <VStack w="max" h="320" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <HStack justifyContent="spaceBetween"><Text fontSize="13" bold="true" color="$textMain">Prioritisation</Text><Text fontSize="10" color="$textMuted">Impact x Effort</Text></HStack>
    <Matrix w="max" h="252" axisLabelColor="$textMuted" quadrantLabelColor="$textMuted" itemLabelColor="$textMain">
      <MatrixAxes x="Effort" y="Impact" />
      <MatrixQuadrants topLeft="Plan" topRight="Do first" bottomLeft="Skip" bottomRight="Quick wins" />
      <MatrixItem label="Search" x="0.28" y="0.82" color="$accent" />
      <MatrixItem label="Billing" x="0.72" y="0.7" color="8B5CF6" />
      <MatrixItem label="Docs" x="0.34" y="0.36" color="0EA5E9" />
      <MatrixItem label="Mobile" x="0.8" y="0.24" color="9AA6B8" />
    </Matrix>
  </VStack>

process_arrow: |
  # ProcessArrow in a card: band h 130-180, node h 66-90. Step labels are
  # 1-2 SHORT words only (longer text clips inside the chevron). 3-5 steps.
  <VStack w="max" h="150" padding="18" gap="10" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="13" bold="true" color="$textMain">Delivery process</Text>
    <ProcessArrow w="max" h="72" direction="horizontal" fontSize="12" bold="true">
      <ProcessArrowStep label="Discover" color="BFD3F7" textColor="16202E" />
      <ProcessArrowStep label="Design" color="60A5FA" textColor="FFFFFF" />
      <ProcessArrowStep label="Build" color="2563EB" textColor="FFFFFF" />
      <ProcessArrowStep label="Ship" color="1E3A8A" textColor="FFFFFF" />
    </ProcessArrow>
  </VStack>

flow: |
  # Flow in a card: band h 260-380, node h to fit. Keep it to 4-6 nodes; short
  # node text. Use Flow for branching; use ProcessArrow for a simple line.
  <VStack w="max" h="320" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="13" bold="true" color="$textMain">Approval flow</Text>
    <Flow direction="horizontal" w="max" h="260" nodeWidth="150" nodeHeight="56" nodeGap="64">
      <FlowNode id="a" shape="flowChartTerminator" text="Request" color="2563EB" textColor="FFFFFF" />
      <FlowNode id="b" shape="flowChartProcess" text="Review" color="0EA5E9" textColor="FFFFFF" />
      <FlowNode id="c" shape="flowChartDecision" text="Approved?" color="F59E0B" textColor="FFFFFF" />
      <FlowNode id="d" shape="flowChartTerminator" text="Done" color="15803D" textColor="FFFFFF" />
      <FlowConnection from="a" to="b" />
      <FlowConnection from="b" to="c" />
      <FlowConnection from="c" to="d" label="Yes" />
      <FlowConnection from="c" to="b" label="No" color="DC2626" />
    </Flow>
  </VStack>

pyramid: |
  # Pyramid in a card: band h 240-340, node h to fit. 3-5 levels, short labels.
  <VStack w="max" h="300" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="13" bold="true" color="$textMain">Operating model</Text>
    <Pyramid direction="up" w="max" h="240" fontSize="13" bold="true">
      <PyramidLevel label="Strategy" color="1E3A8A" textColor="FFFFFF" />
      <PyramidLevel label="Capabilities" color="2563EB" textColor="FFFFFF" />
      <PyramidLevel label="Operations" color="60A5FA" textColor="FFFFFF" />
      <PyramidLevel label="Foundation" color="BFD3F7" textColor="16202E" />
    </Pyramid>
  </VStack>

tree: |
  # Tree in a card: band h 260-380. One root. Keep depth <= 3 and total nodes
  # <= ~10; short labels.
  <VStack w="max" h="320" padding="18" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
    <Text fontSize="13" bold="true" color="$textMain">Org structure</Text>
    <Tree layout="vertical" w="max" h="260" nodeShape="roundRect" textColor="FFFFFF" nodeWidth="130" nodeHeight="46" levelGap="52" siblingGap="22" connectorStyle.color="94A3B8" connectorStyle.width="2">
      <TreeItem label="CEO" color="1E3A8A">
        <TreeItem label="CTO" color="2563EB">
          <TreeItem label="Eng" color="60A5FA" />
          <TreeItem label="Product" color="60A5FA" />
        </TreeItem>
        <TreeItem label="CFO" color="2563EB">
          <TreeItem label="Finance" color="60A5FA" />
        </TreeItem>
      </TreeItem>
    </Tree>
  </VStack>
