# pom-knowledge/core/design-language.yaml
# Visual design patterns for production-grade presentation output.
# Loaded by context_builder and injected into the generator system prompt.
# Ranges here align with house-style.yaml (the runtime authority).

visual_hierarchy:
  title: "fontSize 27-32, bold, color=$textMain"
  subtitle: "fontSize 14-16, color=$textMuted"
  body: "fontSize 14-16, color=$textMain, lineHeight 1.4-1.55"
  label: "fontSize 14, color=$textMuted"
  caption: "fontSize 14, italic, color=$textMuted"
  kpi_value: "fontSize 24-34, bold, color=$textMain"
  kpi_unit: "Span fontSize 14-18 inside the value Text"
  delta_up: "fontSize 13-16, color=$positive"
  delta_down: "fontSize 13-16, color=$negative"

card_recipe:
  description: "Cards are the building block for KPI tiles, info boxes, and feature callouts."
  rounded_card: |
    <VStack padding="14-22" gap="6-14"
      backgroundColor="$surfaceAlt" borderRadius="12-16"
      border.width="1" border.color="$border">
  accent_stripe_card: |
    <VStack padding="14-22" gap="6-14"
      backgroundColor="$surfaceAlt"
      border.width="1" border.color="$border"
      borderTop.width="4" borderTop.color="$accent">
  rules:
    - Always use backgroundColor="$surfaceAlt" (never leave it transparent)
    - "border.color=\"$border\" — a SUBTLE gray hairline, NEVER the accent color"
    - "Rounded card (borderRadius 12-16): use ONLY the border.color hairline. Do NOT add a borderTop/borderLeft accent stripe on a rounded card — the stripe wraps the corner and looks broken. Put the accent in the value text or a small Shape bar."
    - "Accent-stripe card (borderTop.color=\"$accent\" borderTop.width=\"4\"): SQUARE only, no borderRadius."
    - Equal-width sibling cards in an HStack each get w="max"

accent_elements:
  accent_bar: '<Shape shapeType="rect" w="120" h="6" fill.color="$accent" />'
  status_dot: '<Shape shapeType="ellipse" w="12" h="12" fill.color="$positive" />'
  divider: '<Shape shapeType="rect" w="max" h="1" backgroundColor="$border" />'
  rules:
    - Place an accent bar below the title to separate header from body
    - Use status dots in KPI tiles next to labels (green=$positive, red=$negative, grey=$textMuted)
    - Shape is a LEAF node — never nest children inside it

spacing:
  root_padding: "32-40"
  section_gap: "14-22"
  component_gap: "8-12"
  card_padding: "14-22"
  card_internal_gap: "6-14"

color_usage:
  - "$surface — slide background (root VStack backgroundColor)"
  - "$surfaceAlt — card/tile/plate backgrounds"
  - "$accent — primary visual anchors: accent bars, card top-borders, links, first chart color"
  - "$accentAlt — secondary accent: second chart series, sparklines"
  - "$textMain — headings, bold values, primary text"
  - "$textMuted — labels, captions, secondary text"
  - "$positive — good deltas, up arrows, success indicators"
  - "$negative — bad deltas, down arrows, error indicators"
  - "$warning — caution figures, attention items"
  - "$border — hairline borders, table cellBorder.color, card outlines"

table_styling:
  - "EVERY <Td> needs explicit backgroundColor AND color — unstyled cells fall back to PowerPoint's ugly default white banding"
  - "Header row: backgroundColor=$surfaceAlt color=$textMain bold=true"
  - "Body rows: backgroundColor=$surface, labels in color=$textMuted, values in color=$textMain"
  - "Use cellBorder.color=$border cellBorder.width=1 on the Table element"
  - "Right-align numeric columns with textAlign=right"
  - "Declare one <Col> per column. Omit width on most columns (they auto-fill remaining space equally). Set width only on columns that need more or less room than average. Specified widths must not exceed the table's container width."

bullet_list_styling:
  - "Use <Ul> with <Li> children for bullet lists -- POM's native list nodes"
  - "Never use separate <Text> elements with manual dash/bullet prefixes"
  - "Wrap the <Ul> in a card VStack with explicit h and padding"

chart_sizing:
  - "Chart is w=\"max\" inside its column/card; set an explicit pixel h (never omit h)"
  - "h = the band height minus the card padding and any card title (~28)"

content_invention:
  - "When no data is supplied, invent realistic, specific figures — never use 'XX%' or 'TBD'"
  - "KPI values: use real-looking numbers with units ($42.8M, 114%, 3.2x)"
  - "Charts: at least 4-6 data points with realistic progression"
  - "Tables: 3-5 rows with named entities (not Row 1, Row 2)"
  - "Bullet points: 4-6 concise takeaways, each one sentence"
  - "Deltas: show direction (+18% QoQ, -2.3 pts) with appropriate $positive/$negative color"

design_principles:
  - "Use $surfaceAlt cards to group related content — never float raw text on the background"
  - "One idea per slide — if content overflows, CUT content rather than shrink fonts below 14"
  - "Card borders: border.color=$border (subtle gray), borderTop.color=$accent (bold stripe). Never accent the full border."

additional_styling:
  lineHeight: "default 1.3; use 1.4-1.55 for body text readability"
  shadow: "shadow.blur, shadow.offset, shadow.color, shadow.opacity — for elevated cards"
  gradients: "backgroundGradient (containers), textGradient (Text) — native PPTX gradient fills"
  text_effects: "glow.size/color/opacity, outline.size/color — for titles over images"
  opacity: "0-1 background transparency on any node"
  fontFamily: "default Noto Sans JP; override per-node (must be installed on viewer's system)"
