# pom-knowledge/core/golden-examples.yaml
# Curated full-slide golden examples injected into the generator prompt as
# few-shot references. Each example is a complete, compile-verified, audit-clean
# slide that shows what "polished" looks like — not just a grammar rule.
#
# Selection: one per visual archetype (data, narrative, cover/closing).
# context_builder picks the best match for the current slide_type.

data: |
  <!-- DATA SLIDE: platform performance deep-dive — 3-band structure:
       (1) header with kicker + title + platform badge,
       (2) KPI strip (5 tiles, card-styled with border/radius),
       (3) two-column content area: left = breakdown table + split table,
           right = top-SKU bar chart + dark callout anchor panel.
       Study the font-size hierarchy, tile card styling, and dark panel pattern.
       All content is placeholder — copy the STRUCTURE, not the data. -->
  <Slide><VStack w="1280" h="720" padding="36" gap="12" backgroundColor="$surface">
    <HStack justifyContent="spaceBetween" alignItems="start">
      <VStack gap="4">
        <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">PLATFORM DEEP-DIVE · 01</Text>
        <Text fontSize="26" color="$textMain" bold="true">Headline insight — one clause that names the tension</Text>
        <Text fontSize="14" color="$textMuted">[Period] · [Category group] — [campaign type]</Text>
      </VStack>
      <Shape shapeType="roundRect" w="90" h="26" fill.color="$surfaceAlt" color="$accent" fontSize="14" bold="true" borderRadius="999">PLATFORM A</Shape>
    </HStack>
    <HStack gap="10" alignItems="stretch">
      <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
        <Text fontSize="14" color="$textMuted">METRIC LABEL A</Text>
        <Text fontSize="20" color="$textMain" bold="true">₹X.XX Cr</Text>
        <Text fontSize="14" color="$negative">▼ X.X% vs prior</Text>
      </VStack>
      <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
        <Text fontSize="14" color="$textMuted">METRIC LABEL B</Text>
        <Text fontSize="20" color="$textMain" bold="true">₹X.XX L</Text>
        <Text fontSize="14" color="$textMuted">Sub-metric X.Xx</Text>
      </VStack>
      <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
        <Text fontSize="14" color="$textMuted">KEY RATIO</Text>
        <Text fontSize="20" color="$positive" bold="true">X.Xxx</Text>
        <Text fontSize="14" color="$positive">Best of cohort</Text>
      </VStack>
      <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
        <Text fontSize="14" color="$textMuted">EFFICIENCY METRIC</Text>
        <Text fontSize="20" color="$textMain" bold="true">XX.X%</Text>
        <Text fontSize="14" color="$positive">Healthy vs benchmark</Text>
      </VStack>
      <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
        <Text fontSize="14" color="$textMuted">VOLUME METRIC</Text>
        <Text fontSize="20" color="$textMain" bold="true">XX,XXX</Text>
        <Text fontSize="14" color="$textMuted">Context note (XX.X%)</Text>
      </VStack>
    </HStack>
    <HStack grow="1" gap="12" alignItems="stretch">
      <VStack w="50%" gap="10">
        <VStack padding="14" gap="6" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1">
          <Text fontSize="14" color="$textMain" bold="true">Breakdown table — [dimension] × [metrics]</Text>
          <Table defaultRowHeight="32" cellBorder.color="$border" cellBorder.width="1">
            <Col width="110" /><Col /><Col /><Col /><Col />
            <Tr>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14">DIMENSION</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">METRIC 1</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">METRIC 2</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">RATIO</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">EFFICIENCY</Td>
            </Tr>
            <Tr>
              <Td color="$textMain" fontSize="14">Category A</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹XX.X L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹X.XX L</Td>
              <Td color="$positive" fontSize="14" textAlign="right" bold="true">X.Xxx</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">XX.X%</Td>
            </Tr>
            <Tr>
              <Td color="$textMain" fontSize="14">Category B</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹XX.X L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹X.XX L</Td>
              <Td color="$positive" fontSize="14" textAlign="right" bold="true">X.Xxx</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">XX.X%</Td>
            </Tr>
            <Tr>
              <Td color="$textMain" fontSize="14">Category C</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹XX.X L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹X.XX L</Td>
              <Td color="$warning" fontSize="14" textAlign="right" bold="true">X.Xxx</Td>
              <Td color="$negative" fontSize="14" textAlign="right">XX.X%</Td>
            </Tr>
            <Tr>
              <Td color="$textMain" fontSize="14" bold="true" backgroundColor="$surfaceAlt">TOTAL</Td>
              <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="$surfaceAlt">₹XX.X L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="$surfaceAlt">₹X.XX L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="$surfaceAlt">X.Xxx</Td>
              <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="$surfaceAlt">XX.X%</Td>
            </Tr>
          </Table>
        </VStack>
        <VStack padding="14" gap="6" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1">
          <Text fontSize="14" color="$textMain" bold="true">Sub-split table — [type A] vs [type B]</Text>
          <Table defaultRowHeight="30" cellBorder.color="$border" cellBorder.width="1">
            <Col width="130" /><Col /><Col /><Col /><Col /><Col />
            <Tr>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14">TYPE</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">SPEND</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">SALES</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">RATIO</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">FLAG %</Td>
              <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">EFFICIENCY</Td>
            </Tr>
            <Tr>
              <Td color="$textMain" fontSize="14">Type Alpha</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹X.XX L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹XX.X L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">X.Xxx</Td>
              <Td color="$positive" fontSize="14" textAlign="right" bold="true">XX.X%</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">XX.X%</Td>
            </Tr>
            <Tr>
              <Td color="$textMain" fontSize="14">Type Beta</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹X.XX L</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">₹XX.X L</Td>
              <Td color="$positive" fontSize="14" textAlign="right" bold="true">XX.Xxx</Td>
              <Td color="$textMain" fontSize="14" textAlign="right">X.X%</Td>
              <Td color="$positive" fontSize="14" textAlign="right">X.X%</Td>
            </Tr>
          </Table>
        </VStack>
      </VStack>
      <VStack w="50%" gap="10">
        <VStack grow="1" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1">
          <Text fontSize="14" color="$textMain" bold="true">Top items by [metric] — [period]</Text>
          <Chart h="max" minH="180" chartType="bar" showLegend="false">
            <ChartSeries name="[Metric]">
              <ChartDataPoint label="SKU 1" value="12.4" />
              <ChartDataPoint label="SKU 2" value="9.8" />
              <ChartDataPoint label="SKU 3" value="7.2" />
              <ChartDataPoint label="SKU 4" value="5.6" />
              <ChartDataPoint label="SKU 5" value="4.3" />
            </ChartSeries>
          </Chart>
        </VStack>
        <VStack padding="14" gap="6" backgroundColor="$textMain" borderRadius="12">
          <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="1">KEY READ-OUTS</Text>
          <Ul fontSize="14" color="D0DDD8" lineHeight="1.4">
            <Li>Insight 1 — lead with the number, name the mechanism that drove it</Li>
            <Li>Insight 2 — contrast two segments or time periods with specific delta</Li>
            <Li>Insight 3 — flag the outlier or risk item with the specific metric</Li>
            <Li>Insight 4 — one actionable recommendation tied to the data above</Li>
          </Ul>
        </VStack>
      </VStack>
    </HStack>
    <Text fontSize="14" color="$textMuted">Source: [data source] · [period] · [any methodology note]</Text>
  </VStack></Slide>

narrative: |
  <!-- NARRATIVE SLIDE: strategy one-pager with dark hero panel (the choice),
       a matrix for evidence, value-case metrics, and 4 action cards with
       color-coded top borders. Shows how to mix editorial + data. -->
  <Slide><VStack w="1280" h="720" padding="38" gap="18" backgroundColor="$surface">
    <HStack justifyContent="spaceBetween" alignItems="end">
      <VStack gap="5">
        <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">FY2027 STRATEGY / ONE-PAGE CHOICE</Text>
        <Text fontSize="31" color="$textMain" bold="true">Win deep, not wide</Text>
        <Text fontSize="14" color="$textMuted">Concentrate on mid-size manufacturers and redesign the product and sales model</Text>
      </VStack>
      <Text fontSize="14" color="$textMuted">Strategy Office | July 2026</Text>
    </HStack>
    <HStack grow="1" gap="16" alignItems="stretch">
      <VStack w="33%" padding="22" gap="14" backgroundColor="$textMain" borderRadius="16" justifyContent="center">
        <Text fontSize="14" color="F1C7D2" bold="true" letterSpacing="1">THE CHOICE</Text>
        <Text fontSize="22" color="$surfaceAlt" bold="true" lineHeight="1.35">Own mid-size manufacturing</Text>
        <Text fontSize="14" color="F0DCE1" lineHeight="1.5">Manufacturers with $100M-$500M revenue. Leave the feature race; sell data integration plus adoption support as one package.</Text>
        <VStack gap="9">
          <HStack justifyContent="spaceBetween"><Text fontSize="14" color="F1C7D2">Target ARR</Text><Text fontSize="15" color="$surfaceAlt" bold="true">$12.0B</Text></HStack>
          <HStack justifyContent="spaceBetween"><Text fontSize="14" color="F1C7D2">Target NRR</Text><Text fontSize="15" color="$surfaceAlt" bold="true">125%</Text></HStack>
          <HStack justifyContent="spaceBetween"><Text fontSize="14" color="F1C7D2">Payback</Text><Text fontSize="15" color="$surfaceAlt" bold="true">under 14 mo</Text></HStack>
        </VStack>
      </VStack>
      <VStack w="67%" padding="18" gap="10" backgroundColor="$surfaceAlt" borderRadius="16" border.color="$border" border.width="1">
        <HStack justifyContent="spaceBetween"><Text fontSize="14" color="$textMain" bold="true">Strategic option assessment</Text><Text fontSize="14" color="$textMuted">Impact x Right to win</Text></HStack>
        <Matrix h="max" minH="260" axisLabelColor="$textMuted" quadrantLabelColor="$textMuted" itemLabelColor="$textMain">
          <MatrixAxes x="Right to win" y="Economic impact" />
          <MatrixQuadrants topLeft="Partner" topRight="Invest" bottomLeft="Pass" bottomRight="Optimize" />
          <MatrixItem label="Mid-size mfg" x="0.8" y="0.85" color="$accent" />
          <MatrixItem label="Enterprise" x="0.44" y="0.7" color="$accentAlt" />
          <MatrixItem label="Overseas" x="0.24" y="0.5" color="D99AA9" />
          <MatrixItem label="Generic AI" x="0.66" y="0.36" color="8EA38C" />
        </Matrix>
        <Text fontSize="14" color="$accent" bold="true">Mid-size manufacturing is the only cell high on both axes</Text>
      </VStack>
    </HStack>
    <HStack gap="12" alignItems="stretch">
      <VStack w="max" padding="14" gap="4" backgroundColor="$surfaceAlt" borderTop.color="$accent" borderTop.width="4" justifyContent="center"><Text fontSize="14" color="$accent" bold="true">01 / PRODUCT</Text><Text fontSize="14" color="$textMain" bold="true">Shop-floor data at the core</Text><Text fontSize="14" color="$textMuted">Equipment, quality and cost in one view</Text></VStack>
      <VStack w="max" padding="14" gap="4" backgroundColor="$surfaceAlt" borderTop.color="$accentAlt" borderTop.width="4" justifyContent="center"><Text fontSize="14" color="936E27" bold="true">02 / GO-TO-MARKET</Text><Text fontSize="14" color="$textMain" bold="true">Template the industry play</Text><Text fontSize="14" color="$textMuted">Three verticals, packaged rollouts</Text></VStack>
      <VStack w="max" padding="14" gap="4" backgroundColor="$surfaceAlt" borderTop.color="$positive" borderTop.width="4" justifyContent="center"><Text fontSize="14" color="5E775D" bold="true">03 / DELIVERY</Text><Text fontSize="14" color="$textMain" bold="true">Make adoption the product</Text><Text fontSize="14" color="$textMuted">90-day guided program to expand usage</Text></VStack>
      <VStack w="max" padding="14" gap="4" backgroundColor="E9DFD2" borderTop.color="$textMain" borderTop.width="4" justifyContent="center"><Text fontSize="14" color="$textMain" bold="true">NOT DOING</Text><Text fontSize="14" color="$textMain" bold="true">Competing on feature count</Text><Text fontSize="14" color="$textMuted">Drop low-price SMB and custom builds</Text></VStack>
    </HStack>
  </VStack></Slide>

cover: |
  <!-- COVER / CLOSING SLIDE: earnings report with dark hero panel for key
       message, KPI card row, quarterly bar chart, and 3 accent callouts
       (growth / watch / outlook). Shows editorial density at its best. -->
  <Slide><VStack w="1280" h="720" padding="40" gap="20" backgroundColor="$surface">
    <HStack justifyContent="spaceBetween" alignItems="start">
      <VStack gap="5">
        <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">FY2026 / Q3 EARNINGS</Text>
        <Text fontSize="30" color="$textMain" bold="true">Record profit while sustaining growth investment</Text>
        <Text fontSize="14" color="$textMuted">Aurora Works | consolidated results, Apr-Dec 2026 (illustrative)</Text>
      </VStack>
      <VStack gap="4" alignItems="end">
        <Text fontSize="14" color="$textMuted">Full-year progress</Text>
        <Text fontSize="26" color="$accent" bold="true">76.4%</Text>
        <Shape shapeType="roundRect" w="128" h="24" fill.color="$accentAlt" color="$textMain" fontSize="14" bold="true" borderRadius="999">+2.8pt vs plan</Shape>
      </VStack>
    </HStack>
    <HStack grow="1" gap="18" alignItems="stretch">
      <VStack w="31%" padding="22" gap="14" backgroundColor="$textMain" borderRadius="18" justifyContent="center">
        <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="1">KEY MESSAGE</Text>
        <Text fontSize="23" color="$surfaceAlt" bold="true" lineHeight="1.35">Profit grew faster than revenue.</Text>
        <Text fontSize="14" color="C5CDC6" lineHeight="1.5">Enterprise expansion and lower cloud cost of goods lifted operating margin 2.1 points year on year.</Text>
        <HStack justifyContent="spaceBetween" alignItems="end">
          <VStack gap="2"><Text fontSize="14" color="98A39B">Operating margin</Text><Text fontSize="33" color="$accentAlt" bold="true">18.6%</Text></VStack>
          <Text fontSize="14" color="$surfaceAlt" bold="true">+2.1pt YoY</Text>
        </HStack>
      </VStack>
      <VStack w="69%" gap="14">
        <HStack gap="12" alignItems="stretch">
          <VStack w="max" padding="15" gap="4" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center"><Text fontSize="14" color="$textMuted">Revenue</Text><Text fontSize="26" color="$textMain" bold="true">$42.8B</Text><Text fontSize="14" color="$positive" bold="true">+12.4% YoY</Text></VStack>
          <VStack w="max" padding="15" gap="4" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center"><Text fontSize="14" color="$textMuted">Operating income</Text><Text fontSize="26" color="$textMain" bold="true">$7.96B</Text><Text fontSize="14" color="$positive" bold="true">+27.1% YoY</Text></VStack>
          <VStack w="max" padding="15" gap="4" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center"><Text fontSize="14" color="$textMuted">Free cash flow</Text><Text fontSize="26" color="$textMain" bold="true">$5.31B</Text><Text fontSize="14" color="$positive" bold="true">+18.8% YoY</Text></VStack>
        </HStack>
        <VStack grow="1" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
          <HStack justifyContent="spaceBetween" alignItems="center"><Text fontSize="14" color="$textMain" bold="true">Quarterly revenue and operating profit</Text><Text fontSize="14" color="$textMuted">$B</Text></HStack>
          <Chart h="max" minH="180" chartType="bar" showLegend="true" chartColors='["1F6B4F","B9E769"]'>
            <ChartSeries name="Revenue"><ChartDataPoint label="Q1" value="12.4" /><ChartDataPoint label="Q2" value="13.7" /><ChartDataPoint label="Q3" value="16.7" /></ChartSeries>
            <ChartSeries name="Operating profit"><ChartDataPoint label="Q1" value="2.1" /><ChartDataPoint label="Q2" value="2.5" /><ChartDataPoint label="Q3" value="3.36" /></ChartSeries>
          </Chart>
        </VStack>
      </VStack>
    </HStack>
    <HStack gap="12" alignItems="stretch">
      <VStack w="max" padding="13" gap="4" backgroundColor="E4F0E9" borderLeft.color="$accent" borderLeft.width="5" justifyContent="center"><Text fontSize="14" color="$accent" bold="true">GROWTH</Text><Text fontSize="14" color="$textMain" bold="true">Enterprise ARR +31%</Text><Text fontSize="14" color="$textMuted">Top-20 account expansions led the quarter</Text></VStack>
      <VStack w="max" padding="13" gap="4" backgroundColor="FFF1EC" borderLeft.color="$negative" borderLeft.width="5" justifyContent="center"><Text fontSize="14" color="$negative" bold="true">WATCH</Text><Text fontSize="14" color="$textMain" bold="true">APAC acquisition cost +8%</Text><Text fontSize="14" color="$textMuted">One-time channel stand-up spend</Text></VStack>
      <VStack w="max" padding="13" gap="4" backgroundColor="EEF2D8" borderLeft.color="$accentAlt" borderLeft.width="5" justifyContent="center"><Text fontSize="14" color="$accent" bold="true">OUTLOOK</Text><Text fontSize="14" color="$textMain" bold="true">Full-year guidance raised</Text><Text fontSize="14" color="$textMuted">Operating income $10.2B to $10.8B</Text></VStack>
    </HStack>
  </VStack></Slide>
