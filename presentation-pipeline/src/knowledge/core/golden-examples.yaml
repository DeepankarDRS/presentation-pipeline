# pom-knowledge/core/golden-examples.yaml
# Curated full-slide golden examples injected into the generator prompt as
# few-shot references. Each example is a complete, compile-verified, audit-clean
# slide that shows what "polished" looks like — not just a grammar rule.
#
# Selection: one per visual archetype (data, narrative, cover/closing).
# context_builder picks the best match for the current slide_type.

data: |
  <!-- DATA SLIDE: dense multi-chart dashboard with KPI row, area + doughnut charts,
       bar + radar sub-panels, and an analyst-note callout. Note the tight spacing,
       the dark hero panel for revenue mix, and the 3-band structure. -->
  <Slide><VStack w="1280" h="720" padding="32" gap="16" backgroundColor="$surface">
    <HStack w="max" justifyContent="spaceBetween" alignItems="center">
      <VStack gap="3">
        <Text fontSize="11" color="$accent" bold="true" letterSpacing="2">SIGNAL ROOM / WEEK 24</Text>
        <Text fontSize="27" color="$textMain" bold="true">Read the change, not the numbers</Text>
      </VStack>
      <HStack gap="8" alignItems="center"><Shape shapeType="ellipse" w="8" h="8" fill.color="$accentAlt" line.color="$accentAlt" /><Text fontSize="11" color="$textMuted">Data refreshed 09:00</Text></HStack>
    </HStack>
    <HStack w="max" h="330" gap="14" alignItems="stretch">
      <VStack w="62%" padding="18" gap="10" backgroundColor="$surfaceAlt" borderRadius="16" border.color="$border" border.width="1">
        <HStack justifyContent="spaceBetween" alignItems="start">
          <VStack gap="2"><Text fontSize="12" color="$textMuted">NET REVENUE</Text><Text fontSize="28" color="$textMain" bold="true">$86.4M <Span fontSize="13">/ week</Span></Text></VStack>
          <Shape shapeType="roundRect" w="108" h="26" fill.color="DFF5EC" color="$accent" fontSize="10" bold="true" borderRadius="999">+18.2% YoY</Shape>
        </HStack>
        <Chart w="max" h="196" chartType="area" showLegend="true" chartColors='["184D43","72D6B5"]'>
          <ChartSeries name="Actual"><ChartDataPoint label="W19" value="62" /><ChartDataPoint label="W20" value="66" /><ChartDataPoint label="W21" value="64" /><ChartDataPoint label="W22" value="75" /><ChartDataPoint label="W23" value="79" /><ChartDataPoint label="W24" value="86.4" /></ChartSeries>
          <ChartSeries name="Plan"><ChartDataPoint label="W19" value="60" /><ChartDataPoint label="W20" value="63" /><ChartDataPoint label="W21" value="67" /><ChartDataPoint label="W22" value="70" /><ChartDataPoint label="W23" value="74" /><ChartDataPoint label="W24" value="78" /></ChartSeries>
        </Chart>
        <Text fontSize="11" color="$accent" bold="true">Above plan since W22 on enterprise add-ons</Text>
      </VStack>
      <VStack w="38%" padding="18" gap="10" backgroundColor="$textMain" borderRadius="16" justifyContent="center">
        <Text fontSize="12" color="$accentAlt" bold="true" letterSpacing="1">REVENUE MIX</Text>
        <Chart w="max" h="176" chartType="doughnut" showLegend="true" chartColors='["72D6B5","F2C14E","E66B5B","9FB0AC"]'>
          <ChartSeries name="Mix"><ChartDataPoint label="Enterprise" value="48" /><ChartDataPoint label="Growth" value="31" /><ChartDataPoint label="Starter" value="14" /><ChartDataPoint label="Services" value="7" /></ChartSeries>
        </Chart>
        <HStack justifyContent="spaceBetween">
          <VStack gap="2"><Text fontSize="10" color="9FB0AC">Largest</Text><Text fontSize="16" color="FFFFFF" bold="true">Enterprise 48%</Text></VStack>
          <VStack gap="2" alignItems="end"><Text fontSize="10" color="9FB0AC">QoQ</Text><Text fontSize="16" color="$accentAlt" bold="true">+6pt</Text></VStack>
        </HStack>
      </VStack>
    </HStack>
    <HStack w="max" h="214" gap="14" alignItems="stretch">
      <VStack w="34%" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1"><Text fontSize="12" color="$textMain" bold="true">Channel efficiency</Text><Chart w="max" h="150" chartType="bar" showLegend="false" chartColors='["184D43"]'><ChartSeries name="Rate"><ChartDataPoint label="Referral" value="42" /><ChartDataPoint label="Event" value="31" /><ChartDataPoint label="Search" value="24" /><ChartDataPoint label="Ads" value="16" /></ChartSeries></Chart></VStack>
      <VStack w="34%" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1"><Text fontSize="12" color="$textMain" bold="true">CSAT structure</Text><Chart w="max" h="150" chartType="radar" showLegend="false" chartColors='["72D6B5"]'><ChartSeries name="Score"><ChartDataPoint label="Value" value="91" /><ChartDataPoint label="Ease" value="78" /><ChartDataPoint label="Speed" value="84" /><ChartDataPoint label="Support" value="88" /><ChartDataPoint label="Integ" value="72" /></ChartSeries></Chart></VStack>
      <VStack w="32%" padding="18" gap="9" backgroundColor="FFF8E7" borderRadius="14" border.color="E8D8A8" border.width="1" justifyContent="center"><Text fontSize="10" color="8B6B13" bold="true">ANALYST NOTE</Text><Text fontSize="17" color="$textMain" bold="true" lineHeight="1.35">Quality of growth is improving</Text><Text fontSize="11" color="$textMuted" lineHeight="1.5">Referral efficiency and support are strong. Integration at 72 may bottleneck enterprise expansion.</Text><Shape shapeType="roundRect" w="max" h="30" fill.color="$warning" color="$textMain" fontSize="10" bold="true" borderRadius="8">NEXT: prioritize API integrations</Shape></VStack>
    </HStack>
  </VStack></Slide>

narrative: |
  <!-- NARRATIVE SLIDE: strategy one-pager with dark hero panel (the choice),
       a matrix for evidence, value-case metrics, and 4 action cards with
       color-coded top borders. Shows how to mix editorial + data. -->
  <Slide><VStack w="1280" h="720" padding="38" gap="18" backgroundColor="$surface">
    <HStack w="max" justifyContent="spaceBetween" alignItems="end">
      <VStack gap="5">
        <Text fontSize="11" color="$accent" bold="true" letterSpacing="2">FY2027 STRATEGY / ONE-PAGE CHOICE</Text>
        <Text fontSize="31" color="$textMain" bold="true">Win deep, not wide</Text>
        <Text fontSize="12" color="$textMuted">Concentrate on mid-size manufacturers and redesign the product and sales model</Text>
      </VStack>
      <Text fontSize="10" color="$textMuted">Strategy Office | July 2026</Text>
    </HStack>
    <HStack w="max" h="356" gap="16" alignItems="stretch">
      <VStack w="33%" padding="22" gap="14" backgroundColor="$textMain" borderRadius="16" justifyContent="center">
        <Text fontSize="10" color="F1C7D2" bold="true" letterSpacing="1">THE CHOICE</Text>
        <Text fontSize="22" color="$surfaceAlt" bold="true" lineHeight="1.35">Own mid-size manufacturing</Text>
        <Text fontSize="11" color="F0DCE1" lineHeight="1.5">Manufacturers with $100M-$500M revenue. Leave the feature race; sell data integration plus adoption support as one package.</Text>
        <VStack gap="9">
          <HStack justifyContent="spaceBetween"><Text fontSize="10" color="F1C7D2">Target ARR</Text><Text fontSize="15" color="$surfaceAlt" bold="true">$12.0B</Text></HStack>
          <HStack justifyContent="spaceBetween"><Text fontSize="10" color="F1C7D2">Target NRR</Text><Text fontSize="15" color="$surfaceAlt" bold="true">125%</Text></HStack>
          <HStack justifyContent="spaceBetween"><Text fontSize="10" color="F1C7D2">Payback</Text><Text fontSize="15" color="$surfaceAlt" bold="true">under 14 mo</Text></HStack>
        </VStack>
      </VStack>
      <VStack w="67%" padding="18" gap="10" backgroundColor="$surfaceAlt" borderRadius="16" border.color="$border" border.width="1">
        <HStack justifyContent="spaceBetween"><Text fontSize="13" color="$textMain" bold="true">Strategic option assessment</Text><Text fontSize="10" color="$textMuted">Impact x Right to win</Text></HStack>
        <Matrix w="max" h="262" axisLabelColor="$textMuted" quadrantLabelColor="$textMuted" itemLabelColor="$textMain">
          <MatrixAxes x="Right to win" y="Economic impact" />
          <MatrixQuadrants topLeft="Partner" topRight="Invest" bottomLeft="Pass" bottomRight="Optimize" />
          <MatrixItem label="Mid-size mfg" x="0.8" y="0.85" color="$accent" />
          <MatrixItem label="Enterprise" x="0.44" y="0.7" color="$accentAlt" />
          <MatrixItem label="Overseas" x="0.24" y="0.5" color="D99AA9" />
          <MatrixItem label="Generic AI" x="0.66" y="0.36" color="8EA38C" />
        </Matrix>
        <Text fontSize="11" color="$accent" bold="true">Mid-size manufacturing is the only cell high on both axes</Text>
      </VStack>
    </HStack>
    <HStack w="max" h="96" gap="12" alignItems="stretch">
      <VStack w="max" padding="14" gap="4" backgroundColor="$surfaceAlt" borderTop.color="$accent" borderTop.width="4" justifyContent="center"><Text fontSize="10" color="$accent" bold="true">01 / PRODUCT</Text><Text fontSize="13" color="$textMain" bold="true">Shop-floor data at the core</Text><Text fontSize="10" color="$textMuted">Equipment, quality and cost in one view</Text></VStack>
      <VStack w="max" padding="14" gap="4" backgroundColor="$surfaceAlt" borderTop.color="$accentAlt" borderTop.width="4" justifyContent="center"><Text fontSize="10" color="936E27" bold="true">02 / GO-TO-MARKET</Text><Text fontSize="13" color="$textMain" bold="true">Template the industry play</Text><Text fontSize="10" color="$textMuted">Three verticals, packaged rollouts</Text></VStack>
      <VStack w="max" padding="14" gap="4" backgroundColor="$surfaceAlt" borderTop.color="$positive" borderTop.width="4" justifyContent="center"><Text fontSize="10" color="5E775D" bold="true">03 / DELIVERY</Text><Text fontSize="13" color="$textMain" bold="true">Make adoption the product</Text><Text fontSize="10" color="$textMuted">90-day guided program to expand usage</Text></VStack>
      <VStack w="max" padding="14" gap="4" backgroundColor="E9DFD2" borderTop.color="$textMain" borderTop.width="4" justifyContent="center"><Text fontSize="10" color="$textMain" bold="true">NOT DOING</Text><Text fontSize="13" color="$textMain" bold="true">Competing on feature count</Text><Text fontSize="10" color="$textMuted">Drop low-price SMB and custom builds</Text></VStack>
    </HStack>
  </VStack></Slide>

cover: |
  <!-- COVER / CLOSING SLIDE: earnings report with dark hero panel for key
       message, KPI card row, quarterly bar chart, and 3 accent callouts
       (growth / watch / outlook). Shows editorial density at its best. -->
  <Slide><VStack w="1280" h="720" padding="40" gap="20" backgroundColor="$surface">
    <HStack w="max" justifyContent="spaceBetween" alignItems="start">
      <VStack gap="5">
        <Text fontSize="11" color="$accent" bold="true" letterSpacing="2">FY2026 / Q3 EARNINGS</Text>
        <Text fontSize="30" color="$textMain" bold="true">Record profit while sustaining growth investment</Text>
        <Text fontSize="12" color="$textMuted">Aurora Works | consolidated results, Apr-Dec 2026 (illustrative)</Text>
      </VStack>
      <VStack gap="4" alignItems="end">
        <Text fontSize="10" color="$textMuted">Full-year progress</Text>
        <Text fontSize="26" color="$accent" bold="true">76.4%</Text>
        <Shape shapeType="roundRect" w="128" h="24" fill.color="$accentAlt" color="$textMain" fontSize="10" bold="true" borderRadius="999">+2.8pt vs plan</Shape>
      </VStack>
    </HStack>
    <HStack w="max" h="360" gap="18" alignItems="stretch">
      <VStack w="31%" padding="22" gap="14" backgroundColor="$textMain" borderRadius="18" justifyContent="center">
        <Text fontSize="11" color="$accentAlt" bold="true" letterSpacing="1">KEY MESSAGE</Text>
        <Text fontSize="23" color="$surfaceAlt" bold="true" lineHeight="1.35">Profit grew faster than revenue.</Text>
        <Text fontSize="12" color="C5CDC6" lineHeight="1.5">Enterprise expansion and lower cloud cost of goods lifted operating margin 2.1 points year on year.</Text>
        <HStack justifyContent="spaceBetween" alignItems="end">
          <VStack gap="2"><Text fontSize="10" color="98A39B">Operating margin</Text><Text fontSize="33" color="$accentAlt" bold="true">18.6%</Text></VStack>
          <Text fontSize="11" color="$surfaceAlt" bold="true">+2.1pt YoY</Text>
        </HStack>
      </VStack>
      <VStack w="69%" gap="14">
        <HStack w="max" h="118" gap="12" alignItems="stretch">
          <VStack w="max" padding="15" gap="4" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center"><Text fontSize="10" color="$textMuted">Revenue</Text><Text fontSize="26" color="$textMain" bold="true">$42.8B</Text><Text fontSize="11" color="$positive" bold="true">+12.4% YoY</Text></VStack>
          <VStack w="max" padding="15" gap="4" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center"><Text fontSize="10" color="$textMuted">Operating income</Text><Text fontSize="26" color="$textMain" bold="true">$7.96B</Text><Text fontSize="11" color="$positive" bold="true">+27.1% YoY</Text></VStack>
          <VStack w="max" padding="15" gap="4" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center"><Text fontSize="10" color="$textMuted">Free cash flow</Text><Text fontSize="26" color="$textMain" bold="true">$5.31B</Text><Text fontSize="11" color="$positive" bold="true">+18.8% YoY</Text></VStack>
        </HStack>
        <VStack w="max" h="228" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
          <HStack justifyContent="spaceBetween" alignItems="center"><Text fontSize="13" color="$textMain" bold="true">Quarterly revenue and operating profit</Text><Text fontSize="10" color="$textMuted">$B</Text></HStack>
          <Chart w="max" h="168" chartType="bar" showLegend="true" chartColors='["1F6B4F","B9E769"]'>
            <ChartSeries name="Revenue"><ChartDataPoint label="Q1" value="12.4" /><ChartDataPoint label="Q2" value="13.7" /><ChartDataPoint label="Q3" value="16.7" /></ChartSeries>
            <ChartSeries name="Operating profit"><ChartDataPoint label="Q1" value="2.1" /><ChartDataPoint label="Q2" value="2.5" /><ChartDataPoint label="Q3" value="3.36" /></ChartSeries>
          </Chart>
        </VStack>
      </VStack>
    </HStack>
    <HStack w="max" h="92" gap="12" alignItems="stretch">
      <VStack w="max" padding="13" gap="4" backgroundColor="E4F0E9" borderLeft.color="$accent" borderLeft.width="5" justifyContent="center"><Text fontSize="10" color="$accent" bold="true">GROWTH</Text><Text fontSize="13" color="$textMain" bold="true">Enterprise ARR +31%</Text><Text fontSize="10" color="$textMuted">Top-20 account expansions led the quarter</Text></VStack>
      <VStack w="max" padding="13" gap="4" backgroundColor="FFF1EC" borderLeft.color="$negative" borderLeft.width="5" justifyContent="center"><Text fontSize="10" color="$negative" bold="true">WATCH</Text><Text fontSize="13" color="$textMain" bold="true">APAC acquisition cost +8%</Text><Text fontSize="10" color="$textMuted">One-time channel stand-up spend</Text></VStack>
      <VStack w="max" padding="13" gap="4" backgroundColor="EEF2D8" borderLeft.color="$accentAlt" borderLeft.width="5" justifyContent="center"><Text fontSize="10" color="$accent" bold="true">OUTLOOK</Text><Text fontSize="13" color="$textMain" bold="true">Full-year guidance raised</Text><Text fontSize="10" color="$textMuted">Operating income $10.2B to $10.8B</Text></VStack>
    </HStack>
  </VStack></Slide>
