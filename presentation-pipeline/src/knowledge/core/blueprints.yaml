          <Text fontSize="14" color="$textMuted">Context line</Text>
        </VStack>
        <Shape shapeType="roundRect" w="110" h="26" fill.color="E0F2EC" color="$textMain" fontSize="14" bold="true" borderRadius="999">BADGE</Shape>
      </HStack>
      <HStack grow="1" gap="14" alignItems="stretch">
        <VStack w="33%" padding="18" gap="10" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" borderTop.color="$accent" borderTop.width="4">
          <Text fontSize="14" color="$accent" bold="true">CARD LABEL</Text>
          <Text fontSize="15" color="$textMain" bold="true" lineHeight="1.3">Card heading</Text>
          <Text fontSize="14" color="$textMuted" bold="true" letterSpacing="1">SECTION</Text>
          <Ul fontSize="14" color="$textMuted" lineHeight="1.4">
            <Li>Point one</Li>
            <Li>Point two</Li>
          </Ul>
          <Text fontSize="14" color="$textMuted" bold="true" letterSpacing="1">RESULT</Text>
          <HStack gap="16">
            <VStack gap="2">
              <Text fontSize="22" color="$positive" bold="true">+38%</Text>
              <Text fontSize="14" color="$textMuted">Metric description</Text>
            </VStack>
          </HStack>
        </VStack>
      </HStack>
      <Text fontSize="14" color="$textMuted">Source note</Text>
    </VStack></Slide>

table_roadmap:
  description: "Full-width tall table for roadmaps or timelines"
  source: "gj-h1-deck/13-h2-roadmap"
  match:
    slide_types: [data, content]
    component_kinds_all: [table]
    component_kinds_none: [chart, kpi_row]
  structure:
    root: VStack
    padding: 36
    gap: 14
    bands:
      - role: header
        type: auto
      - role: table_card
        type: auto
        flex: { padding: 16, gap: 8 }
      - role: source
        type: auto
        optional: true
  reference_xml: |
    <Slide><VStack w="1280" h="720" padding="36" gap="14" backgroundColor="$surface">
      <HStack justifyContent="spaceBetween" alignItems="start">
        <VStack gap="4">
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">EYEBROW</Text>
          <Text fontSize="27" color="$textMain" bold="true">Headline</Text>
          <Text fontSize="14" color="$textMuted">Context</Text>
        </VStack>
        <Shape shapeType="roundRect" w="155" h="26" fill.color="E0F2EC" color="$textMain" fontSize="14" bold="true" borderRadius="999">BADGE</Shape>
      </HStack>
      <VStack padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
        <Table defaultRowHeight="50" cellBorder.color="$border" cellBorder.width="1">
          <Col /><Col /><Col />
          <Tr><Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14">COL</Td></Tr>
          <Tr><Td color="$textMain" fontSize="14">Data</Td></Tr>
        </Table>
      </VStack>
      <Text fontSize="14" color="$textMuted">Source note</Text>
    </VStack></Slide>

closing_cta:
  description: "Closing — left numbered items + right dark accent panel with metrics"
  source: "gj-h1-deck/14-ask-closing"
  match:
    slide_types: [closing]
    component_kinds_any: [narrative, bullet_list, kpi_row]
  structure:
    root: HStack
    padding: 0
    gap: 0
    bands:
      - role: content_panel
        type: fill
        flex: { w: "60%", padding: 36, gap: 14 }
        children:
          - role: header
            type: auto
          - role: numbered_items
            type: auto
            flex: { gap: 10 }
      - role: accent_panel
        type: fill
        flex: { w: "40%", padding: 40, gap: 24, backgroundColor: "$textMain", justifyContent: center }
  reference_xml: |
    <Slide><HStack w="1280" h="720">
      <VStack w="60%" padding="36" gap="14" backgroundColor="$surface">
        <VStack gap="4">
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">SECTION LABEL</Text>
          <Text fontSize="27" color="$textMain" bold="true">Headline</Text>
          <Text fontSize="14" color="$textMuted">Context</Text>
        </VStack>
        <VStack padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1" borderLeft.color="$accent" borderLeft.width="5">
          <HStack gap="12" alignItems="start">
            <Text fontSize="22" color="$accent" bold="true">01</Text>
            <VStack gap="4">
              <Text fontSize="14" color="$textMain" bold="true">Item title</Text>
              <Text fontSize="14" color="$textMuted" lineHeight="1.4">Item description.</Text>
            </VStack>
          </HStack>
        </VStack>
      </VStack>
      <VStack w="40%" padding="40" gap="24" backgroundColor="$textMain" justifyContent="center">
        <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="2">CLOSING NOTE</Text>
        <Text fontSize="28" color="$surfaceAlt" bold="true" lineHeight="1.3">Closing statement.</Text>
        <VStack gap="10">
          <VStack gap="2">
            <Text fontSize="24" color="$surfaceAlt" bold="true">$METRIC</Text>
            <Text fontSize="14" color="A0B0A8">metric label</Text>
          </VStack>
        </VStack>
        <Text fontSize="14" color="$accentAlt" bold="true">THANK YOU</Text>
      </VStack>
    </HStack></Slide>

dashboard_3band:
  description: "3-band dashboard: KPI/header + dual chart row + secondary row"
  source: "editorial-dashboard"
  match:
    slide_types: [data]
    component_kinds_all: [chart]
    min_charts: 2
  structure:
    root: VStack
    padding: 32
    gap: 16
    bands:
      - role: header
        type: auto
      - role: primary_row
        type: grow
        grow: 3
        split: ["62%", "38%"]
      - role: secondary_row
        type: grow
        grow: 2
        split: ["34%", "34%", "32%"]
  reference_xml: |
    <Slide><VStack w="1280" h="720" padding="32" gap="16" backgroundColor="$surface">
      <HStack justifyContent="spaceBetween" alignItems="center">
        <VStack gap="3">
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">EYEBROW</Text>
          <Text fontSize="27" color="$textMain" bold="true">Headline</Text>
        </VStack>
        <HStack gap="8" alignItems="center"><Shape shapeType="ellipse" w="8" h="8" fill.color="$accentAlt" line.color="$accentAlt" /><Text fontSize="14" color="$textMuted">Timestamp</Text></HStack>
      </HStack>
      <HStack grow="3" gap="14" alignItems="stretch">
        <VStack w="62%" padding="18" gap="10" backgroundColor="$surfaceAlt" borderRadius="16" border.color="$border" border.width="1">
          <HStack justifyContent="spaceBetween" alignItems="start">
            <VStack gap="2"><Text fontSize="14" color="$textMuted">METRIC</Text><Text fontSize="28" color="$textMain" bold="true">$VALUE</Text></VStack>
            <Shape shapeType="roundRect" w="108" h="26" fill.color="DFF5EC" color="$accent" fontSize="14" bold="true" borderRadius="999">DELTA</Shape>
          </HStack>
          <Chart h="max" minH="180" chartType="area" showLegend="true" chartColors='["184D43","72D6B5"]'>
            <ChartSeries name="S"><ChartDataPoint label="A" value="10" /></ChartSeries>
          </Chart>
        </VStack>
        <VStack w="38%" padding="18" gap="10" backgroundColor="$textMain" borderRadius="16" justifyContent="center">
          <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="1">SECONDARY CHART</Text>
          <Chart h="max" minH="180" chartType="doughnut" showLegend="true" chartColors='["72D6B5","F2C14E","E66B5B","9FB0AC"]'>
            <ChartSeries name="S"><ChartDataPoint label="A" value="10" /></ChartSeries>
          </Chart>
        </VStack>
      </HStack>
      <HStack grow="2" gap="14" alignItems="stretch">
        <VStack w="34%" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
          <Text fontSize="14" color="$textMain" bold="true">Chart title</Text>
          <Chart h="max" minH="180" chartType="bar" showLegend="false" chartColors='["184D43"]'>
            <ChartSeries name="S"><ChartDataPoint label="A" value="10" /></ChartSeries>
          </Chart>
        </VStack>
        <VStack w="34%" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
          <Text fontSize="14" color="$textMain" bold="true">Chart title</Text>
          <Chart h="max" minH="180" chartType="radar" showLegend="false" chartColors='["72D6B5"]'>
            <ChartSeries name="S"><ChartDataPoint label="A" value="10" /></ChartSeries>
          </Chart>
        </VStack>
        <VStack w="32%" padding="18" gap="9" backgroundColor="FFF8E7" borderRadius="14" border.color="E8D8A8" border.width="1" justifyContent="center">
          <Text fontSize="14" color="8B6B13" bold="true">NOTE</Text>
          <Text fontSize="17" color="$textMain" bold="true" lineHeight="1.35">Insight headline</Text>
          <Text fontSize="14" color="$textMuted" lineHeight="1.5">Detail text.</Text>
        </VStack>
      </HStack>
    </VStack></Slide>

