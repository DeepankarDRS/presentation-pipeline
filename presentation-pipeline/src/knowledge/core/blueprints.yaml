# Parametric Blueprint Library
# Each blueprint is an adaptive skeleton extracted from a golden slide.
# The selector picks one based on component_kinds + slide_type + density.
# The generator fills content into the slots — it never rearranges bands.
#
# Structure keys:
#   root: VStack | HStack (the 1280x720 root container)
#   padding, gap: root-level spacing
#   bands: ordered list of layout bands
#     role: semantic name (header, kpi_row, chart, table, cards, callout, etc.)
#     type: auto (no h, sizes to content) | grow (shares the spare height;
#           weight in grow: N, hero 3 / peer 2 / supporting 1) | fill (an HStack
#           child: its split width, stretched to the band height)
#     flex: special flex instructions (wrap thresholds, children_w etc.)
#     split: for HStack bands — child width ratios
#     optional: true if band can be omitted
#     children: nested band descriptions for complex layouts
#
# reference_xml: one concrete instantiation from a golden slide (theme stripped)

cover:
  description: "Hero cover — HStack root, left text panel + right accent panel"
  source: "gj-h1-deck/01-cover"
  match:
    slide_types: [cover]
    component_kinds_any: [title]
  structure:
    root: HStack
    padding: 0
    gap: 0
    bands:
      - role: text_panel
        type: fill
        flex: { w: "56%", padding: 56, gap: 16, justifyContent: center }
        children:
          - role: eyebrow
            type: auto
          - role: title
            type: auto
          - role: subtitle
            type: auto
          - role: meta
            type: auto
            optional: true
      - role: accent_panel
        type: fill
        flex: { w: "44%", padding: 48, justifyContent: center, alignItems: center, backgroundColor: "$accent" }
  reference_xml: |
    <Slide><HStack w="1280" h="720">
      <VStack w="56%" padding="56" gap="16" backgroundColor="$surfaceAlt" justifyContent="center">
        <HStack gap="10" alignItems="center">
          <Shape shapeType="ellipse" w="10" h="10" fill.color="$accent" line.color="$accent" />
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">BRAND NAME</Text>
        </HStack>
        <Text fontSize="14" color="$textMuted" bold="true" letterSpacing="2">PRESENTATION TYPE</Text>
        <VStack gap="6" margin.top="12">
          <Text fontSize="42" color="$textMain" bold="true" lineHeight="1.15">Main Title</Text>
          <Text fontSize="42" color="$textMain" bold="true" lineHeight="1.15">Second Line</Text>
        </VStack>
        <VStack gap="6" margin.top="16">
          <Text fontSize="14" color="$textMuted">Tagline or one-sentence summary</Text>
          <Text fontSize="14" color="$textMuted" lineHeight="1.5">Extended description — context, scope, data sources.</Text>
        </VStack>
        <Text fontSize="14" color="$textMuted" bold="true" letterSpacing="1" margin.top="24">PREPARED FOR · AUDIENCE | PERIOD · DATE RANGE</Text>
      </VStack>
      <VStack w="44%" backgroundColor="$accent" padding="48" justifyContent="center" alignItems="center" gap="20">
        <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="2">SUBTITLE</Text>
        <Shape shapeType="ellipse" w="280" h="280" fill.color="1A7D5C" line.color="1A7D5C" />
        <Icon name="bar-chart-2" size="48" color="$accentAlt" />
      </VStack>
    </HStack></Slide>

section_break:
  description: "Minimal section divider — large centered text"
  source: "editorial"
  match:
    slide_types: [section_break]
    component_kinds_any: [title]
  structure:
    root: VStack
    padding: 80
    gap: 16
    bands:
      - role: section_title
        type: auto
        flex: { justifyContent: center, alignItems: center }
  reference_xml: |
    <Slide><VStack w="1280" h="720" padding="80" gap="16" alignItems="stretch" backgroundColor="$surface" justifyContent="center">
      <VStack alignItems="center" gap="12">
        <Shape shapeType="ellipse" w="10" h="10" fill.color="$accent" line.color="$accent" />
        <Text fontSize="42" color="$textMain" bold="true" textAlign="center">Section Title</Text>
        <Text fontSize="14" color="$textMuted" textAlign="center">Brief context line</Text>
      </VStack>
    </VStack></Slide>

kpi_snapshot:
  description: "KPI row + chart with sidebar cards + callout"
  source: "gj-h1-deck/02-h1-snapshot"
  match:
    slide_types: [data]
    component_kinds_all: [kpi_row, chart]
    component_kinds_any: [table, narrative]
  structure:
    root: VStack
    padding: 36
    gap: 14
    bands:
      - role: header
        type: auto
      - role: kpi_row
        type: auto
        flex: { children_w: max, gap: 12 }
      - role: main_content
        type: grow
        grow: 1
        split: ["60%", "40%"]
        children:
          - role: chart_card
            type: fill
          - role: sidebar
            type: fill
      - role: callout
        type: auto
        optional: true
  reference_xml: |
    <Slide><VStack w="1280" h="720" padding="36" gap="14" backgroundColor="$surface">
      <HStack justifyContent="spaceBetween" alignItems="start">
        <VStack gap="4">
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">EYEBROW LABEL</Text>
          <Text fontSize="27" color="$textMain" bold="true">Headline with key metrics inline</Text>
          <Text fontSize="14" color="$textMuted">Supporting context line</Text>
        </VStack>
        <Shape shapeType="roundRect" w="155" h="26" fill.color="E0F2EC" color="$textMain" fontSize="14" bold="true" borderRadius="999">BADGE</Shape>
      </HStack>
      <HStack gap="12" alignItems="stretch">
        <VStack w="max" padding="14" gap="3" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center">
          <Text fontSize="14" color="$textMuted">METRIC LABEL</Text>
          <Text fontSize="26" color="$textMain" bold="true">$VALUE</Text>
          <Text fontSize="14" color="$textMuted">Context note</Text>
        </VStack>
      </HStack>
      <HStack grow="1" gap="14" alignItems="stretch">
        <VStack w="60%" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
          <Text fontSize="14" color="$textMuted">Chart title</Text>
          <Chart h="max" minH="180" chartType="bar" showLegend="true" chartColors='["0D6B4E","3B82F6","F59E0B"]'>
            <ChartSeries name="Series"><ChartDataPoint label="A" value="10" /></ChartSeries>
          </Chart>
        </VStack>
        <VStack w="40%" gap="10">
          <VStack padding="14" gap="6" backgroundColor="$textMain" borderRadius="12">
            <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="1">CARD TITLE</Text>
            <Text fontSize="14" color="D0DDD8">Card content</Text>
          </VStack>
        </VStack>
      </HStack>
      <VStack padding="10" backgroundColor="E0F2EC" borderRadius="8">
        <Text fontSize="14" color="$textMain" lineHeight="1.4"><B>Read:</B> Summary callout text.</Text>
      </VStack>
    </VStack></Slide>

chart_hero__sidebar_cards:
  description: "Hero chart left (62%) + stacked insight cards right (38%)"
  source: "gj-h1-deck/03-performance-trend"
  match:
    slide_types: [data, content]
    component_kinds_all: [chart]
    component_kinds_none: [table]
    density: [normal, dense]
  structure:
    root: VStack
    padding: 36
    gap: 14
    bands:
      - role: header
        type: auto
      - role: main_content
        type: grow
        grow: 1
        split: ["62%", "38%"]
        children:
          - role: chart_card
            type: fill
          - role: insight_cards
            type: fill
            flex: { gap: 10 }
      - role: source
        type: auto
        optional: true
  reference_xml: |
    <Slide><VStack w="1280" h="720" padding="36" gap="14" backgroundColor="$surface">
      <HStack justifyContent="spaceBetween" alignItems="start">
        <VStack gap="4">
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">EYEBROW</Text>
          <Text fontSize="28" color="$textMain" bold="true">Headline</Text>
          <Text fontSize="14" color="$textMuted">Context line</Text>
        </VStack>
        <Shape shapeType="roundRect" w="155" h="26" fill.color="E0F2EC" color="$textMain" fontSize="14" bold="true" borderRadius="999">BADGE</Shape>
      </HStack>
      <HStack grow="1" gap="14" alignItems="stretch">
        <VStack w="62%" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
          <Text fontSize="14" color="$textMain" bold="true">Chart title</Text>
          <Chart h="max" minH="180" chartType="line" showLegend="true" chartColors='["0D6B4E","3B82F6","F59E0B"]'>
            <ChartSeries name="Series"><ChartDataPoint label="A" value="10" /></ChartSeries>
          </Chart>
        </VStack>
        <VStack w="38%" gap="10">
          <VStack padding="16" gap="8" backgroundColor="E0F2EC" borderRadius="12" borderLeft.color="3B82F6" borderLeft.width="5">
            <Text fontSize="14" color="3B82F6" bold="true" letterSpacing="1">INSIGHT LABEL</Text>
            <Text fontSize="28" color="$textMain" bold="true">+50.5%</Text>
            <Text fontSize="14" color="$textMuted" lineHeight="1.4">Explanation text with context.</Text>
          </VStack>
        </VStack>
      </HStack>
      <Text fontSize="14" color="$textMuted">Source note</Text>
    </VStack></Slide>

kpi_top__table_full:
  description: "KPI row above + full-width table below + callout"
  source: "gj-h1-deck/04-executive-summary"
  match:
    slide_types: [data]
    component_kinds_all: [kpi_row, table]
    component_kinds_none: [chart]
  structure:
    root: VStack
    padding: 36
    gap: 14
    bands:
      - role: header
        type: auto
      - role: kpi_row
        type: auto
        flex: { children_w: max, gap: 12 }
      - role: table_card
        type: auto
      - role: callout
        type: auto
        optional: true
      - role: source
        type: auto
        optional: true
  reference_xml: |
    <Slide><VStack w="1280" h="720" padding="36" gap="14" backgroundColor="$surface">
      <HStack justifyContent="spaceBetween" alignItems="start">
        <VStack gap="4">
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">SUMMARY · H1</Text>
          <Text fontSize="28" color="$textMain" bold="true">Headline reads here</Text>
          <Text fontSize="14" color="$textMuted">Period · Scope</Text>
        </VStack>
        <Shape shapeType="roundRect" w="135" h="26" fill.color="E0F2EC" color="$textMain" fontSize="14" bold="true" borderRadius="999">BADGE</Shape>
      </HStack>
      <HStack gap="12" alignItems="stretch">
        <VStack w="max" padding="14" gap="3" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center">
          <Text fontSize="14" color="$textMuted">TOTAL SALES</Text>
          <Text fontSize="24" color="$textMain" bold="true">₹4.2 Cr</Text>
          <Text fontSize="14" color="$negative">▼ 12% vs prev</Text>
        </VStack>
        <VStack w="max" padding="14" gap="3" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center">
          <Text fontSize="14" color="$textMuted">BLENDED ROAS</Text>
          <Text fontSize="24" color="$positive" bold="true">5.8x</Text>
          <Text fontSize="14" color="$positive">Above target 5.0x</Text>
        </VStack>
        <VStack w="max" padding="14" gap="3" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1" justifyContent="center">
          <Text fontSize="14" color="$textMuted">AD SPEND</Text>
          <Text fontSize="24" color="$textMain" bold="true">₹72 L</Text>
          <Text fontSize="14" color="$textMuted">Utilised 96%</Text>
        </VStack>
      </HStack>
      <VStack padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="14" border.color="$border" border.width="1">
        <Text fontSize="14" color="$textMain" bold="true">Platform performance</Text>
        <Table defaultRowHeight="38" cellBorder.color="$border" cellBorder.width="1">
          <Col width="140" /><Col /><Col /><Col /><Col />
          <Tr>
            <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14">PLATFORM</Td>
            <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">SALES</Td>
            <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">SPEND</Td>
            <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">ROAS</Td>
            <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">ACOS</Td>
          </Tr>
          <Tr>
            <Td color="$textMain" fontSize="14">Platform A</Td>
            <Td color="$textMain" fontSize="14" textAlign="right">₹2.1 Cr</Td>
            <Td color="$textMain" fontSize="14" textAlign="right">₹36 L</Td>
            <Td color="$positive" fontSize="14" textAlign="right" bold="true">5.8x</Td>
            <Td color="$textMain" fontSize="14" textAlign="right">17.2%</Td>
          </Tr>
          <Tr>
            <Td color="$textMain" fontSize="14">Platform B</Td>
            <Td color="$textMain" fontSize="14" textAlign="right">₹1.4 Cr</Td>
            <Td color="$textMain" fontSize="14" textAlign="right">₹24 L</Td>
            <Td color="$warning" fontSize="14" textAlign="right" bold="true">5.8x</Td>
            <Td color="$negative" fontSize="14" textAlign="right">17.2%</Td>
          </Tr>
          <Tr>
            <Td color="$textMain" fontSize="14" bold="true" backgroundColor="E0F2EC">TOTAL</Td>
            <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="E0F2EC">₹4.2 Cr</Td>
            <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="E0F2EC">₹72 L</Td>
            <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="E0F2EC">5.8x</Td>
            <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="E0F2EC">17.2%</Td>
          </Tr>
        </Table>
      </VStack>
      <VStack padding="10" backgroundColor="E0F2EC" borderRadius="8">
        <Text fontSize="14" color="$textMain" lineHeight="1.4"><B>Read:</B> Platform A leads on absolute sales; ACOS is healthy blended at 17%.</Text>
      </VStack>
    </VStack></Slide>

dense_deepdive:
  description: "Dense KPI row + 50/50 split (tables left, chart+bullets right)"
  source: "gj-h1-deck/05-blinkit-deepdive"
  match:
    slide_types: [data]
    component_kinds_all: [kpi_row, table, chart]
    density: [dense, tight_fit]
  structure:
    root: VStack
    padding: 36
    gap: 12
    bands:
      - role: header
        type: auto
      - role: kpi_row
        type: auto
        flex: { children_w: max, gap: 10 }
      - role: main_content
        type: grow
        grow: 1
        split: ["50%", "50%"]
        children:
          - role: tables_stack
            type: fill
            flex: { gap: 10 }
          - role: chart_and_bullets
            type: fill
            flex: { gap: 10 }
