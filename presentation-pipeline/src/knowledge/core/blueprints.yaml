      <HStack justifyContent="spaceBetween" alignItems="start">
        <VStack gap="4">
          <Text fontSize="14" color="$accent" bold="true" letterSpacing="2">PLATFORM · 01</Text>
          <Text fontSize="26" color="$textMain" bold="true">Headline reads here</Text>
          <Text fontSize="14" color="$textMuted">Period · Category scope</Text>
        </VStack>
        <Shape shapeType="roundRect" w="90" h="26" fill.color="E0F2EC" color="$accent" fontSize="14" bold="true" borderRadius="999">BADGE</Shape>
      </HStack>
      <HStack gap="10" alignItems="stretch">
        <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
          <Text fontSize="14" color="$textMuted">TOTAL SALES</Text>
          <Text fontSize="20" color="$textMain" bold="true">₹1.32 Cr</Text>
          <Text fontSize="14" color="$negative">▼ 18.4% vs prev</Text>
        </VStack>
        <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
          <Text fontSize="14" color="$textMuted">ROAS</Text>
          <Text fontSize="20" color="$positive" bold="true">6.35x</Text>
          <Text fontSize="14" color="$positive">Best platform</Text>
        </VStack>
        <VStack w="max" padding="12" gap="2" backgroundColor="$surfaceAlt" borderRadius="10" border.color="$border" border.width="1" justifyContent="center">
          <Text fontSize="14" color="$textMuted">AD SPEND</Text>
          <Text fontSize="20" color="$textMain" bold="true">₹7.3 L</Text>
          <Text fontSize="14" color="$textMuted">CPM ₹366</Text>
        </VStack>
      </HStack>
      <HStack grow="1" gap="12" alignItems="stretch">
        <VStack w="50%" gap="10">
          <VStack padding="14" gap="6" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1">
            <Text fontSize="14" color="$textMain" bold="true">Category performance</Text>
            <Table defaultRowHeight="32" cellBorder.color="$border" cellBorder.width="1">
              <Col width="110" /><Col /><Col /><Col />
              <Tr>
                <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14">CATEGORY</Td>
                <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">SALES</Td>
                <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">ROAS</Td>
                <Td bold="true" backgroundColor="$surface" color="$textMain" fontSize="14" textAlign="right">ACOS</Td>
              </Tr>
              <Tr>
                <Td color="$textMain" fontSize="14">Category A</Td>
                <Td color="$textMain" fontSize="14" textAlign="right">₹20 L</Td>
                <Td color="$positive" fontSize="14" textAlign="right" bold="true">6.9x</Td>
                <Td color="$textMain" fontSize="14" textAlign="right">14.5%</Td>
              </Tr>
              <Tr>
                <Td color="$textMain" fontSize="14">Category B</Td>
                <Td color="$textMain" fontSize="14" textAlign="right">₹10 L</Td>
                <Td color="$warning" fontSize="14" textAlign="right" bold="true">4.3x</Td>
                <Td color="$negative" fontSize="14" textAlign="right">23.1%</Td>
              </Tr>
              <Tr>
                <Td color="$textMain" fontSize="14" bold="true" backgroundColor="E0F2EC">TOTAL</Td>
                <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="E0F2EC">₹30 L</Td>
                <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="E0F2EC">6.1x</Td>
                <Td color="$textMain" fontSize="14" textAlign="right" bold="true" backgroundColor="E0F2EC">16.4%</Td>
              </Tr>
            </Table>
          </VStack>
        </VStack>
        <VStack w="50%" gap="10">
          <VStack grow="1" padding="16" gap="8" backgroundColor="$surfaceAlt" borderRadius="12" border.color="$border" border.width="1">
            <Text fontSize="14" color="$textMain" bold="true">Chart title</Text>
            <Chart h="max" minH="180" chartType="bar" showLegend="false" chartColors='["0D6B4E"]'>
              <ChartSeries name="Sales">
                <ChartDataPoint label="A" value="20" />
                <ChartDataPoint label="B" value="10" />
              </ChartSeries>
            </Chart>
          </VStack>
          <VStack padding="14" gap="6" backgroundColor="$textMain" borderRadius="12">
            <Text fontSize="14" color="$accentAlt" bold="true" letterSpacing="1">KEY READ-OUTS</Text>
            <Ul fontSize="14" color="D0DDD8" lineHeight="1.4">
              <Li>Category A leads on ROAS (6.9x) at healthy ACOS 14.5%</Li>
              <Li>Category B needs bid discipline — 23% ACOS drags blended</Li>
