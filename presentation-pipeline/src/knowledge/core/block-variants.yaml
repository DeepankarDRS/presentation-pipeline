# pom-knowledge/core/block-variants.yaml   (DRAFT 2026-10-06; `blocks` is read by src/compiler/nodes/spec.py
# for the 1a node route; `tile_nodes` at the end (2026-10-12) is read by src/compiler/nodes/tiles.py under
# POM_BLOCKS=tiles (KPI built; Card built 2026-10-13, matrix deferred): docs/tile-nodes-spec-2026-10-12.md)
# The ONE place the ref-node tags and their `variant` names are stated (node contract,
# docs/derived-blocks-planning-2026-10-06.md §3, decision D10). The generator prompt
# renders each component's line from it, and the node pass reads it. A test fails when a
# prompt or knowledge file names a tag or variant that is not here (the same pattern as
# capacity.yaml). What each variant LOOKS like: docs/block-variants-look-spec.md.
#
# The LLM writes one self-closing tag per plan component: <KpiRow ref="c2" variant="inverted" />.
# Content always comes from the plan by `ref`; code writes the inside of the node.
#
# Per block:
#   tag        the tag the LLM writes (derived tags are not POM; native tags are POM nodes
#              whose children code fills in)
#   family     derived (code draws a block) | native (POM draws; code fills children)
#   plan_kind  the plan kind(s) this block takes
#
# A variant is a STYLE the LLM picks. Fitting the content (number size, columns,
# rows, tiers, re-flow) is the block's job and never a variant: blocks never reword
# or drop text to fit (Genspark learnings 2, 5).
#
# Per variant:
#   prompt    one short phrase shown to the generator after the name
#   draw      native (POM's own drawing, code-filled children) | block (code draws).
#             Default: block on a derived tag, native on a native tag. A block variant on a
#             native tag replaces the native node with a block of the same box (step 1 on).
#   requires  named checks on the plan component (list below); all must hold.
#             A variant whose requires fail is left out of that component's prompt line,
#             and if the LLM writes it anyway the node pass uses `fallback`
#             (warning NODE_VARIANT_UNMET, with the failed check).
#   fallback  next variant to try; the chain ends at the block's default
#   emphasis  the variant draws ONE item differently; which item comes from the
#             `emphasis_from` sources of the block, in order, never from the LLM
#
# The first variant of a block is its default (no `variant`, or an unknown name).
#
# Checks used in `requires` (implemented once in the node pass):
#   count_eq_1        the component has exactly one item
#   count_ge_3        three or more items
#   one_singled_out   an emphasis source names exactly one item
#   not_matrix        card_layout is not "matrix"
#   all_titles_numbered_ok   no card already starts with its own number or phase tag
#                            ("Phase 1: ..."), which the numerals would repeat
#   has_tones         at least one item carries a non-neutral tone (see Tones)
#   chart_is_bar      the plan's chart_type is bar (POM's pie / doughnut / line / area / radar
#                     have no bars to label or turn)
#
# Emphasis sources (in order; the first that names an item wins):
#   design_hint   the planner's hint names the item next to inverted / featured /
#                 highlight (today's `_named_in_hint`, hint-capabilities inverted_panel)
#   destination   the last step of an ordered sequence (explicit user rule 2026-09-29)
#   priority      matrix cells the plan marks as priority (explicit user rule 2026-09-29)
#   Nothing else singles an item out: no headline matching, no position (2026-10-07, user).
#
# Tones (added 2026-10-06): the slide component planner writes one tone per item,
# from the meaning of the number, not its direction (churn down = good):
#   kpi_row    content_data.kpi_tones: ["good" | "bad" | "watch" | "", ...]
#   card_grid  cards[i].tone:          "good" | "bad" | "watch" | ""
# Code maps them to palette roles (good -> positive, bad -> negative, watch -> warning,
# "" -> neutral) in EVERY variant: the KPI note line takes the tone colour. Only the
# `toned` card variant also tints the card. A tone is never shown as a word: a card's
# label is its plan `tag` ("GROWTH", "WATCH") or nothing.

version: 1

blocks:

  # ── derived tags: code draws the block ────────────────────────────────────────

  kpi_row:
    tag: KpiRow
    family: derived
    plan_kind: kpi_row
    emphasis_from: [design_hint]
    variants:
      plain:
        prompt: "light tiles, numbers in ink"
      filled:
        prompt: "every tile tinted with the accent"
      inverted:
        prompt: "one dark tile for the number the slide is about"
        requires: [count_ge_3, one_singled_out]   # with 2 tiles an inverted one reads as a pair, not a focus
        emphasis: true
        fallback: plain
      hero:
        prompt: "one large dark tile, the change in a pill"
        requires: [count_eq_1]
        fallback: inverted
      bare:
        prompt: "numbers and labels only, no tiles (a supporting row, a dark band)"

  card_grid:
    tag: CardGrid
    family: derived
    plan_kind: card_grid
    layouts: [grid, matrix]
    emphasis_from: [design_hint, priority]
    variants:
      outline:
        prompt: "hairline cards on the background"
      filled:
        prompt: "cards on a light panel, no border"
      featured:
        prompt: "one large dark card, the rest beside it"
        requires: [count_ge_3, one_singled_out, not_matrix]
        emphasis: true
        fallback: filled
      numerals:
        prompt: "large faint 01 02 03 above each title"
        requires: [not_matrix, all_titles_numbered_ok]
        fallback: outline
      toned:
        prompt: "each card tinted by its tone (good / bad / watch), coloured left edge"
        requires: [has_tones]
        fallback: filled
      accent_top:
        prompt: "accent bar on top of each card (pillars, workstreams)"
        emphasis: optional    # a singled-out card is drawn as the contrast card; none is fine

  card_steps:
    tag: CardGrid             # same tag; the plan's card_layout "steps" selects these variants
    family: derived
    plan_kind: card_grid
    layouts: [steps]
    emphasis_from: [design_hint, destination]
    variants:
      cards:
        prompt: "numbered cards in a row with arrows, destination dark"
        emphasis: true
      rail:
        prompt: "vertical rail with a dot per phase, text to the right"
      columns:
        prompt: "columns under a segmented progress bar"
        emphasis: true

  callout:
    tag: Callout              # narrative as a panel; plain narrative text uses <Text ref> (below)
    family: derived
    plan_kind: narrative
    variants:
      rule:   {prompt: "accent rule on the left"}
      tinted: {prompt: "tinted panel with an accent edge"}
      dark:   {prompt: "dark panel"}
      quote:  {prompt: "large quotation, italic"}

  header:
    tag: SlideHeader          # ref="header"; step 1 (in 1a the LLM writes the header text)
    family: derived
    plan_kind: title
    variants:
      standard: {prompt: "kicker, headline, sub-headline on the background"}
      inverted: {prompt: "dark band behind the header"}

  # ── native tags: POM draws; code fills the children from the plan ─────────────
  # (looks of the block variants below come after the KPI / card blocks)

  text:
    tag: Text                 # body copied verbatim; the LLM may style it (fontSize, color, bold)
    family: native
    plan_kind: [narrative, caption]
    variants:
      plain: {prompt: "the text as written"}

  table:
    tag: Table                # every table variant stays a native Table: code sets cell fills
    family: native
    plan_kind: table
    emphasis_from: [design_hint]
    variants:                 # the compositions of `nodes.table` (POM_NODES=table, tables.py); names as there
      native:          {prompt: "POM's table: header band, bold first column, the hinted row / column tinted"}
      rows:            {prompt: "one ruled row per table row: the first cell as its title, the other cells to the right"}
      rows numbered:   {prompt: "rows with 01 02 03 leading each", requires: [no_own_numbers], fallback: rows}
      columns:         {prompt: "one column per row: its first cell as a pill, each other cell in its own box", requires: [count_le_5, columns_le_6], fallback: native}
      banded:          {prompt: "equal boxes, the first cell in a solid band over 'column: value' lines", requires: [count_le_6], fallback: native}

  chart:
    tag: Chart                # chartType comes from the plan, not the variant
    family: native
    plan_kind: chart
    variants:                 # the compositions of `nodes.chart` (POM_NODES=chart, charts.py); names as there
      native:            {prompt: "the chart, one hue, the focus bar in the accent"}
      native labelled:   {prompt: "each bar's value written on it, no value axis", requires: [one_series, count_le_8, chart_is_bar], fallback: native}
      rows:              {prompt: "one row per point: label, a bar, the value as written", requires: [one_series, count_le_8], fallback: native}

  bullet_list:
    tag: Ul
    family: native
    plan_kind: bullet_list
    variants:
      plain:   {prompt: "plain bullets"}
      icon:    {prompt: "an icon per point", draw: block}
      tiles:   {prompt: "each point in its own tile", draw: block}
      columns: {prompt: "points in two columns", draw: block}

  timeline:
    tag: Timeline
    family: native
    plan_kind: timeline
    variants:                 # the compositions of `nodes.timeline` (POM_NODES=timeline, sequences.py)
      native:   {prompt: "POM's timeline: dots on a line, short labels only", requires: [labels_short], fallback: rail}
      rail:     {prompt: "a line with a dot per point, one box per point under it"}
      rows:     {prompt: "one point per ruled row: date, head, detail"}
      banded:   {prompt: "equal boxes, the date in a solid band: done / now / ahead"}

  process_arrow:
    tag: ProcessArrow
    family: native
    plan_kind: process_arrow
    emphasis_from: [destination]
    variants:                 # the compositions of `nodes.process_arrow`
      native:          {prompt: "chevron arrows, short steps only", requires: [labels_short], fallback: steps}
      steps:           {prompt: "boxes joined by arrows, the destination dark", requires: [count_le_6], fallback: native}
      steps numbered:  {prompt: "steps with a numbered circle over each box", requires: [count_le_6, no_own_numbers], fallback: steps}
      rail:            {prompt: "numbered dots on a line, labels alternating above and below", requires: [count_le_7], fallback: steps}

  flow:
    tag: Flow                 # the plan holds a linear list: one FlowConnection per consecutive pair
    family: native
    plan_kind: flow
    emphasis_from: [destination]
    variants:                 # the compositions of `nodes.flow`
      native:          {prompt: "POM's flow: terminator, process boxes, arrows"}
      steps:           {prompt: "boxes joined by arrows, the destination dark", requires: [count_le_6], fallback: native}
      steps numbered:  {prompt: "steps with a numbered circle over each box", requires: [count_le_6, no_own_numbers], fallback: steps}

  pyramid:
    tag: Pyramid
    family: native
    plan_kind: pyramid
    variants:
      native: {prompt: "the pyramid as drawn"}

  tree:
    tag: Tree
    family: native
    plan_kind: tree
    variants:
      native: {prompt: "the tree as drawn"}

  matrix:
    tag: Matrix               # low / mid / high -> 0.2 / 0.5 / 0.8 (derived by code)
    family: native
    plan_kind: matrix
    variants:
      native: {prompt: "the 2x2 map as drawn"}

# `layer` has no tag: it carries no content shape, so the LLM draws it (NODE_KIND_NO_REF).


# ══ Tile nodes (design 2026-10-12; KPI read by src/compiler/nodes/tiles.py, Card by cards.py) ═════
# Spec and reasons: docs/tile-nodes-spec-2026-10-12.md. Replaces, when built, the `kpi_row`,
# `card_grid` and `card_steps` blocks above for the element-ref route (POM_BLOCKS=kpi).
#
# Shape of a native POM data node: a group tag and an item tag, like Timeline / TimelineItem.
#   <KpiGrid ref="kpi_metrics" variant="filled" cols="2">        group: every item, plan order
#     <Kpi ref="kpi_metrics.2" variant="toned" icon="alert-triangle"/>   item: overrides one tile
#   </KpiGrid>
#   <Kpi ref="kpi_metrics.4" variant="inverted" size="hero"/>    item outside a group: placed anywhere
#
# - A group draws every item of its component except the items a <Kpi> / <Card> places
#   outside it. Each item is drawn exactly once (NODE_REF_DUPLICATE / NODE_ITEM_MISSING).
# - An item tag inside a group must name that group's component (NODE_REF_UNKNOWN).
# - Item tags are self-closing; groups hold only item tags.
# - Text always comes from the plan; notes are always drawn (user, 2026-10-12).
# - Attributes resolve in this order, later wins (Timeline.dateColor -> TimelineItem.dateColor):
#     house look -> group variant -> group attributes -> item variant -> item attributes
# - Part attributes: a part name, a dot, then a native POM attribute of the node the part
#   becomes (POM's own dot style, as border.color / fill.color / glow.size):
#     label.color="$accent"  value.glow.size="6"  icon.variant="circle-filled"  marker.fill.color="$negative"
# - Box attributes (no prefix) land on the tile's VStack.
# - Colours are $tokens only (LITERAL_COLOR). `color` takes a role token, from which code
#   derives the fills and inks of the looks: $accent / $positive / $negative / $warning / $neutral.
#   {role} in a look below = that role; default role = the plan tone (good -> positive,
#   bad -> negative, watch -> warning, "" -> accent). $neutral has no Soft / Text token:
#   ${role}Soft -> $surfaceAlt and ${role}Text -> $textMain for it.

tile_nodes:
  version: 1

  dropped:              # removed with info NODE_ATTR_DROPPED; code owns them
    box: [borderRadius, position, top, right, bottom, left, zIndex, id]   # square tiles (user, 2026-10-11 §11; kept 2026-10-12)
    parts: [fontSize, fontFamily, lineHeight, text, size]                 # number / label sizes, deck font, icon size
    content: true       # typed text or child nodes inside an item tag

  box_attributes: [backgroundColor, backgroundGradient, border, border.color, border.width, border.dashType,
                   borderTop.color, borderTop.width, borderRight.color, borderRight.width,
                   borderBottom.color, borderBottom.width, borderLeft.color, borderLeft.width,
                   padding, padding.top, padding.right, padding.bottom, padding.left, gap,
                   alignItems, justifyContent, shadow.type, shadow.blur, shadow.offset, shadow.color, shadow.opacity,
                   opacity, w, h, grow, minW, maxW, minH, maxH, alignSelf, margin]

  part_nodes:           # part -> the POM node it becomes -> the attributes its prefix may carry
    Text:  [color, bold, italic, underline, highlight, letterSpacing, textAlign, textGradient,
            glow.size, glow.opacity, glow.color, outline.size, outline.color]
    Icon:  [name, color, variant, bgColor, glow.size, glow.opacity, glow.color, outline.size, outline.color]
    Shape: [shapeType, w, h, fill.color, fill.transparency, line.color, line.width, line.dashType,
            glow.size, glow.opacity, glow.color]
    Cell:  [backgroundColor, color, bold, italic, underline, textAlign]   # a table <Td> (R2), or a Text a composition draws
    Rule:  [color, width]   # a composition's `divider.`: code draws it as a border on the item after it

  # ── KPI ───────────────────────────────────────────────────────────────────────
  kpi:
    plan_kind: kpi_row
    group_tag: KpiGrid
    item_tag: Kpi
    ref: {group: "<component_id>", item: "<component_id>.<index>"}
    emphasis_from: [design_hint]
    parts:
      label:  Text
      value:  Text
      note:   Text
      icon:   Icon      # `icon="name"` is shorthand for icon.name; no icon unless named
      marker: Shape     # drawn only when the variant has one or marker.shapeType is set

    group_attributes:
      ref:    {required: true}
      layout: {values: [row, grid, column], default: "row; grid when more than 4 items"}
      cols:   {type: number, applies_to: grid, default: "balanced (5 -> 3 + 2, 7 -> 4 + 3)"}
      shared: [variant, arrange, color, icon, parts]   # item attributes the group may set for every tile

    item_attributes:
      ref:     {required: true}
      variant: {default: "the group's variant, else plain"}
      arrange: {values: [label-first, value-first, icon-top, side, inline], default: label-first}
               # side = icon (or marker) left, label / value / note stacked right
               # inline = one line: icon, label over note on the left, value right-aligned (a group of inline
               # tiles defaults to layout="column")
      size:    {values: [normal, hero], default: normal, requires: [is_emphasis_item], fallback: normal}
      color:   {values: [$accent, $positive, $negative, $warning, $neutral], default: "plan tone"}
      icon:    {type: icon name, default: none}

    owned_by_code: [label / value / note text, one value size per group (hero larger),
                    unit spans (value_parts), word fit, icon size, readable text on dark fills]

    # the planner's visual-intent treatments (hint-capabilities.yaml kpi_row) as tile attributes. Under tiles the
    # generator gets these instead of the hand-built techniques, and a kpi_row's scope lists only these
    # (sparkline is left out: a Kpi holds no chart). Emphasis stays the plan's item (user, 2026-10-07).
    treatments:
      emphasis:       'size="hero" on the emphasis item'
      focus:          'variant="inverted" on the emphasis item'
      inverted_panel: 'variant="inverted" on the emphasis item'
      sentiment:      'color on each item by meaning: $negative losses / leaks / risks, $positive wins / fixes, $warning watch
                       (the tones, when given, already set it); variant="filled" or "bar" shows it on the tile, value.color="$negativeText"
                       (or $positiveText / $warningText) on the number'
      icon_tiles:     'icon="name" (ICON NAMES) on every item, or on none'
      status_dots:    'variant="dot" with each item''s color'
      accent_border:  'variant="bar"'
      gradient:       'backgroundGradient="linear-gradient(90deg, $accentSoft 0%, $surface 100%)" on a <Kpi>'
      lift:           'shadow.type="outer" shadow.blur="6" shadow.offset="2" on each <Kpi>'

    # the house look: the first layer, under every variant (the pilot gallery's tile, 2026-10-11). Padding / gap are
    # the median of the LLM's own 206 hand tiles: 22 / 10 left tile numbers smaller than the hand route on 29 of 68
    # saved slides, 16 / 6 on 14 (docs/eval/tile-nodes/wide/README.md, P1, 2026-10-13)
    house_look: {padding: 16, gap: 6, justifyContent: center, icon.color: "${role}Text",
                 label.color: $textMuted, value.color: $textMain, note.color: "${role}Text"}

    variants:           # first = default. `look` is what the variant sets before attributes
      plain:
        prompt: "light surface, hairline border, number in ink; an item with its own color, or a bad / watch tone, draws toned"
        # an item with its own color and no variant of its own draws as this variant, so the colour shows
        # (paid check 2, CHEFFIN 4: color="$warning" on a plain tile without note / icon drew nothing)
        with_color: toned
        # an item the plan gives a tone (kpi_tones) and the LLM no variant / color: bad and watch tiles are
        # tinted, a good tile shows it in its number (colour roles: attention where it is needed, 2026-10-12)
        with_tone: {bad: toned, watch: toned, good: {value.color: "${role}Text"}}
        look: {backgroundColor: $surfaceAlt, border.color: $border, border.width: 1,
               label.color: $textMuted, value.color: $textMain, note.color: "${role}Text"}
      filled:
        prompt: "tile tinted with the item's colour"
        look: {backgroundColor: "${role}Soft", label.color: $textMuted, value.color: "${role}Text",
               note.color: "${role}Text"}
      toned:
        prompt: "tinted by the item's tone, number in that tone"
        requires: [has_tones]
        fallback: plain
        look: {backgroundColor: "${role}Soft", border.color: "${role}", border.width: 1,
               value.color: "${role}Text", note.color: "${role}Text"}
      bar:
        prompt: "coloured left bar"
        look: {backgroundColor: $surfaceAlt, borderLeft.color: "${role}", borderLeft.width: 6,
               label.color: $textMuted, value.color: $textMain, note.color: "${role}Text"}
      dot:
        prompt: "small dot and a coloured spaced label"
        # a bad / watch item keeps its tone's fill and number colour, the dot added (CHEFFIN 4, tile_one 2026-10-26:
        # the hint's dot on CPC, the problem metric, drew a white tile beside red ones; user: keep the tone)
        with_tone: {bad: {backgroundColor: "${role}Soft", border.color: "${role}", value.color: "${role}Text"},
                    watch: {backgroundColor: "${role}Soft", border.color: "${role}", value.color: "${role}Text"}}
        look: {backgroundColor: $surface, border.color: $border, border.width: 1,
               marker.shapeType: ellipse, marker.w: 8, marker.h: 8, marker.fill.color: "${role}",
               label.color: "${role}Text", label.letterSpacing: 1, value.color: $textMain}
      inverted:
        prompt: "dark tile for the number the slide is about"
        emphasis: true  # only on the emphasis item; elsewhere -> fallback (NODE_VARIANT_UNMET)
        requires: [count_ge_3, is_emphasis_item]
        fallback: plain
        look: {backgroundColor: $panelDark, label.color: $onPanelDark, value.color: $onPanelDark,
               note.color: $onPanelDark, icon.color: $onPanelDark}
      bare:
        prompt: "number and label only, no tile"
        look: {padding: 0, label.color: $textMuted, value.color: $textMain, note.color: "${role}Text"}
      divided:
        prompt: "group only: the items share one box, split by hairlines (a strip; with arrange=\"inline\" and
                 layout=\"column\", a ruled list)"
        # a group variant: the tiles draw bare and the group draws the box (group_look) and a hairline before each
        # tile after the first in its row (column: above it). A divided row stays one row (no regrid: a tile moved
        # to a second row would keep its divider). Strip / ruled-list patterns, 2026-10-22 review of 25 examples
        requires: [is_group]
        fallback: plain
        with_color: toned
        with_tone: {bad: {value.color: "${role}Text"}, watch: {value.color: "${role}Text"},
                    good: {value.color: "${role}Text"}}
        look: {padding: 0, label.color: $textMuted, value.color: $textMain, note.color: "${role}Text"}
        group_look: {backgroundColor: $surfaceAlt, border.color: $border, border.width: 1, padding: 22}
        divider: {color: $border, width: 1, space: 22}

  # ── Card ──────────────────────────────────────────────────────────────────────
  # Built 2026-10-13 (spec §11): src/compiler/nodes/cards.py. Code writes the text itself (no fill pass): ids
  # cardg-<cid> (a group whose columns code chose), card-<cid>-<i>, cardt- (title), cardb- (body).
  card:
    plan_kind: card_grid
    group_tag: CardGrid
    item_tag: Card
    ref: {group: "<component_id>", item: "<component_id>.<index>"}
    # focus_card (planner, settle_card_fields) -> design hint (spec.singled_out) -> the last step (steps / rail).
    # The emphasis card draws `inverted` by default; the LLM never picks it (user, 2026-10-07 / 2026-10-13)
    emphasis_from: [focus_card, design_hint, destination]
    deferred_layouts: [matrix]   # a matrix card_grid keeps the hand-written route (user, 2026-10-13: 2 saved slides)
    parts:
      tag:    Text      # the plan's tag ("Q3", "PHASE 01"), small spaced capitals
      title:  Text
      body:   Text      # the plan's body line and bullets; key_phrase drawn as a coloured Span
      icon:   Icon      # `icon="name"` is shorthand for icon.name; no icon unless named
      number: Text      # steps / numerals: 01 02 03 (T4: a Text, not a transparent Shape)

    group_attributes:
      ref:    {required: true}
      layout:
        values: [grid, steps, rail]
        default: "the plan's card_layout"
        match_plan: {grid: [grid], steps: [steps, rail]}   # else NODE_ATTR_DROPPED -> the plan's
        # steps = cards in a row joined by arrows; rail = one card per row down a vertical line, the number left
      cols:   {type: number, applies_to: [grid], default: "measured: 2-3 per row by text length, never more than 4"}
      shared: [variant, arrange, color, icon, parts]

    item_attributes:
      ref:     {required: true}
      variant: {default: "the group's variant, else lifted; the emphasis card inverted"}
      arrange: {values: [stack, side], default: stack}
               # stack = icon, tag, title, body; side = icon left of tag / title / body
      color:   {values: [$accent, $positive, $negative, $warning, $neutral], default: "plan tone"}
      icon:    {type: icon name, default: none}

    owned_by_code: [title / body / tag text, key phrase, type sizes shared by all cards, step numbers,
                    arrows between steps, columns, word fit, readable text on dark fills]

    # the planner's card_grid treatments (hint-capabilities.yaml) as card attributes; under tiles the generator gets
    # these instead of the hand-built techniques. Emphasis, tones and key phrases come from the plan (code draws them).
    treatments:
      emphasis:       'code draws the plan''s focus card dark (no attribute)'
      focus:          'code draws the plan''s focus card dark (no attribute)'
      inverted_panel: 'code draws the plan''s focus card dark (no attribute)'
      sentiment:      'the tones colour the cards (no attribute); variant="toned" tints every toned card; color on a
                       <Card> by meaning when the plan has no tones ($negative risks / gaps, $positive wins, $warning watch)'
      highlight_text: 'code colours each card''s key phrase from the plan (no attribute)'
      icon_tiles:     'icon="name" (ICON NAMES) on the CardGrid or on each <Card>, on every card or on none'
      accent_border:  'variant="accent_top", or variant="toned"'
      lift:           'shadow.type="outer" shadow.blur="6" shadow.offset="2" on each <Card>'

    # cards are rounded (user, 2026-10-13: the POM guide's card, 8 px), KPI tiles stay square; the LLM cannot set it
    house_look: {borderRadius: 8, padding: 20, gap: 8, justifyContent: start, icon.color: "${role}Text", tag.color: "${role}Text",
                 number.color: "${role}Text", title.color: $textMain, body.color: $textMuted}

    variants:           # first = default
      # blind marks 2026-10-13 (0.313 for `column`): separation between cards, colour backgrounds and icons won.
      # The default (user, 2026-10-13): a white lifted card tinted by its tone; KPI tiles stay flat (no shadow).
      lifted:
        prompt: "white lifted card with a soft shadow, tinted by its tone (default)"
        with_color: {backgroundColor: "${role}Soft", border.color: "${role}"}
        with_tone: {bad: {backgroundColor: "${role}Soft", border.color: "${role}"},
                    watch: {backgroundColor: "${role}Soft", border.color: "${role}"},
                    good: {backgroundColor: "${role}Soft", border.color: "${role}"}}
        # shadow per the POM styling guide's card (10% opacity, blur 4); 35% / blur 8 read as a smudge
        look: {backgroundColor: $surface, border.color: $border, border.width: 1, padding: 24,
               shadow.type: outer, shadow.blur: 4, shadow.offset: 2, shadow.color: $textMain, shadow.opacity: 0.1,
               title.color: $textMain, body.color: $textMuted}
      # open text column: a coloured rule on the left, no box. The default until the blind marks of 2026-10-13
      # (0.313: separation between cards, colour and icons lost); kept as a variant.
      column:
        prompt: "open column, a coloured rule on the left, no box"
        with_color: {borderLeft.color: "${role}"}
        with_tone: {bad: {borderLeft.color: "${role}"}, watch: {borderLeft.color: "${role}"},
                    good: {borderLeft.color: "${role}"}}
        look: {borderLeft.color: $border, borderLeft.width: 3, padding: 4, padding.left: 18,
               title.color: $textMain, body.color: $textMuted}
      filled:
        prompt: "cards on a light panel, no border"
        with_color: toned
        with_tone: {bad: toned, watch: toned, good: {borderLeft.color: "${role}", borderLeft.width: 6}}
        look: {backgroundColor: $surfaceAlt, title.color: $textMain, body.color: $textMuted}
      outline:
        prompt: "hairline cards on the background"
        with_color: {borderLeft.color: "${role}", borderLeft.width: 6, title.color: "${role}Text"}
        with_tone: {bad: toned, watch: toned, good: {borderLeft.color: "${role}", borderLeft.width: 6}}
        look: {border.color: $border, border.width: 1, title.color: $textMain, body.color: $textMuted}
      toned:
        prompt: "tinted by the card's tone, coloured left edge"
        requires: [has_tones]
        fallback: lifted
        look: {backgroundColor: "${role}Soft", borderLeft.color: "${role}", borderLeft.width: 6,
               title.color: "${role}Text", body.color: $textMain, tag.color: "${role}Text"}
      accent_top:
        prompt: "coloured bar on top in the card's colour (pillars, workstreams)"
        look: {backgroundColor: $surfaceAlt, borderTop.color: "${role}", borderTop.width: 4,
               title.color: $textMain, body.color: $textMuted}
      numerals:
        prompt: "large 01 02 03 above each title"
        requires: [all_titles_numbered_ok]
        fallback: lifted
        with_color: {number.color: "${role}Text"}
        look: {backgroundColor: $surfaceAlt, number.color: $textMuted, title.color: $textMain, body.color: $textMuted}
      inverted:
        prompt: "dark card: the focus card or the destination step"
        emphasis: true
        requires: [count_ge_3, is_emphasis_item]
        fallback: lifted
        look: {backgroundColor: $panelDark, title.color: $onPanelDark, body.color: $onPanelDark,
               tag.color: $onPanelDark, number.color: $onPanelDark, icon.color: $onPanelDark}

  # Checks added for tile nodes (the others are in the header of this file):
  #   is_emphasis_item   the item is the one an `emphasis_from` source names (spec.singled_out,
  #                      or the last step for `destination`); the LLM never picks it


# ── composition nodes (docs/composition-convention-spec.md, approved 2026-10-27) ───────────────────────────────
# One entry per plan kind code draws under POM_NODES=<kind> (src/compiler/nodes/<kind>s.py). `variant` on the group
# tag names a composition: one shared word (§2.3), plus `numbered` / `labelled`. Per composition:
#   requires / fallback   as in `blocks` (checks in the header; one_series, count_le_8 below)
#   look                  the default look, $tokens only; the group's own box + `<part>.<attribute>`
#   emphasis              laid over `look` on the plan's emphasis item. With no emphasis item, every item takes the
#                         emphasis colours of the node's `one_hue` part (its mark), and no other emphasis attribute
# Later wins: look -> emphasis -> the LLM's attributes on the group tag. `aliases`: today's names -> a composition
# (+ attributes), NODE_ATTR_ALIAS (info), for one release. `styles`: recipes, prompt examples only.
#   one_series   one series (chart_values, or chart_series of length 1)
#   count_le_8   at most eight items
nodes:
  chart:
    tag: Chart
    plan_kind: chart
    parts: {title: Text, label: Text, value: Text, bar: Shape}
    one_hue: bar
    meta: [ref, variant, direction]
    native_attributes: [showLegend]     # the Chart's own
    code_owned: [chartColors, chartType, title, showTitle]
    compositions:
      native:
        look:     {backgroundColor: $chartSurface, padding: 16, borderRadius: 8, title.color: $chartInk,
                   bar.fill.color: $neutral}
        emphasis: {bar.fill.color: $accent}
      native labelled:                  # the values as native data labels (pptx-post.js), in the plan's unit
        requires: [one_series, count_le_8, chart_is_bar]
        fallback: native
        look:     {backgroundColor: $chartSurface, padding: 16, borderRadius: 8, title.color: $chartInk,
                   bar.fill.color: $neutral, label.color: $chartInk}
        emphasis: {bar.fill.color: $accent}
      rows:                             # label · a bar of code-measured length · the plan's value verbatim
        requires: [one_series, count_le_8]
        fallback: native
        look:     {title.color: $textMuted, label.color: $textMain, value.color: $textMain, bar.fill.color: $neutral}
        emphasis: {bar.fill.color: $accent, value.color: $accentText, label.bold: "true"}
    aliases:                            # the left-blocks draft's names
      plain: native
      labelled: native labelled
      focus_label: native labelled
      horizontal: {variant: native, direction: horizontal}
    styles: {}

  # -- sequences: timeline, process_arrow, flow (sequences.py; one expander, spec §8) --------------------------------
  # The item is a point / step. A string item ("Phase 1: Foundation — detail", a timeline label) shows as `label.`
  # (the head) and `description.` (the detail) where a composition shows both: compose.split, NODE_TEXT_SPLIT.
  # Emphasis: timeline = the point the design hint names (its date or head: "now"), else none; process / flow =
  # the destination (the last step, user rule 2026-09-29). `before`: laid over `look` on the points before the
  # emphasis point (timeline banded: done / now / ahead). Native compositions take their colours from the parts:
  # marker.fill.color -> the item colour, label.color -> its text, connector.fill.color / .color -> the line.
  #   labels_short     every item at most 24 characters, no detail to split off (C8: chevrons and the 120 px
  #                    timeline titles wrap past it; label_room already moves too-long words to card steps)
  #   count_le_6 / count_le_7   at most 6 / 7 items in one row
  #   no_own_numbers   no item carries a date or its own ordinal ("Phase 1", "01."): numbers would repeat it
  timeline:
    tag: Timeline
    plan_kind: timeline
    parts: {date: Text, label: Text, description: Text, marker: Shape, connector: Shape, band: Box, item: Box}
    one_hue: marker
    meta: [ref, variant, direction]
    native_attributes: []
    code_owned: [dateColor, titleColor, descriptionColor, connectorColor, useColorForDate]
    compositions:
      native:
        requires: [labels_short]
        fallback: rail
        look:     {date.color: $accentText, label.color: $textMain, description.color: $textMuted,
                   connector.fill.color: $border, marker.fill.color: $neutral}
        emphasis: {marker.fill.color: $accent}
      rail:
        look:     {item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.borderRadius: 8, item.padding: 20, date.color: $accentText, label.color: $textMain,
                   description.color: $textMuted, marker.fill.color: $neutral, connector.fill.color: $border}
        emphasis: {item.backgroundColor: $panelDark, date.color: $onPanelDark, label.color: $onPanelDark,
                   description.color: $onPanelDark, marker.fill.color: $accent}
      rows:
        look:     {date.color: $accentText, label.color: $textMain, description.color: $textMuted,
                   item.borderTop.color: $border, item.borderTop.width: 1}
        emphasis: {item.backgroundColor: $accentSoft}
      banded:
        look:     {item.border.color: $border, item.border.width: 1, item.backgroundColor: $surfaceAlt,
                   band.backgroundColor: $neutral, date.color: $textMain, label.color: $textMain,
                   description.color: $textMuted}
        before:   {band.backgroundColor: $accent, date.color: $onAccent}
        emphasis: {band.backgroundColor: $panelDark, date.color: $onPanelDark}
    aliases:
      vertical: {variant: native, direction: vertical}
      cards: rail
      columns: banded

  process_arrow:
    tag: ProcessArrow
    plan_kind: process_arrow
    parts: {label: Text, description: Text, number: Shape, marker: Shape, connector: Icon, item: Box}
    one_hue: marker
    meta: [ref, variant, direction]
    native_attributes: []
    code_owned: [itemWidth, itemHeight, gap, fontSize, bold]
    compositions:
      native:
        requires: [labels_short]
        fallback: steps
        look:     {item.backgroundColor: $accentSoft, label.color: $textMain}
        emphasis: {item.backgroundColor: $accent, label.color: $onAccent}
      steps:
        requires: [count_le_6]
        fallback: native
        look:     {item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.borderRadius: 8, item.padding: 18, label.color: $textMain, description.color: $textMuted,
                   connector.color: $neutral}
        emphasis: {item.backgroundColor: $panelDark, label.color: $onPanelDark, description.color: $onPanelDark}
      steps numbered:
        requires: [count_le_6, no_own_numbers]
        fallback: steps
        look:     {item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.borderRadius: 8, item.padding: 18, label.color: $textMain, description.color: $textMuted,
                   connector.color: $neutral, number.fill.color: $accent, number.color: $onAccent}
        emphasis: {item.backgroundColor: $panelDark, label.color: $onPanelDark, description.color: $onPanelDark,
                   number.fill.color: $panelDark, number.color: $onPanelDark}
      rail:
        requires: [count_le_7]
        fallback: steps
        look:     {label.color: $textMain, description.color: $textMuted, marker.fill.color: $accent,
                   number.color: $onAccent, connector.color: $border}
        emphasis: {label.color: $accentText, marker.fill.color: $panelDark, number.color: $onPanelDark}
    aliases:
      chevrons: native
      numbered: steps numbered
      alternating: rail
      step_cards: steps

  flow:
    tag: Flow
    plan_kind: flow
    parts: {label: Text, description: Text, number: Shape, marker: Shape, connector: Icon, item: Box}
    one_hue: marker
    meta: [ref, variant, direction]
    native_attributes: []
    code_owned: [nodeWidth, nodeHeight, nodeGap, connectorStyle.color, connectorStyle.width]
    compositions:
      native:
        look:     {item.backgroundColor: $accentSoft, label.color: $textMain, connector.color: $neutral}
        emphasis: {item.backgroundColor: $accent, label.color: $onAccent}
      steps:
        requires: [count_le_6]
        fallback: native
        look:     {item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.borderRadius: 8, item.padding: 18, label.color: $textMain, description.color: $textMuted,
                   connector.color: $neutral}
        emphasis: {item.backgroundColor: $panelDark, label.color: $onPanelDark, description.color: $onPanelDark}
      steps numbered:
        requires: [count_le_6, no_own_numbers]
        fallback: steps
        look:     {item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.borderRadius: 8, item.padding: 18, label.color: $textMain, description.color: $textMuted,
                   connector.color: $neutral, number.fill.color: $accent, number.color: $onAccent}
        emphasis: {item.backgroundColor: $panelDark, label.color: $onPanelDark, description.color: $onPanelDark,
                   number.fill.color: $panelDark, number.color: $onPanelDark}
    aliases:
      boxes: native
      numbered: steps numbered
      step_cards: steps

  # -- KPI tiles and cards (tile_groups.py; spec §5, §10 steps 1-2; POM_NODES=kpi_row,card_grid) ---------------------
  # Group tag + item tag as the tile nodes (an item tag inside the group restyles one item, outside it places the item
  # anywhere, drawn in the group's composition form). On top of the convention above:
  #   item.<box attribute>       every item's own box (spec D3); `divider.` the hairline between items (Rule: color /
  #                              width), `band.` an item's solid head, `bullets.` a card bullet's own box (columns)
  #   $tone $toneSoft $toneText $toneDark  the item's tone as a role token: good -> $positive*, bad -> $negative*, watch ->
  #                              $warning*, none -> $accent*; an item's own color="$negative" sets its tone ($neutral:
  #                              Soft -> $surfaceAlt, Text -> $textMain). Code swaps them per item (compose.tone_value)
  #   tone                       laid over `look` per the item's tone (bad / watch / good)
  #   emphasis                   laid over `look` + `tone` on the plan's emphasis item when `emphasis_requires` hold;
  #                              `size: hero` = the item's value at the hero size; a null value removes the key
  # Later wins: look -> tone -> emphasis -> the hint's / alias's recipe -> the LLM's group attributes -> item tag.
  #   count_le_5          at most five items
  #   bullets_every_card  every card has bullets (or a body given as a list)
  #   layout_grid / layout_steps   the plan's card_layout
  #   has_emphasis        the plan singles out one item (focus_card, else the design hint)
#   hint_dark           the design hint asks for a dark / inverted item (plan_checks.look_from_hint)
  # `meta_aliases`: today's structure attributes -> a composition; `part_aliases`: today's part names;
  # `tag_aliases`: today's tags (NODE_TAG_ALIAS). All info, one release (spec §7).
  kpi_row:
    tag: KpiRow
    item_tag: Kpi
    plan_kind: kpi_row
    tag_aliases: {KpiGrid: KpiRow}
    parts: {label: Text, value: Text, delta: Text, icon: Icon, marker: Shape, band: Box, divider: Rule, item: Box}
    part_aliases: {note: delta}
    meta: [ref, variant, cols, color, icon]
    item_meta: [ref, variant, color, icon, size]
    native_attributes: []
    code_owned: []
    meta_aliases:
      layout:  {row: grid, grid: grid, column: rows}
      arrange: {label-first: grid, icon-top: grid, value-first: bento, side: rows, inline: rows}
    compositions:
      grid:                             # today's plain tile with tones; no emphasis unless the hint asks for it
        look:     {item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.padding: 16, item.gap: 6, item.justifyContent: center, icon.color: $toneText,
                   label.color: $textMuted, value.color: $textMain, delta.color: $toneText}
        tone:     {bad: {item.backgroundColor: $toneSoft, item.border.color: $tone, value.color: $toneText},
                   watch: {item.backgroundColor: $toneSoft, item.border.color: $tone, value.color: $toneText},
                   good: {value.color: $toneText}}
        # a highlight must mean something (user 2026-11-01): the dark tile only when the design hint asks for a dark /
        # inverted item; no hero size in a grid (the hero is bento's: one item, the rest its subs)
        emphasis_requires: [count_ge_3, hint_dark]
        emphasis: {item.backgroundColor: $panelDark, label.color: $onPanelDark, value.color: $onPanelDark,
                   delta.color: $onPanelDark, icon.color: $onPanelDark}
      strip:                            # one shared box, one row, hairlines between (today's divided)
        requires: [count_le_5]
        fallback: grid
        look:     {backgroundColor: $surfaceAlt, border.color: $border, border.width: 1, padding: 28, gap: 28,
                   item.gap: 8, item.justifyContent: center, divider.color: $border, divider.width: 1,
                   icon.color: $toneText, label.color: $toneText, value.color: $toneText, delta.color: $toneText}
        # no emphasis look: a hero value in a one-row strip is width-bound and wrapped its unit over the delta, and
        # in rows it shrank the other rows' labels (gallery 2026-11-01; the proof sheets drew none either)
      rows:                             # icon badge · label over delta · value at the right; hairlines between rows
        look:     {gap: 0, padding.left: 8, padding.right: 8, item.gap: 18, item.alignItems: center,
                   item.padding.top: 10, item.padding.bottom: 10, divider.color: $border, divider.width: 1,
                   icon.variant: square-filled, icon.bgColor: $toneSoft, icon.color: $toneText,
                   label.color: $toneText, value.color: $toneText, delta.color: $toneText}
      banded:                           # a solid band (icon + label) over value + delta
        requires: [count_le_5]
        fallback: grid
        look:     {gap: 18, item.gap: 0, item.backgroundColor: $surfaceAlt, item.border.color: $border,
                   item.border.width: 1, band.backgroundColor: $tone, band.padding: 14, band.gap: 10,
                   icon.color: $onAccent, label.color: $onAccent, value.color: $toneText, delta.color: $toneText}
        # the band in its own tone, darker (user 2026-11-01: from the palette, not one dark colour)
        emphasis: {band.backgroundColor: $toneDark, icon.color: $onPanelDark, label.color: $onPanelDark}
      bento:                            # the emphasis item large, value first; the rest as rows beside it
        requires: [count_ge_3, has_emphasis]
        fallback: grid
        look:     {gap: 18, item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.padding: 18, item.gap: 16, icon.color: $toneText, label.color: $toneText,
                   value.color: $toneText, delta.color: $toneText}
        emphasis: {item.backgroundColor: $panelDark, item.border.color: $panelDark, item.padding: 32, item.gap: 12,
                   icon.color: $onPanelDark, label.color: $onPanelDark, value.color: $onPanelDark,
                   delta.color: $onPanelDark, size: hero}
    prompts:                            # one phrase per composition for the generator (tile_groups.node_lines)
      grid: "separate tiles, icon and label over the value and delta (default)"
      strip: "one shared box, items side by side split by hairlines, one row (at most 5)"
      rows: "one item per ruled row: icon badge, label over delta, the value at the right"
      banded: "equal boxes, each with a solid coloured band holding icon + label (at most 5)"
      bento: "the emphasis item as one large dark block, the others as rows beside it"
    aliases:                            # today's variant names (spec §7)
      plain: grid
      filled: {variant: grid, style: filled}
      toned: {variant: grid, style: toned}
      bar: {variant: grid, style: bar}
      dot: {variant: grid, style: dot}
      bare: {variant: grid, style: bare}
      inverted: grid                    # the emphasis look draws it
      divided: strip
    styles:                             # recipes (spec §3): prompt examples and the hint mapping, never a tag value
      filled: 'item.backgroundColor="$toneSoft" value.color="$toneText"'
      toned: 'item.backgroundColor="$toneSoft" item.border.color="$tone" value.color="$toneText"'
      bar: 'item.borderLeft.color="$tone" item.borderLeft.width="6"'
      dot: 'marker.shapeType="ellipse" marker.w="8" marker.h="8" marker.fill.color="$tone" label.color="$toneText"'
      bare: 'item.backgroundColor="$surface" item.border.color="$surface"'   # no zero strokes (test_upstream_reference)

  card_grid:
    tag: CardGrid
    item_tag: Card
    plan_kind: card_grid
    tag_aliases: {}
    parts: {tag: Text, title: Text, body: Text, icon: Icon, number: Text, band: Box, bullets: Box, divider: Rule,
            item: Box}
    part_aliases: {}
    meta: [ref, variant, cols, color, icon]
    item_meta: [ref, variant, color, icon]
    native_attributes: []
    code_owned: []
    meta_aliases:
      layout:  {grid: grid, steps: steps, rail: rail}
      arrange: {stack: grid, side: rows}
    compositions:
      grid:                             # today's lifted card with tones; the focus card dark
        requires: [layout_grid]
        fallback: steps
        look:     &card_lifted
                  {item.padding: 24, item.gap: 8, item.justifyContent: start, item.backgroundColor: $surface,
                   item.border.color: $border, item.border.width: 1, item.shadow.type: outer, item.shadow.blur: 4,
                   item.shadow.offset: 2, item.shadow.color: $textMain, item.shadow.opacity: 0.1,
                   icon.color: $toneText, tag.color: $toneText, number.color: $toneText, title.color: $textMain,
                   body.color: $textMuted}
        tone:     &card_tinted
                  {bad: {item.backgroundColor: $toneSoft, item.border.color: $tone},
                   watch: {item.backgroundColor: $toneSoft, item.border.color: $tone},
                   good: {item.backgroundColor: $toneSoft, item.border.color: $tone}}
        emphasis_requires: [count_ge_3]
        emphasis: &card_dark
                  {item.backgroundColor: $panelDark, item.border.color: null, item.border.width: null,
                   item.shadow.type: null, item.shadow.blur: null, item.shadow.offset: null, item.shadow.color: null,
                   item.shadow.opacity: null, item.padding: 20, title.color: $onPanelDark, body.color: $onPanelDark,
                   tag.color: $onPanelDark, number.color: $onPanelDark, icon.color: $onPanelDark}
      grid numbered:                    # + 01 02 03 above each title (today's numerals)
        requires: [layout_grid, no_own_numbers]
        fallback: grid
        look:     {item.padding: 20, item.gap: 8, item.justifyContent: start, item.backgroundColor: $surfaceAlt,
                   icon.color: $toneText, tag.color: $toneText, number.color: $textMuted, title.color: $textMain,
                   body.color: $textMuted}
        emphasis_requires: [count_ge_3]
        emphasis: *card_dark
      rows:                             # one card per full-width row: icon · tag over title · body · bullets
        requires: [count_le_6]
        fallback: grid
        look:     &card_rows
                  {gap: 0, item.gap: 24, item.alignItems: center, item.padding.top: 10, item.padding.bottom: 10,
                   divider.color: $border, divider.width: 1, icon.color: $toneText, number.color: $toneText,
                   tag.color: $toneText, title.color: $textMain, body.color: $textMuted}
        emphasis: {title.color: $toneText}
      rows numbered:                    # the same, code's 01 02 03 leading each row
        requires: [count_le_6, no_own_numbers]
        fallback: rows
        look:     *card_rows
        emphasis: {title.color: $toneText}
      columns:                          # a pill head (icon + title), the body, each bullet in its own box
        requires: [bullets_every_card, count_le_5]
        fallback: grid
        look:     {gap: 18, item.gap: 12, band.backgroundColor: $tone, band.padding: 14, band.gap: 10,
                   band.borderRadius: 24, icon.color: $onAccent, title.color: $onAccent, tag.color: $toneText,
                   body.color: $textMuted, bullets.backgroundColor: $surfaceAlt, bullets.border.color: $border,
                   bullets.border.width: 1, bullets.borderRadius: 8, bullets.padding: 14}
        emphasis: {band.backgroundColor: $panelDark, icon.color: $onPanelDark, title.color: $onPanelDark}
      banded:                           # a solid band (icon, title, tag at the right) over body + bullets
        requires: [count_le_6]
        fallback: grid
        look:     {gap: 18, item.gap: 0, item.backgroundColor: $surfaceAlt, item.border.color: $border,
                   item.border.width: 1, band.backgroundColor: $tone, band.padding: 14, band.gap: 10,
                   icon.color: $onAccent, title.color: $onAccent, tag.color: $onAccent, body.color: $textMuted}
        emphasis: {band.backgroundColor: $panelDark, icon.color: $onPanelDark, title.color: $onPanelDark,
                   tag.color: $onPanelDark}
      bento:                            # the focus card large and dark, the others 2 + 1 beside it
        requires: [layout_grid, count_ge_3, count_le_5, has_emphasis]   # a steps plan keeps its order (marks 5.2 / 5.3)
        fallback: grid
        look:     {gap: 18, item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.borderRadius: 8, item.padding: 20, item.gap: 8, icon.color: $toneText, tag.color: $toneText,
                   title.color: $textMain, body.color: $textMuted}
        tone:     *card_tinted
        emphasis: {item.backgroundColor: $panelDark, item.border.color: $panelDark, item.padding: 32, item.gap: 14,
                   icon.color: $onPanelDark, tag.color: $onPanelDark, title.color: $onPanelDark,
                   body.color: $onPanelDark}
      steps:                            # today's steps: cards joined by arrows, numbered unless dated
        requires: [layout_steps]
        fallback: grid
        look:     *card_lifted
        tone:     *card_tinted
        emphasis_requires: [count_ge_3]
        emphasis: *card_dark
      rail:                             # today's rail: one card per row down a line, the number at the left
        requires: [layout_steps]
        fallback: grid
        look:     *card_lifted
        tone:     *card_tinted
        emphasis_requires: [count_ge_3]
        emphasis: *card_dark
    prompts:
      grid: "separate cards: icon, tag, title, body, bullets (default for grid plans)"
      grid numbered: "cards with a large 01 02 03 above each title"
      rows: "one card per ruled full-width row: icon, tag over title, body, bullets"
      rows numbered: "rows led by a large 01 02 03"
      columns: "one column per card: a coloured pill head, the body, each bullet in its own box"
      banded: "boxes with a solid coloured band (icon, title, tag) over body and bullets"
      bento: "the focus card as one large dark block, the others beside it"
      steps: "cards in a row joined by arrows, the destination dark (default for steps plans)"
      rail: "one card per row down a numbered line"
    aliases:                            # today's variant names (spec §7)
      lifted: grid
      column: {variant: grid, style: column}
      filled: {variant: grid, style: filled}
      outline: {variant: grid, style: outline}
      toned: {variant: grid, style: toned}
      accent_top: {variant: grid, style: accent_top}
      numerals: grid numbered
      inverted: grid
    styles:
      column: 'item.backgroundColor="$surface" item.shadow.opacity="0" item.borderLeft.color="$tone" item.borderLeft.width="3"'
      filled: 'item.backgroundColor="$surfaceAlt" item.shadow.opacity="0"'
      outline: 'item.shadow.opacity="0"'
      toned: 'item.backgroundColor="$toneSoft" item.borderLeft.color="$tone" title.color="$toneText"'
      accent_top: 'item.borderTop.color="$tone" item.borderTop.width="4"'

  # -- table (tables.py, spec §8, C1 / C2): the item is a row; its first cell is the row's `label.` --------------------
  # `header.` = the header row (native) or the column names (code-drawn), `label.` = the first column, `cell.` = the other
  # cells, `stripe.` = alternate body rows (native: `zebra`). On `native` code writes every part onto the <Td>s (POM
  # ignores attributes on <Tr>), and `item.` takes only backgroundColor (onto every body cell; the rest
  # NODE_ATTR_DROPPED). Emphasis: the one row or column the design hint names ("shade the Exact row", "accent the Fix
  # column"), in the hint's tone ($tone / $toneSoft / $toneText; no tone -> accent). A row takes every emphasis part,
  # a column only header. / cell. / item. (its cells and their boxes).
  #   count_le_5 / count_le_6   at most 5 / 6 body rows;  columns_le_6   at most 6 columns
  table:
    tag: Table
    plan_kind: table
    parts: {header: Cell, label: Cell, cell: Cell, stripe: Cell, number: Text, band: Box, item: Box}
    meta: [ref, variant]
    native_attributes: [cellBorder.color, cellBorder.width, cellBorder.dashType]   # the Table's own
    code_owned: [defaultRowHeight]
    compositions:
      native:
        look:     {cellBorder.color: $border, cellBorder.width: 1, header.backgroundColor: $surfaceAlt,
                   header.color: $textMain, header.bold: "true", label.color: $textMain, label.bold: "true",
                   cell.color: $textMain}
        emphasis: {header.backgroundColor: $tone, header.color: $onAccent, label.backgroundColor: $toneSoft,
                   label.color: $toneText, cell.backgroundColor: $toneSoft, cell.color: $toneText, cell.bold: "true"}
      rows:
        look:     {header.color: $textMuted, label.color: $textMain, cell.color: $textMain,
                   item.borderTop.color: $border, item.borderTop.width: 1}
        emphasis: {item.backgroundColor: $toneSoft, header.color: $toneText, label.color: $toneText,
                   cell.color: $toneText, cell.bold: "true"}
      rows numbered:
        requires: [no_own_numbers]
        fallback: rows
        look:     {header.color: $textMuted, label.color: $textMain, cell.color: $textMain, number.color: $accentText,
                   item.borderTop.color: $border, item.borderTop.width: 1}
        emphasis: {item.backgroundColor: $toneSoft, header.color: $toneText, label.color: $toneText,
                   cell.color: $toneText, cell.bold: "true", number.color: $toneText}
      columns:                          # one column per row: the label as a band. pill, each other cell in its own box
        requires: [count_le_5, columns_le_6]
        fallback: native
        look:     {band.backgroundColor: $accent, label.color: $onAccent, header.color: $textMuted, cell.color: $textMain,
                   item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1,
                   item.borderRadius: 8}
        emphasis: {band.backgroundColor: $panelDark, label.color: $onPanelDark, header.color: $toneText,
                   item.backgroundColor: $toneSoft, item.border.color: $tone}
      banded:                           # equal boxes, the label in a solid band. over "column: value" lines
        requires: [count_le_6]
        fallback: native
        look:     {band.backgroundColor: $accent, label.color: $onAccent, header.color: $textMuted, cell.color: $textMain,
                   item.backgroundColor: $surfaceAlt, item.border.color: $border, item.border.width: 1}
        emphasis: {band.backgroundColor: $panelDark, label.color: $onPanelDark, header.color: $toneText,
                   cell.color: $toneText, cell.bold: "true"}
    aliases:                            # the left-blocks draft's names
      plain: native
      highlight_row: native             # the emphasis look of native
      zebra: {variant: native, stripe.backgroundColor: $surfaceAlt}
      dark_header: {variant: native, header.backgroundColor: $panelDark, header.color: $onPanelDark,
                    label.color: $accentText}
    styles:                             # recipes (prompt examples only)
      zebra: {stripe.backgroundColor: $surfaceAlt}
      dark_header: {header.backgroundColor: $panelDark, header.color: $onPanelDark, label.color: $accentText}
