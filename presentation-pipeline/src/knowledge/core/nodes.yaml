# pom-knowledge/core/nodes.yaml
# Node allowlist. Phase A = the 10-node MVP starting set.
# Every entry is verified against @hirokisakabe/pom v10.3.0:
#   - structural tags (Slide/Theme) handled by parseXml top-level rules
#   - node tags verified in registry NODE_METADATA
#   - inline tags verified in registry INLINE_FORMAT_TAG_LIST
# node_attributes lists ONLY the node-specific attributes; every layout/box
# attribute in core/attributes.yaml#common_attributes also applies unless noted.

meta:
  phase: A
  pom_version: "10.3.0"

phase_a_allowlist: [Slide, Theme, VStack, HStack, Text, B, I, Span, Mark, Shape]
phase_b_allowlist: [Chart, ChartSeries, ChartDataPoint, Ul, Ol, Li]   # + Phase A
phase_c_allowlist: [Table, Col, Tr, Td]                               # + Phase A + B
phase_d_allowlist: [Layer, Line, Arrow, Svg, A, U, S, Sub, Sup, Timeline, TimelineItem, Flow, FlowNode, FlowConnection]   # + Phase A + B + C
post_mvp_allowlist: [Matrix, MatrixAxes, MatrixQuadrants, MatrixItem, Tree, TreeItem, ProcessArrow, ProcessArrowStep, Pyramid, PyramidLevel]   # + all prior phases

# ── Structural (top level) ───────────────────────────────────────────────────
structural:
  Slide:
    kind: top-level
    description: "Wraps the content of a single slide. Mandatory. No attributes. Must have >= 1 child."
    children: "any content/layout node"
  Theme:
    kind: top-level
    description: >
      Declares named color tokens for the whole document. Optional, at most one,
      placed before the slides. Self-closing — no children.
    attributes: "each attribute name is a token name, value is a 6-digit hex color (# optional)"
    token_name_rule: "letters/digits/_/- ; must start with a letter"
    reference: "use $tokenName in any color attribute or gradient string"
    example: '<Theme surface="F7F9FC" surfaceAlt="FFFFFF" accent="2563EB" textMain="16202E" textMuted="55627A" border="E2E8F0" />'

# ── Layout nodes ─────────────────────────────────────────────────────────────
layout:
  VStack:
    description: "Vertical stack. Children flow top-to-bottom."
    node_attributes: [gap, alignItems, justifyContent, flexWrap]
    children: "any content/layout node"
    empty_ok: true   # <VStack grow=\"1\" /> is a valid transparent spacer
  HStack:
    description: "Horizontal stack. Children flow left-to-right."
    node_attributes: [gap, alignItems, justifyContent, flexWrap]
    children: "any content/layout node"
    empty_ok: true

# ── Content nodes ────────────────────────────────────────────────────────────
content:
  Text:
    description: "A run of text. Text content is the element body. Supports inline formatting children."
    node_attributes:
      - fontSize        # number, default 24
      - color           # hex
      - textAlign       # left | center | right
      - bold            # true | false
      - italic          # true | false
      - underline       # true | false
      - strike          # true | false
      - subscript       # true | false
      - superscript     # true | false
      - highlight       # hex
      - fontFamily      # string, default "Noto Sans JP"
      - lineHeight      # number, default 1.3
      - letterSpacing   # number (px)
      - textGradient    # linear-gradient string; overrides color
      - glow            # glow.size / glow.opacity / glow.color
      - outline         # outline.size / outline.color
      - rotate          # degrees clockwise (render-only)
    children: [B, I, A, U, S, Sub, Sup, Span, Mark]   # Phase D adds A, U, S, Sub, Sup
    font_size_guide: "Title 28-40 / Heading 18-24 / Body 13-16 / Caption 10-12"
  Shape:
    description: "A PowerPoint shape with optional centered text. Use for KPI dot indicators, accent bars, plates."
    node_attributes:
      - shapeType       # required; Phase A safe subset below
      - text            # string inside the shape
      - fill            # fill.color / fill.transparency
      - line            # line.color / line.width / line.dashType
      - outline         # alias for line (outline.size / outline.color)
      - glow            # glow.size / glow.opacity / glow.color
      - rotate          # degrees clockwise (render-only)
      # shapes also accept the Text styling attributes for their inner text:
      - fontSize
      - color
      - textAlign
      - bold
      - italic
      - underline
      - strike
      - subscript
      - superscript
      - highlight
      - fontFamily
      - lineHeight
    children: none
    phase_a_shapeType_subset: [rect, roundRect, ellipse, triangle, diamond, pentagon, hexagon, octagon, plus, chevron, rightArrow, leftArrow, upArrow, downArrow, star5, heart, cloud]
    shapeType_note: "178 shapeTypes exist; stick to the subset above for the MVP. Common: rect (accent bar), ellipse (dot indicator), roundRect (plate/button)."

# ── Inline formatting tags (only inside <Text>, <Li>, <Td>) ───────────────────
inline:
  B:  { property: bold,   attributes: none, example: "Plain <B>bold</B> text" }
  I:  { property: italic, attributes: none, example: "Plain <I>italic</I> text" }
  Mark:
    property: highlight
    attributes: [color]         # hex; default FFFF00
    example: '<Mark color="FDE047">highlighted</Mark>'
  Span:
    description: "Style a single run without a semantic meaning. Key MVP use: big-number + small-unit KPI numerals."
    attributes:
      color: hex
      fontFamily: "string (overrides parent fontFamily for this run)"
      fontSize: "number (overrides font size for this run)"
      letterSpacing: "number px (effective inside <Text> only)"
    example: '<Text fontSize="52" bold="true" color="1D4ED8">$84.2<Span fontSize="20">M</Span></Text>'
  A:
    property: hyperlink
    attributes: [href]
    required: [href]
    example: '<Text fontSize="16" color="$textMuted">See <A href="https://example.com">our docs</A> for details.</Text>'
  U:   { property: underline,      attributes: none, example: "Plain <U>underlined</U> text" }
  S:   { property: strikethrough,  attributes: none, example: "Was <S>$99</S> now $79" }
  Sub: { property: subscript,      attributes: none, example: "H<Sub>2</Sub>O" }
  Sup: { property: superscript,    attributes: none, example: "x<Sup>2</Sup>" }

# ── Phase B nodes (data viz + lists) ─────────────────────────────────────────
# Full reference: components/chart.yaml, components/list.yaml.
phase_b:
  Chart:
    description: "Native PowerPoint chart. Wraps >=1 ChartSeries. Needs explicit w AND h."
    node_attributes: [chartType, showLegend, showTitle, title, chartColors, radarStyle, sparkline]
    required: [chartType, w, h]
    children: [ChartSeries]
    chartType_values: [bar, line, pie, area, doughnut, radar]
  ChartSeries:
    description: "One data series. name shows in the legend."
    node_attributes: [name]
    children: [ChartDataPoint]
  ChartDataPoint:
    description: "One point. Self-closing, no text body."
    node_attributes: [label, value]
    required: [label, value]
    children: none
  Ul: { description: "Bullet list.", node_attributes: [fontSize, color, textAlign, bold, italic, strike, fontFamily, lineHeight], children: [Li] }
  Ol: { description: "Numbered list.", node_attributes: [fontSize, color, textAlign, bold, italic, strike, fontFamily, lineHeight, numberType, numberStartAt], children: [Li] }
  Li: { description: "List item. May contain inline tags.", node_attributes: [bold, italic, strike, subscript, superscript, underline, highlight, color, fontSize, fontFamily], children: [B, I, A, U, S, Sub, Sup, Span, Mark] }

# ── Phase C nodes (table) ───────────────────────────────────────────────────
# Full reference: components/table.yaml.
phase_c:
  Table:
    description: "Native table. Optional <Col> run, then <Tr> rows. First <Tr> is the header by convention."
    node_attributes: [defaultRowHeight, "cellBorder.color", "cellBorder.width", "cellBorder.dashType"]
    children: [Col, Tr]
  Col:
    description: "Column width. Self-closing."
    node_attributes: [width]   # NOTE: 'width', NOT 'w' — the one deliberate exception
    children: none
  Tr: { description: "Table row.", node_attributes: [height], children: [Td] }
  Td:
    description: "Table cell. Text body + inline tags."
    node_attributes: [fontSize, color, textAlign, bold, italic, underline, strike, subscript, superscript, highlight, fontFamily, backgroundColor, colspan, rowspan]
    children: [B, I, A, U, S, Sub, Sup, Span, Mark]   # Phase D adds A, U, S, Sub, Sup

# ── Phase D nodes (drawing + compound viz) ───────────────────────────────
# Full reference: components/drawing.yaml, components/timeline.yaml, components/flow.yaml.
phase_d:
  Layer:
    description: "Container for absolute positioning. Children use x/y for placement. Drawing order = document order."
    node_attributes: [w, h, padding, margin, backgroundColor, border, borderRadius, opacity, shadow]
    children: "any node — children must specify x and y"
    note: "Not a flex container. Use for free-form layouts, annotated diagrams, connector diagrams."
  Line:
    description: "Draw a straight line between two absolute coordinates. Not affected by Yoga layout."
    node_attributes: [x1, y1, x2, y2, color, lineWidth, dashType, beginArrow, endArrow]
    required: [x1, y1, x2, y2]
    children: none
    dashType_values: [solid, dash, dashDot, lgDash, lgDashDot, lgDashDotDot, sysDash, sysDashDot, sysDashDotDot, sysDot]
    arrow_syntax: 'endArrow="true" (default triangle) or endArrow.type="triangle|arrow|diamond|oval|stealth|none"'
  Arrow:
    description: "Connector between two elements by id reference. Auto-routes between shapes."
    node_attributes: [from, to, color, lineWidth, dashType, beginArrow, endArrow]
    required: [from, to]
    children: none
    connectable_to: "Text, Shape (rect/roundRect/ellipse only)"
    note: "Emits diagnostic if referenced id not found or target is unsupported."
  Svg:
    description: "Embed inline SVG graphics. Rasterised to PNG at render."
    node_attributes: [w, h, color]
    required: "inner <svg> child element"
    children: "<svg> element (required)"
    defaults: { w: 24, h: 24 }
    note: "color attribute sets stroke on the inner <svg>. Child elements with explicit stroke/fill override root."
  Timeline:
    description: "Timeline / roadmap visualization with connected milestones."
    node_attributes: [direction, dateColor, titleColor, descriptionColor, connectorColor, connectorGradient, useColorForDate, fontFamily, w, h]
    children: [TimelineItem]
    direction_values: [horizontal, vertical]
  TimelineItem:
    description: "Individual timeline milestone."
    node_attributes: [date, title, description, color, dateColor]
    required: [date, title]
    children: none
  Flow:
    description: "Flowchart with auto-layout. Wraps FlowNode and FlowConnection entries."
    node_attributes: [direction, nodeWidth, nodeHeight, nodeGap, connectorStyle, w, h]
    children: [FlowNode, FlowConnection]
    direction_values: [horizontal, vertical]
    defaults: { nodeWidth: 120, nodeHeight: 60, nodeGap: 80 }
  FlowNode:
    description: "Individual flowchart node / shape."
    node_attributes: [id, shape, text, color, textColor, width, height]
    required: [id, shape, text]
    children: none
    shape_values: [flowChartTerminator, flowChartProcess, flowChartDecision, flowChartInputOutput, flowChartDocument, flowChartPredefinedProcess, flowChartConnector, flowChartPreparation, flowChartManualInput, flowChartManualOperation, flowChartDelay, flowChartMagneticDisk]
  FlowConnection:
    description: "Connection / edge between two FlowNode entries."
    node_attributes: [from, to, label, color, labelColor]
    required: [from, to]
    children: none
    defaults: { labelColor: "64748B" }

# ── Post-MVP nodes (strategic diagrams) ──────────────────────────────────
# Full reference: components/matrix.yaml, components/tree.yaml, components/process-arrow.yaml, components/pyramid.yaml.
post_mvp:
  Matrix:
    description: "2x2 positioning map (BCG matrix, effort-impact grid). Coordinate system: (0,0) = bottom-left, (1,1) = top-right."
    node_attributes: [w, h, axisLabelColor, quadrantLabelColor, itemLabelColor]
    children: [MatrixAxes, MatrixQuadrants, MatrixItem]
    defaults: { axisLabelColor: "64748B", quadrantLabelColor: "94A3B8", itemLabelColor: "1E293B" }
  MatrixAxes:
    description: "Define axis labels for a Matrix."
    node_attributes: [x, y]
    required: [x, y]
    children: none
    note: "x and y are string labels (e.g. x='Effort', y='Impact'), NOT coordinates."
  MatrixQuadrants:
    description: "Label the four quadrants of a Matrix."
    node_attributes: [topLeft, topRight, bottomLeft, bottomRight]
    children: none
  MatrixItem:
    description: "Position an item on the Matrix by normalised coordinates."
    node_attributes: [label, x, y, color, textColor]
    required: [label, x, y]
    children: none
    note: "x and y are 0-1 normalised floats. (0,0)=bottom-left, (1,1)=top-right."
  Tree:
    description: "Hierarchical tree / org chart. Wraps a single root TreeItem."
    node_attributes: [layout, nodeShape, textColor, nodeWidth, nodeHeight, levelGap, siblingGap, connectorStyle, w, h]
    children: [TreeItem]
    layout_values: [vertical, horizontal]
    nodeShape_values: [rect, roundRect, ellipse]
    defaults: { textColor: "FFFFFF", nodeWidth: 120, nodeHeight: 40, levelGap: 60, siblingGap: 20 }
  TreeItem:
    description: "Individual tree node. Nests recursively."
    node_attributes: [label, color, textColor]
    required: [label]
    children: [TreeItem]
    note: "The one self-referencing node type — TreeItem nests inside TreeItem."
  ProcessArrow:
    description: "Chevron-style sequential process visualization."
    node_attributes: [direction, itemWidth, itemHeight, gap, fontSize, bold, italic, strike, underline, highlight, fontFamily, w, h]
    children: [ProcessArrowStep]
    direction_values: [horizontal, vertical]
    defaults: { itemWidth: 150, itemHeight: 80, fontSize: 14 }
  ProcessArrowStep:
    description: "Individual process step in a chevron."
    node_attributes: [label, color, textColor]
    required: [label]
    children: none
    defaults: { color: "4472C4", textColor: "FFFFFF" }
  Pyramid:
    description: "Pyramid visualization. Direction controls stacking: 'up' = first level is top/narrow, 'down' = first level is top/wide."
    node_attributes: [direction, fontSize, bold, fontFamily, w, h]
    children: [PyramidLevel]
    direction_values: [up, down]
    defaults: { direction: up, fontSize: 14, fontFamily: "Noto Sans JP" }
  PyramidLevel:
    description: "Individual pyramid layer."
    node_attributes: [label, color, textColor]
    required: [label]
    children: none
    defaults: { color: "4472C4", textColor: "FFFFFF" }

# ── Still deferred (NOT in the prompt yet) ───────────────────────────────
deferred:
  phase_b_more: [Image, Icon]
