# pom-knowledge/core/capacity.yaml
# The ONE place a component's capacity is stated. The slide component planner
# prompt renders these numbers (src/agents/capacity.py), the plan checks enforce
# them, and tests/unit/test_capacity.py fails when a prompt or knowledge file
# states a different number. Change a limit here, never in prose.
#
# A capacity is what the component can DRAW legibly on a 1280x720 slide at the
# 14 px font floor (verified renders, sizing notes in house-style.yaml). It is
# never a reason to drop content: past it, split into a second row /
# component, or choose another kind.

kpi_row:
  per_row: [2, 4]        # tiles in one row (5 left ~230 px tiles: width-bound numbers, 2026-10-07); more -> rows of equal tiles
table:
  max_rows: 10           # body rows; past it the slide squeezes and rows spill
  max_cols: 8
bullet_list:
  two_columns_from: 6    # 6+ points: two lists side by side
chart:
  min_points: 3          # fewer -> kpi_row
# Diagrams: the most items per DIRECTION (2026-10-21, user: more steps than fit across -> vertical,
# never merged or dropped to hit a number). Derived from the verified sizes in
# knowledge/components/{flow,process-arrow,timeline}.yaml `facts`, on the slide's main band:
#   1280 x 720 slide, padding 56 -> 1168 px wide; header (label + 36 px headline + gaps) ~110 px
#   -> a band ~500 px tall (720 - 112 - 110) for a diagram that is the slide's hero.
# Each item keeps POM's full size there (no scale-to-fit, so no smaller text, no broken words).
#   flow horizontal: nodes 120 x 60, nodeGap 80        n*120 + (n-1)*80 <= 1168 -> n <= 1248/200 = 6.2 -> 6
#   flow vertical:   one-line nodes 40 px (a 14 px line + 2 x 4.8 px insets), nodeGap 24 (box_for_direction)
#                                                       n*40 + (n-1)*24 <= 500   -> n <= 524/64  = 8.2 -> 8
#   process_arrow horizontal: chevrons interlock 28 px; itemWidth 176 holds a 100 px word ("Profitability",
#                    16 px bold) in its label box (176 - 0.7 x 80 - 2 x 9.6 px insets = 101)
#                                                       n*176 - (n-1)*28 <= 1168 -> n <= 1140/148 = 7.7 -> 7
#   process_arrow vertical: 80 px per step less 28 overlap  n*80 - (n-1)*28 <= 500 -> n <= 472/52 = 9.1 -> 9
#   timeline horizontal: 120 px labels centred on dots spread over the width (the outer ones 60 px in),
#                    12 px between labels               (n-1)*132 <= 1168 - 120 -> n <= 1048/132 + 1 = 8.9 -> 8
#   timeline vertical: natural 24 + 60 px per further item (date, title, a description line)
#                                                       24 + (n-1)*60 <= 500 -> n <= 476/60 + 1 = 8.9 -> 8
# Past the vertical limit too: group steps that belong together into one node (labels joined with " · ",
# word for word) or use card_grid steps. Code (enforce_capacity) turns a process_arrow / timeline past the
# limit of its own direction into a card_grid; a flow past it is only reported.
timeline:
  min_items: 3
  max_items: {horizontal: 8, vertical: 8}
  max_label_words: 3
process_arrow:
  min_items: 3
  max_items: {horizontal: 7, vertical: 9}
  max_label_words: 2
flow:
  min_items: 4
  max_items: {horizontal: 6, vertical: 8}
# Where the diagram sits (2026-10-22, user: limits per placement as measured facts). The most items that
# hold with fit-grow on (no broken word, overflow or text below 14 px), measured by the node break map
# (docs/eval/node-break-map/<kind>.md, labels of 2 words, timeline 3) and capped at the band's max_items
# above. Boxes: band 1168 x ~538 (the slide's main band); under_kpi 1168 x ~364 (a KPI row above it);
# split_60 ~665 x 538 and split_40 ~444 x 538 (the columns of a 60 / 40 slide); card ~560-680 x ~200-320.
#   process_arrow vertical: n*80 - (n-1)*28 <= H        band (538-28)/52 = 9.8 -> 9; under_kpi 336/52 = 6.5 -> 6;
#                                                       card ~300: 272/52 = 5.2 -> 5
#   process_arrow horizontal: fit-grow sizes the chevrons to the column, label room (W*0.97 + (n-1)*28)/n - 75 px:
#                    split_60 6 (55 px each), split_40 4 (54 px) for 2-word labels (measured); a longer word is
#                    the label-room check's (src/agents/label_room.py)
#   timeline horizontal: 120 px labels on dots >= 132 px apart   (n-1)*132 <= W - 120:
#                                                       split_60 545/132 + 1 = 5.1 -> 5; split_40 324/132 + 1 = 3.5 -> 3
#   timeline vertical: 24 + (n-1)*60 <= H               under_kpi 340/60 + 1 = 6.7 -> 6; card 276/60 + 1 = 5.6 -> 5
#   flow vertical: one-line nodes 28 px + gaps 20 (flow.vertical_one_line), so a 538 px column holds 10+; under a
#                    KPI row or in a card only 3 hold: fit-grow sizes the nodes for the box before later phases
#                    (the KPI row's growth) take height from it, and the flow is scaled below 14 px
#   flow horizontal: nodes at least 101 px for their words + gaps 20: split_60 6, split_40 4 (measured)
#   tree: layout horizontal grows sideways (good in a column), vertical spreads leaves across (good in a band)
placement:
  process_arrow: {horizontal: {band: 7, under_kpi: 7, split_60: 6, split_40: 4, card: 7},
                  vertical: {band: 9, under_kpi: 6, split_60: 9, split_40: 9, card: 5}}
  timeline: {horizontal: {band: 8, under_kpi: 8, split_60: 5, split_40: 3, card: 8},
             vertical: {band: 8, under_kpi: 6, split_60: 8, split_40: 8, card: 5}}
  flow: {horizontal: {band: 6, under_kpi: 6, split_60: 6, split_40: 4, card: 6},
         vertical: {band: 8, under_kpi: 3, split_60: 8, split_40: 8, card: 3}}
  tree: {horizontal: {band: 8, under_kpi: 6, split_60: 8, split_40: 8, card: 5},
         vertical: {band: 8, under_kpi: 8, split_60: 4, split_40: 3, card: 7}}
matrix:
  items: [3, 4]          # dots and labels overlap past 4 (recipes.yaml matrix)
pyramid:
  items: [3, 5]
card_grid:
  items: [2, 12]
  per_row: [2, 4]          # the plan check writes per_row (7 -> 4 + 3, 9 -> 3 + 3 + 3)
  steps_max: 5             # one row joined by arrows, full slide width; more -> grid

# The generator's layout rules (2026-10-07, user: "add an LLM-level rule" for layouts code does
# not fix; adapted from a 1920x1080 reference deck guide, scaled to 1280x720). Rendered by
# src/agents/capacity.py layout_rules() into the generator prompt; state the numbers only here.
layout:
  kpi_tile_min_w: 260        # px; narrower tiles cap the number's size
  hero_number_px: [64, 120]  # one number the headline rests on (fit-grow HERO_CAP 120)
  paired_cards: 2            # two metrics compared: two equal cards side by side
  grid_gap_px: [20, 24]      # between cards in a grid, equal widths per row
  table_cols_half: 3         # columns a table may have in a half-width card; more -> full width
  table_row_px: [56, 88]     # body row height (2026-10-08: 22px cells need room)
  side_card_w: ["35%", "40%"]   # a takeaway card beside a chart / table; the evidence takes the rest
  split: ["60/40", "40/60"]  # two-column slides: the evidence side is the wider one, never 50/50 by default
