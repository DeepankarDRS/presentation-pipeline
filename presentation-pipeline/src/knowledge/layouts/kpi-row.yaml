# pom-knowledge/layouts/kpi-row.yaml
# Title + a horizontal row of equal KPI tiles.
# Source: llm.txt "KPI Tile with Dot Indicator" pattern, adapted to the MVP dark
# theme. Verified: pom-knowledge/examples/kpi-slide.xml and mixed-slide.xml.

meta:
  phase: B
  name: kpi-row
  use_when:
    - "a slide whose job is to show 2-4 headline metrics"
    - "the KPI row inside a denser executive slide"
  nodes_used: [Slide, Theme, VStack, HStack, Text, Span, Shape]

structure: >
  <Slide> > root <VStack> (w=1280 h=720, padding 56-72, gap 20-28,
  backgroundColor=$surface, alignItems="start") containing:
  1. a title <Text> (fontSize 34-40, bold, color=$textMain)
  2. optional accent rule <Shape shapeType="rect" w="120" h="6" backgroundColor="$accent" />
  3. an <HStack> (w set to slide width minus padding, gap 24-32,
     justifyContent="spaceBetween") of 2-4 tile <VStack>s.
  Each tile <VStack>: grow="1", equal h (120-320), padding 20-28, gap 8-12,
  backgroundColor="$surfaceAlt", borderRadius 12, justifyContent="center", and
  either borderTop.width="4" borderTop.color="$accent" OR an inner dot
  (<Shape shapeType="ellipse" w="10" h="10" ...>) next to the label.
  Tile contents in order: muted label <Text>, large bold value <Text> with the
  unit in a smaller <Span> on the same baseline, short delta <Text>
  (color=$positive up / $negative down / $textMuted flat).

rules:
  - "All tiles share one grow value (grow=\"1\") and one explicit h so the row is even."
  - "Put the unit in <Span fontSize> INSIDE the value <Text> so digit and unit share a baseline."
  - "2-4 tiles. 5+ gets cramped at 1280 wide — split the slide."
  - "gap on the HStack, not margins on the tiles."
  - "On a light theme where $surfaceAlt is near-white, add border.width=\"1\" border.color=\"$border\" so the tile reads as a card against $surface."

verified_example: |
  <Theme surface="F7F9FC" surfaceAlt="FFFFFF" accent="2563EB" accentAlt="0EA5E9" positive="15803D" negative="DC2626" warning="B45309" textMain="16202E" textMuted="55627A" border="E2E8F0" />
  <Slide>
    <VStack w="1280" h="720" padding="64" gap="36" backgroundColor="$surface" alignItems="start">
      <Text fontSize="40" bold="true" color="$textMain">Key Metrics — Q3 FY26</Text>
      <HStack w="1152" h="320" gap="32" justifyContent="spaceBetween">
        <VStack grow="1" h="320" padding="28" gap="12" backgroundColor="$surfaceAlt" borderRadius="12" border.width="1" border.color="$border" borderTop.width="4" borderTop.color="$accent" justifyContent="center">
          <HStack gap="10" alignItems="center">
            <Shape shapeType="ellipse" w="12" h="12" backgroundColor="$positive" />
            <Text fontSize="18" color="$textMuted">Annual Recurring Revenue</Text>
          </HStack>
          <Text fontSize="46" bold="true" color="$textMain">$42.8<Span fontSize="22">M</Span></Text>
          <Text fontSize="16" color="$positive">+18% QoQ</Text>
        </VStack>
      </HStack>
    </VStack>
  </Slide>

compile_status: "verified — pom-knowledge/examples/kpi-slide.xml compiles on v10.3.0"
