meta:
  phase: B
  name: full-width-chart
  use_when:
    - "the chart IS the slide — data visualization dominates"
    - "trend over time, distribution, or comparison with many categories"
    - "chart + optional caption/legend below, no competing column"
  nodes_used: [Slide, Theme, VStack, HStack, Chart, ChartSeries, ChartDataPoint, Text, Shape]

structure: >
  Building blocks — position and size per layout_hint:

  TITLE ROW — two variants:
    Simple: <Text fontSize=28-34 bold="true" color="$textMain">Chart title</Text>
    With badge (shows period/status inline):
      <HStack w=full-width justifyContent="spaceBetween" alignItems="center">
        <Text fontSize=28-34 bold="true" color="$textMain">Chart title</Text>
        <HStack gap=8 alignItems="center" padding.top="8" padding.bottom="8"
                padding.left="14" padding.right="14"
                backgroundColor="$surfaceAlt" borderRadius=20
                border.width=1 border.color="$border">
          <Shape shapeType="ellipse" w=8 h=8 backgroundColor="$positive" OR "$negative" />
          <Text fontSize=13 color="$textMuted">Q3 FY26</Text>
        </HStack>
      </HStack>

  SUBTITLE (optional):
    <Text fontSize=14-16 color="$textMuted">Metric name + unit + date range</Text>

  CHART AREA — two variants based on theme:
    Light theme (no wrapper needed):
      <Chart chartType="bar|line|area|doughnut" w=1168-1184 h=360-440
             showLegend="false" chartColors='["hex1","hex2","hex3","hex4","hex5"]'>
        <ChartSeries name="Series label">
          <ChartDataPoint label="..." value="..." />
        </ChartSeries>
      </Chart>
    Dark theme (wrap to fix hardcoded black axes):
      <VStack backgroundColor="$chartSurface" padding=16 borderRadius=12>
        <Chart chartType="..." w=OUTER_W-(2*16) h=360-440
               showLegend="false" chartColors='["hex1","hex2","hex3","hex4","hex5"]'>
          ...
        </Chart>
      </VStack>

  LEGEND ROW (optional) — manual construction, NOT a text string:
    <HStack gap=20-28 alignItems="center" padding.top=8>
      (per series:)
      <HStack gap=6 alignItems="center">
        <Shape shapeType="rect" w=20 h=4 backgroundColor=SERIES_COLOR borderRadius=2 />
        <Text fontSize=13 color="$textMuted">Series name</Text>
      </HStack>
    </HStack>

  FOOTNOTE (optional):
    <Text fontSize=12 color="$textMuted">Source or methodology note</Text>

rules:
  - "Chart w = slide w minus 2× horizontal padding (1280 - 2×48 = 1184). Respect this math."
  - "Chart h 360-440 — leave room for title + optional caption. Never h=720."
  - "Always set showLegend=\"false\" — suppress the auto-legend when using a manual legend HStack below."
  - "chartColors: pass literal hex, NOT $tokens. For >3 bars or multiple series, pass the full palette sequence (5 values) so bars/lines are distinguishable — a single color makes every bar identical."
  - "On a dark palette wrap Chart in <VStack backgroundColor=\"$chartSurface\" padding=\"16\" borderRadius=\"12\"> or axes render black-on-dark (invisible)."
  - "Legend is a manual HStack of colored rect shapes + Text — never a single <Text> with comma-separated names."
  - "Use at least 4 data points. Two bars is a KPI comparison, not a chart."

verified_example: |
  <Theme surface="F7F9FC" surfaceAlt="FFFFFF" accent="2563EB" accentAlt="0EA5E9" positive="15803D" negative="DC2626" warning="B45309" textMain="16202E" textMuted="55627A" border="E2E8F0" />
  <Slide>
    <VStack w="1280" h="720" padding="72" gap="24" backgroundColor="$surface" alignItems="start">
      <Text fontSize="40" bold="true" color="$textMain">Revenue by Quarter</Text>
      <Shape shapeType="rect" w="120" h="6" backgroundColor="$accent" />
      <Chart chartType="bar" w="1136" h="452" showLegend="false" chartColors='["2563EB"]'>
        <ChartSeries name="Revenue ($M)">
          <ChartDataPoint label="Q2 FY25" value="28.4" />
          <ChartDataPoint label="Q3 FY25" value="31.2" />
          <ChartDataPoint label="Q4 FY25" value="34.9" />
          <ChartDataPoint label="Q1 FY26" value="37.1" />
          <ChartDataPoint label="Q2 FY26" value="40.3" />
          <ChartDataPoint label="Q3 FY26" value="42.8" />
        </ChartSeries>
      </Chart>
      <Text fontSize="16" italic="true" color="$textMuted">Revenue grew 51% over six quarters, up 6.2% quarter over quarter in Q3 FY26.</Text>
    </VStack>
  </Slide>
