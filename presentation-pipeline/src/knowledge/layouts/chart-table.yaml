# pom-knowledge/layouts/chart-table.yaml
# Title, then a chart and a table side by side (a specialization of two-column).
# Verified: pom-knowledge/examples/mixed-slide.xml (chart+table row).

meta:
  phase: BC
  name: chart-table
  use_when:
    - "a metric's trajectory (chart) shown next to the numbers behind it (table)"
    - "the lower half of a dense executive slide"
  nodes_used: [Slide, Theme, VStack, HStack, Text, Chart, ChartSeries, ChartDataPoint, Table, Col, Tr, Td]

structure: >
  Title <Text> + optional accent rule, then an <HStack> (w = slide width minus
  padding, gap 24-32, alignItems="start") with two <VStack> columns of equal
  explicit width (e.g. w="572" each when padding is 56).
  Left column: a small caption <Text> then a <Chart> sized w = column width,
  h = column height minus the caption (~300).
  Right column: a small caption <Text> then a <Table> whose <Col> widths sum to
  the column width.

rules:
  - "Chart needs explicit w AND h — set them to the column dimensions, not \"max\"."
  - "Table <Col> widths must sum to (roughly) the right column width."
  - "Keep chart data and table data consistent — same periods, same figures."
  - "Watch total height: title + accent + gap + row height must stay <= 720 - 2*padding. Use defaultRowHeight 44-52 to keep a 3-4 row table compact."
  - "EVERY <Td> gets an explicit backgroundColor AND color (header: $surfaceAlt/$textMain; body: $surface/$textMuted or $textMain). cellBorder.color=\"$border\"."
  - "On a DARK theme, wrap the <Chart> in <VStack backgroundColor=\"$chartSurface\" padding=\"16\" borderRadius=\"12\"> — POM v10.3.0 always draws axis text in black. On a light theme the chart sits directly on $surface."
  - "chartColors is LITERAL hex (no $tokens). Use the active palette's chartColors sequence."

verified_example: |
  <Theme surface="F7F9FC" surfaceAlt="FFFFFF" accent="2563EB" accentAlt="0EA5E9" positive="15803D" negative="DC2626" warning="B45309" textMain="16202E" textMuted="55627A" border="E2E8F0" />
  <Slide>
    <VStack w="1280" h="720" padding="56" gap="20" backgroundColor="$surface" alignItems="start">
      <Text fontSize="34" bold="true" color="$textMain">New Bookings — Last 4 Quarters</Text>
      <Shape shapeType="rect" w="120" h="6" backgroundColor="$accent" />
      <HStack w="1168" h="420" gap="24" alignItems="start">
        <VStack w="572" h="420" gap="8">
          <Text fontSize="14" color="$textMuted">Bookings ($M)</Text>
          <Chart chartType="bar" w="572" h="388" showLegend="false" chartColors='["2563EB"]'>
            <ChartSeries name="Bookings">
              <ChartDataPoint label="Q4 FY25" value="8.1" />
              <ChartDataPoint label="Q1 FY26" value="9.4" />
              <ChartDataPoint label="Q2 FY26" value="10.2" />
              <ChartDataPoint label="Q3 FY26" value="12.0" />
            </ChartSeries>
          </Chart>
        </VStack>
        <VStack w="572" h="420" gap="8">
          <Text fontSize="14" color="$textMuted">Detail</Text>
          <Table defaultRowHeight="48" cellBorder.color="$border" cellBorder.width="1">
            <Col width="212" />
            <Col width="180" />
            <Col width="180" />
            <Tr>
              <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain">Quarter</Td>
              <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain" textAlign="right">Bookings</Td>
              <Td bold="true" backgroundColor="$surfaceAlt" color="$textMain" textAlign="right">Win Rate</Td>
            </Tr>
            <Tr>
              <Td backgroundColor="$surface" color="$textMuted">Q3 FY26</Td>
              <Td backgroundColor="$surface" color="$textMain" textAlign="right">$12.0M</Td>
              <Td backgroundColor="$surface" color="$textMain" textAlign="right">27%</Td>
            </Tr>
          </Table>
        </VStack>
      </HStack>
    </VStack>
  </Slide>

  # DARK-theme variant of the chart column (POM draws axis text black either way):
  #   <VStack w="572" h="420" gap="8">
  #     <Text fontSize="14" color="$textMuted">Bookings ($M)</Text>
  #     <VStack w="572" h="388" backgroundColor="$chartSurface" borderRadius="12" padding="16">
  #       <Chart chartType="bar" w="540" h="356" showLegend="false" chartColors='["60A5FA"]'> ... </Chart>
  #     </VStack>
  #   </VStack>

compile_status: "verified clean on v10.3.0 (see pom-knowledge/examples/mixed-slide.xml)"
