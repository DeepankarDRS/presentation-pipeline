meta:
  phase: A
  name: hero-statement
  use_when:
    - "cover slide or section break with a bold central message"
    - "opening statement with high visual impact, minimal elements"
    - "closing slide with a single call to action or quote"
  nodes_used: [Slide, Theme, VStack, HStack, Text, Shape]

structure: >
  Building blocks available for this pattern — combine per layout_hint:

  OUTER CONTAINER — two variants:
    Centered (default for covers/breaks):
      <VStack w=1280 h=720 padding=72-96 gap=20-32
              alignItems="center" justifyContent="center"
              backgroundColor="$surface" OR "$accent">
    Left-anchored (for statement slides with supporting detail):
      <VStack w=1280 h=720 padding=72-96 gap=20-32
              alignItems="start" justifyContent="center"
              backgroundColor="$surface">

  EYEBROW (optional) — category label or section number:
    <Text fontSize=13-15 bold="true" color="$accentAlt" OR "FFFFFF">
      SECTION 02  (or similar short label)
    </Text>

  HEADLINE — the dominant element, must visually dominate:
    <Text fontSize=52-72 bold="true" color="$textMain" OR "FFFFFF"
          textAlign="center" (if centered container)>
      Short punchy statement — max 10 words
    </Text>

  ACCENT BAR (optional) — visual rhythm between headline and subtitle:
    <Shape shapeType="rect" w=60-100 h=4-6 backgroundColor="$accentAlt" />

  SUBTITLE (optional) — one sentence of context:
    <Text fontSize=18-22 color="$textMuted" OR "FFFFFF"
          textAlign="center" (if centered)>

rules:
  - "No charts, tables, or KPI tiles — this pattern is text-only impact."
  - "Headline at fontSize 52-72 minimum. Smaller defeats the purpose of the pattern."
  - "On an $accent background: headline color=FFFFFF, subtitle color=FFFFFF (readers cannot see $textMuted on colored bg)."
  - "Padding 72-96 — whitespace is the visual weight here, not content density."
  - "Centered container: textAlign=center on ALL children. Left-anchored: no textAlign needed."
  - "The accent bar (if used) goes BETWEEN headline and subtitle to create visual breathing room."

verified_example: |
  <Theme surface="F7F9FC" accent="2563EB" accentAlt="0EA5E9" textMain="16202E" textMuted="55627A" />
  <Slide>
    <VStack w="1280" h="720" padding="80" gap="24" backgroundColor="$accent"
            alignItems="center" justifyContent="center">
      <Text fontSize="14" bold="true" color="FFFFFF" textAlign="center">SECTION 02</Text>
      <Text fontSize="64" bold="true" color="FFFFFF" textAlign="center">
        Growth Is Accelerating.
      </Text>
      <Shape shapeType="rect" w="72" h="5" backgroundColor="$accentAlt" />
      <Text fontSize="20" color="FFFFFF" textAlign="center">
        Three metrics that define our trajectory in FY26.
      </Text>
    </VStack>
  </Slide>
