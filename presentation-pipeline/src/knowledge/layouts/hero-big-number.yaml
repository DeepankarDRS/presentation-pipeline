meta:
  phase: B
  name: hero-big-number
  use_when:
    - "one metric deserves the full slide — announcing a milestone"
    - "kpi_row with 1-2 tiles where the number IS the message"
    - "revenue, users, growth rate highlight slide"
  nodes_used: [Slide, Theme, VStack, HStack, Text, Span, Shape]

structure: >
  Building blocks available — position per layout_hint:

  EYEBROW — metric category label:
    <Text fontSize=12-14 bold="true" color="$accentAlt">
      METRIC CATEGORY LABEL (e.g. ANNUAL RECURRING REVENUE)
    </Text>

  HERO NUMBER — the dominant element:
    <Text fontSize=80-120 bold="true" color="$textMain">
      VALUE<Span fontSize=36-56 color="$textMuted">unit</Span>
    </Text>
    — unit (M, %, x, K) always in a Span inside the same Text element

  DELTA ROW — direction + magnitude + comparison context:
    <HStack gap=12-20 alignItems="center">
      direction indicator: <Shape shapeType="ellipse" w=10-14 h=10-14
                                  backgroundColor="$positive" OR "$negative" />
      delta text: <Text fontSize=20-26 color="$positive" OR "$negative">+18% QoQ</Text>
      optional separator: <Shape shapeType="rect" w=1 h=20-28 backgroundColor="$border" />
      comparison context: <Text fontSize=16-18 color="$textMuted">vs. prior period</Text>
    </HStack>

  DIVIDER (optional):
    <Shape shapeType="rect" w=full-width h=1 backgroundColor="$border" />

  SUPPORTING STATS (optional, subordinate to hero) — two variants:
    Variant A — horizontal row, NO card background:
      <HStack gap=40-64 alignItems="start">
        <VStack gap=4>
          <Text fontSize=12-13 color="$textMuted">Label</Text>
          <Text fontSize=24-30 bold="true" color="$textMain">Value</Text>
        </VStack>
        (repeat 2-3 times)
      </HStack>
    Variant B — single additional metric with brief narrative:
      <Text fontSize=16-18 color="$textMain">One sentence of context about the metric.</Text>

rules:
  - "Hero number fontSize 80-120 — if it feels too big you are on the right track."
  - "Unit in <Span fontSize> INSIDE the hero Text — both on one baseline, unit visually smaller."
  - "Supporting stats have NO card background ($surfaceAlt) — they are subordinate, not competing KPIs."
  - "Only one hero number per slide — if all 3-4 metrics are equal weight, use three_column_cards instead."
  - "Delta row uses a shape (ellipse/triangle) for direction, not just colored text — it reads at a glance."

verified_example: |
  <Theme surface="F7F9FC" surfaceAlt="FFFFFF" accent="2563EB" accentAlt="0EA5E9"
         positive="15803D" negative="DC2626" textMain="16202E" textMuted="55627A" border="E2E8F0" />
  <Slide>
    <VStack w="1280" h="720" padding="72" gap="20" backgroundColor="$surface" alignItems="start">
      <Text fontSize="13" bold="true" color="$accentAlt">ANNUAL RECURRING REVENUE</Text>
      <Text fontSize="104" bold="true" color="$textMain">$42.8<Span fontSize="48" color="$textMuted">M</Span></Text>
      <HStack gap="16" alignItems="center">
        <Shape shapeType="ellipse" w="12" h="12" backgroundColor="$positive" />
        <Text fontSize="24" color="$positive">+18% QoQ</Text>
        <Shape shapeType="rect" w="1" h="24" backgroundColor="$border" />
        <Text fontSize="18" color="$textMuted">vs. $36.3M in Q2 FY26</Text>
      </HStack>
      <Shape shapeType="rect" w="1136" h="1" backgroundColor="$border" />
      <HStack gap="56" alignItems="start">
        <VStack gap="4">
          <Text fontSize="13" color="$textMuted">Net Revenue Retention</Text>
          <Text fontSize="28" bold="true" color="$textMain">114%</Text>
        </VStack>
        <VStack gap="4">
          <Text fontSize="13" color="$textMuted">Gross Margin</Text>
          <Text fontSize="28" bold="true" color="$textMain">78%</Text>
        </VStack>
        <VStack gap="4">
          <Text fontSize="13" color="$textMuted">New Logos (Q3)</Text>
          <Text fontSize="28" bold="true" color="$textMain">47</Text>
        </VStack>
      </HStack>
    </VStack>
  </Slide>
